[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.2.2"
description = "Host-side MCP gateway and libvirt orchestration for isolated agent VMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "croniter>=6.2.2",
  "httpx>=0.28.1",
  "mcp>=1.9.0",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.26",
  "starlette>=0.52.0",
  "typer>=0.12.3",
  "uvicorn>=0.42.0",
  "websockets>=15.0.1",
  "PyYAML>=6.0.2",
  "PyJWT[crypto]>=2.10.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.8",
]

[project.entry-points."agent_sandbox.providers"]
builtin = "agent_sandbox.providers.builtin:register_providers"

[project.entry-points."agent_sandbox.addons"]
team = "truman_team_addon:register_addon"

[project.scripts]
agent-sandbox-gateway = "agent_sandbox.gateway:main"
agent-sandbox-openai-relay = "agent_sandbox.relays.openai:main"
agent-sandbox-http-target-relay = "agent_sandbox.relays.http_target:main"
agent-sandbox-nuget-relay = "agent_sandbox.relays.nuget:main"
agent-sandbox-didww-sip-bridge = "agent_sandbox.didww_sip_bridge:main"
agent-sandbox-npm-audit-facade = "agent_sandbox.relays.npm_audit_facade:main"
agent-sandbox-ado-worker = "agent_sandbox.daemons.ado_issue_worker:main"
agent-sandbox-proxy-issue-sync = "agent_sandbox.daemons.proxy_issue_sync:main"
agent-sandbox-discord-ingest = "agent_sandbox.messaging.discord_ingest:main"
agent-sandbox-teams-meeting-ingest = "agent_sandbox.messaging.teams_meeting_ingest:main"
agent-sandbox-discord-wake = "agent_sandbox.messaging.discord_wake:main"
agent-sandbox-effect-orchestrator = "agent_sandbox.daemons.effect_orchestrator:main"
agent-sandbox-scheduled-wake = "agent_sandbox.messaging.scheduled_wake:main"
agent-sandbox-worker-daemon = "agent_sandbox.worker_daemon:main"
agent-sandbox-cli = "agent_sandbox.cli:app"
agent-sandbox-admin-web = "agent_sandbox.admin.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_sandbox = ["templates/*.md", "workflow/builtin_packs/*.json"]
truman_team_addon = ["ui_static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
