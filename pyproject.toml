[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-sandbox"
version = "0.1.0"
description = "Host-side MCP gateway and libvirt orchestration for isolated agent VMs."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.1",
  "mcp>=1.9.0",
  "pydantic>=2.8.0",
  "starlette>=0.52.0",
  "typer>=0.12.3",
  "uvicorn>=0.42.0",
  "websockets>=15.0.1",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.8",
]
desktop = [
  "PySide6>=6.8.0",
]

[project.scripts]
agent-sandbox-gateway = "agent_sandbox.gateway:main"
agent-sandbox-openai-relay = "agent_sandbox.openai_relay:main"
agent-sandbox-http-target-relay = "agent_sandbox.http_target_relay:main"
agent-sandbox-nuget-relay = "agent_sandbox.nuget_relay:main"
agent-sandbox-ado-worker = "agent_sandbox.ado_issue_worker:main"
agent-sandbox-discord-ingest = "agent_sandbox.discord_ingest_worker:main"
agent-sandbox-issue-orchestrator = "agent_sandbox.issue_orchestrator:main"
agent-sandbox-effect-orchestrator = "agent_sandbox.effect_orchestrator:main"
agent-sandbox-cli = "agent_sandbox.cli:app"
agent-sandbox-admin = "agent_sandbox.admin_app:main"
agent-sandbox-admin-web = "agent_sandbox.admin_web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
