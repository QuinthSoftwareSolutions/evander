trigger:
  - main

lockBehavior: runLatest

pr: none

parameters:
  - name: agentPoolName
    displayName: Agent pool
    type: string
    default: "Azure Pipelines"
  - name: inventoryPath
    displayName: Ansible inventory path
    type: string
    default: ansible/inventory/azure.yml
  - name: controlPlaneTarget
    displayName: Control-plane deployment target
    type: string
    default: all
    values:
      - all
      - truman-control-plane
  - name: workerTarget
    displayName: Worker deployment target
    type: string
    default: all
    values:
      - all
      - truman-worker-1
  - name: controlPlaneSshKeySecureFile
    displayName: Control-plane SSH key secure file
    type: string
    default: truman-control-center_key.pem
  - name: workerSshKeySecureFile
    displayName: Worker SSH key secure file
    type: string
    default: truman-worker-1_key.pem
  - name: azureServiceConnection
    displayName: Azure Resource Manager service connection
    type: string
    default: truman-azure-rm
  - name: controlPlanePublicIp
    displayName: Control-plane public IP
    type: string
    default: 52.158.33.185
  - name: controlPlaneSshNsgResourceGroup
    displayName: Control-plane SSH NSG resource group
    type: string
    default: auto
  - name: controlPlaneSshNsgName
    displayName: Control-plane SSH NSG name
    type: string
    default: auto
  - name: hostCodexNpmPackage
    displayName: Host Codex npm package
    type: string
    default: "@openai/codex"
  - name: dotnetSdkVersion
    displayName: Worker .NET SDK version
    type: string
    default: "10.0.x"

variables:
  AGENT_SANDBOX_REPO_VERSION: $(Build.SourceVersion)
  ANSIBLE_FORCE_COLOR: "true"
  ANSIBLE_INVENTORY: ${{ parameters.inventoryPath }}
  CONTROL_PLANE_TARGET: ${{ parameters.controlPlaneTarget }}
  PYTHONUNBUFFERED: "1"
  WORKER_TARGET: ${{ parameters.workerTarget }}

stages:
  - stage: DeployControlPlane
    displayName: Deploy control plane
    jobs:
      - deployment: ControlPlane
        displayName: Run ansible/site.yml
        environment: agent-sandbox-control-plane
        pool:
          name: ${{ parameters.agentPoolName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  fetchDepth: 0

                - task: DownloadSecureFile@1
                  name: controlPlaneSshKey
                  displayName: Download control-plane SSH key
                  inputs:
                    secureFile: ${{ parameters.controlPlaneSshKeySecureFile }}

                - task: AzureCLI@2
                  name: allowControlPlaneSsh
                  displayName: Temporarily allow control-plane SSH from build agent
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      resolve_control_plane_nsg() {
                        if [ "$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP" != "auto" ] || [ "$CONTROL_PLANE_SSH_NSG_NAME" != "auto" ]; then
                          if [ "$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP" = "auto" ] || [ "$CONTROL_PLANE_SSH_NSG_NAME" = "auto" ]; then
                            echo "Set both controlPlaneSshNsgResourceGroup and controlPlaneSshNsgName, or leave both as auto." >&2
                            return 1
                          fi
                          resolved_nsg_resource_group="$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP"
                          resolved_nsg_name="$CONTROL_PLANE_SSH_NSG_NAME"
                          return 0
                        fi

                        public_ip_id="$(az network public-ip list --query "[?ipAddress=='${CONTROL_PLANE_PUBLIC_IP}'].id | [0]" -o tsv)"
                        if [ -z "$public_ip_id" ]; then
                          echo "Could not find an Azure public IP resource with address ${CONTROL_PLANE_PUBLIC_IP}." >&2
                          return 1
                        fi

                        ip_config_id="$(az network public-ip show --ids "$public_ip_id" --query "ipConfiguration.id" -o tsv)"
                        if [ -z "$ip_config_id" ]; then
                          echo "Public IP ${CONTROL_PLANE_PUBLIC_IP} is not attached to a NIC IP configuration." >&2
                          return 1
                        fi

                        nic_id="${ip_config_id%/ipConfigurations/*}"
                        nsg_id="$(az network nic show --ids "$nic_id" --query "networkSecurityGroup.id" -o tsv)"
                        if [ -z "$nsg_id" ]; then
                          subnet_id="$(az network nic show --ids "$nic_id" --query "ipConfigurations[0].subnet.id" -o tsv)"
                          if [ -n "$subnet_id" ]; then
                            nsg_id="$(az network vnet subnet show --ids "$subnet_id" --query "networkSecurityGroup.id" -o tsv)"
                          fi
                        fi
                        if [ -z "$nsg_id" ]; then
                          echo "Could not resolve an NSG from public IP ${CONTROL_PLANE_PUBLIC_IP}; set controlPlaneSshNsgResourceGroup and controlPlaneSshNsgName explicitly." >&2
                          return 1
                        fi

                        resolved_nsg_name="${nsg_id##*/}"
                        nsg_rg_part="${nsg_id#*/resourceGroups/}"
                        resolved_nsg_resource_group="${nsg_rg_part%%/*}"
                      }

                      first_available_priority() {
                        local used_priorities
                        used_priorities="$(az network nsg rule list \
                          --resource-group "$resolved_nsg_resource_group" \
                          --nsg-name "$resolved_nsg_name" \
                          --query "[].priority" \
                          -o tsv)"
                        local priority
                        for priority in $(seq 3000 4096); do
                          if ! printf '%s\n' "$used_priorities" | grep -qx "$priority"; then
                            printf '%s\n' "$priority"
                            return 0
                          fi
                        done
                        echo "No free NSG priority found in range 3000-4096." >&2
                        return 1
                      }

                      resolve_control_plane_nsg
                      agent_ip="$(curl -fsS https://api.ipify.org)"
                      rule_name="Allow-AzurePipelines-SSH-Control-$(Build.BuildId)"
                      priority="$(first_available_priority)"

                      az network nsg rule create \
                        --resource-group "$resolved_nsg_resource_group" \
                        --nsg-name "$resolved_nsg_name" \
                        --name "$rule_name" \
                        --priority "$priority" \
                        --direction Inbound \
                        --access Allow \
                        --protocol Tcp \
                        --source-address-prefixes "$agent_ip/32" \
                        --destination-port-ranges 22 \
                        --description "Temporary SSH access for Azure Pipelines build $(Build.BuildId)"

                      echo "Allowed ${agent_ip}/32 to ${resolved_nsg_resource_group}/${resolved_nsg_name} as ${rule_name}."
                  env:
                    CONTROL_PLANE_PUBLIC_IP: ${{ parameters.controlPlanePublicIp }}
                    CONTROL_PLANE_SSH_NSG_NAME: ${{ parameters.controlPlaneSshNsgName }}
                    CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP: ${{ parameters.controlPlaneSshNsgResourceGroup }}

                - bash: |
                    set -euo pipefail

                    export PATH="$HOME/.local/bin:$PATH"
                    if ! command -v ansible-playbook >/dev/null 2>&1; then
                      python3 -m pip install --user ansible-core
                    fi

                    echo "##vso[task.prependpath]$HOME/.local/bin"
                    ansible-playbook --version
                  displayName: Ensure Ansible is available

                - bash: |
                    set -euo pipefail

                    unexpanded_vault_macro='$''(ANSIBLE_VAULT_PASSWORD)'
                    if [ "${ANSIBLE_VAULT_PASSWORD:-}" = "$unexpanded_vault_macro" ]; then
                      echo "Azure Pipelines did not expand the ANSIBLE_VAULT_PASSWORD variable." >&2
                      echo "Define ANSIBLE_VAULT_PASSWORD on this YAML pipeline, or include and authorize the variable group that contains it." >&2
                      exit 1
                    fi
                    if [ -z "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
                      echo "Azure Pipelines expanded ANSIBLE_VAULT_PASSWORD, but the value is empty." >&2
                      echo "Set a non-empty secret value on this pipeline or in its linked variable group." >&2
                      exit 1
                    fi
                    if [ -z "${AGENT_SANDBOX_CONTROL_PLANE_SSH_KEY_FILE:-}" ]; then
                      echo "Control-plane SSH key secure file was not downloaded." >&2
                      exit 1
                    fi
                    chmod 600 "$AGENT_SANDBOX_CONTROL_PLANE_SSH_KEY_FILE"

                    vault_file="$PIPELINE_WORKSPACE/.ansible-vault-pass"
                    umask 077
                    printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$vault_file"
                    trap 'rm -f "$vault_file"' EXIT

                    limit_args=()
                    if [ "${CONTROL_PLANE_TARGET:-all}" != "all" ]; then
                      limit_args=(--limit "$CONTROL_PLANE_TARGET")
                    fi

                    ansible-playbook \
                      -i "$ANSIBLE_INVENTORY" \
                      --vault-password-file "$vault_file" \
                      -e "agent_sandbox_repo_version=$AGENT_SANDBOX_REPO_VERSION" \
                      "${limit_args[@]}" \
                      ansible/site.yml
                  displayName: Deploy control plane with Ansible
                  env:
                    AGENT_SANDBOX_CONTROL_PLANE_SSH_KEY_FILE: $(controlPlaneSshKey.secureFilePath)
                    ANSIBLE_VAULT_PASSWORD: $(ANSIBLE_VAULT_PASSWORD)
                    PIPELINE_WORKSPACE: $(Pipeline.Workspace)

                - task: AzureCLI@2
                  displayName: Remove temporary control-plane SSH rule
                  condition: always()
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set +e

                      resolve_control_plane_nsg() {
                        if [ "$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP" != "auto" ] && [ "$CONTROL_PLANE_SSH_NSG_NAME" != "auto" ]; then
                          resolved_nsg_resource_group="$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP"
                          resolved_nsg_name="$CONTROL_PLANE_SSH_NSG_NAME"
                          return 0
                        fi

                        public_ip_id="$(az network public-ip list --query "[?ipAddress=='${CONTROL_PLANE_PUBLIC_IP}'].id | [0]" -o tsv)"
                        [ -n "$public_ip_id" ] || return 0
                        ip_config_id="$(az network public-ip show --ids "$public_ip_id" --query "ipConfiguration.id" -o tsv)"
                        [ -n "$ip_config_id" ] || return 0
                        nic_id="${ip_config_id%/ipConfigurations/*}"
                        nsg_id="$(az network nic show --ids "$nic_id" --query "networkSecurityGroup.id" -o tsv)"
                        if [ -z "$nsg_id" ]; then
                          subnet_id="$(az network nic show --ids "$nic_id" --query "ipConfigurations[0].subnet.id" -o tsv)"
                          if [ -n "$subnet_id" ]; then
                            nsg_id="$(az network vnet subnet show --ids "$subnet_id" --query "networkSecurityGroup.id" -o tsv)"
                          fi
                        fi
                        [ -n "$nsg_id" ] || return 0
                        resolved_nsg_name="${nsg_id##*/}"
                        nsg_rg_part="${nsg_id#*/resourceGroups/}"
                        resolved_nsg_resource_group="${nsg_rg_part%%/*}"
                      }

                      resolve_control_plane_nsg
                      if [ -z "${resolved_nsg_resource_group:-}" ] || [ -z "${resolved_nsg_name:-}" ]; then
                        echo "Could not resolve the control-plane NSG for cleanup; no rule removed."
                        exit 0
                      fi

                      rule_name="Allow-AzurePipelines-SSH-Control-$(Build.BuildId)"
                      az network nsg rule delete \
                        --resource-group "$resolved_nsg_resource_group" \
                        --nsg-name "$resolved_nsg_name" \
                        --name "$rule_name"
                      delete_exit=$?
                      if [ "$delete_exit" -eq 0 ]; then
                        echo "Removed temporary SSH rule ${rule_name} from ${resolved_nsg_resource_group}/${resolved_nsg_name}."
                      else
                        echo "Temporary SSH rule ${rule_name} was not removed; it may not have been created."
                      fi
                      exit 0
                  env:
                    CONTROL_PLANE_PUBLIC_IP: ${{ parameters.controlPlanePublicIp }}
                    CONTROL_PLANE_SSH_NSG_NAME: ${{ parameters.controlPlaneSshNsgName }}
                    CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP: ${{ parameters.controlPlaneSshNsgResourceGroup }}

  - stage: DeployWorkerVm
    displayName: Deploy worker VM
    dependsOn: DeployControlPlane
    jobs:
      - deployment: WorkerVm
        displayName: Build runner image and run ansible/worker.yml
        environment: agent-sandbox-worker
        pool:
          name: ${{ parameters.agentPoolName }}
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                  clean: true
                  fetchDepth: 0

                - task: DownloadSecureFile@1
                  name: controlPlaneSshKey
                  displayName: Download control-plane SSH jump key
                  inputs:
                    secureFile: ${{ parameters.controlPlaneSshKeySecureFile }}

                - task: DownloadSecureFile@1
                  name: workerSshKey
                  displayName: Download worker SSH key
                  inputs:
                    secureFile: ${{ parameters.workerSshKeySecureFile }}

                - task: AzureCLI@2
                  name: allowWorkerStageControlPlaneSsh
                  displayName: Temporarily allow control-plane SSH from build agent
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -euo pipefail

                      resolve_control_plane_nsg() {
                        if [ "$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP" != "auto" ] || [ "$CONTROL_PLANE_SSH_NSG_NAME" != "auto" ]; then
                          if [ "$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP" = "auto" ] || [ "$CONTROL_PLANE_SSH_NSG_NAME" = "auto" ]; then
                            echo "Set both controlPlaneSshNsgResourceGroup and controlPlaneSshNsgName, or leave both as auto." >&2
                            return 1
                          fi
                          resolved_nsg_resource_group="$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP"
                          resolved_nsg_name="$CONTROL_PLANE_SSH_NSG_NAME"
                          return 0
                        fi

                        public_ip_id="$(az network public-ip list --query "[?ipAddress=='${CONTROL_PLANE_PUBLIC_IP}'].id | [0]" -o tsv)"
                        if [ -z "$public_ip_id" ]; then
                          echo "Could not find an Azure public IP resource with address ${CONTROL_PLANE_PUBLIC_IP}." >&2
                          return 1
                        fi

                        ip_config_id="$(az network public-ip show --ids "$public_ip_id" --query "ipConfiguration.id" -o tsv)"
                        if [ -z "$ip_config_id" ]; then
                          echo "Public IP ${CONTROL_PLANE_PUBLIC_IP} is not attached to a NIC IP configuration." >&2
                          return 1
                        fi

                        nic_id="${ip_config_id%/ipConfigurations/*}"
                        nsg_id="$(az network nic show --ids "$nic_id" --query "networkSecurityGroup.id" -o tsv)"
                        if [ -z "$nsg_id" ]; then
                          subnet_id="$(az network nic show --ids "$nic_id" --query "ipConfigurations[0].subnet.id" -o tsv)"
                          if [ -n "$subnet_id" ]; then
                            nsg_id="$(az network vnet subnet show --ids "$subnet_id" --query "networkSecurityGroup.id" -o tsv)"
                          fi
                        fi
                        if [ -z "$nsg_id" ]; then
                          echo "Could not resolve an NSG from public IP ${CONTROL_PLANE_PUBLIC_IP}; set controlPlaneSshNsgResourceGroup and controlPlaneSshNsgName explicitly." >&2
                          return 1
                        fi

                        resolved_nsg_name="${nsg_id##*/}"
                        nsg_rg_part="${nsg_id#*/resourceGroups/}"
                        resolved_nsg_resource_group="${nsg_rg_part%%/*}"
                      }

                      first_available_priority() {
                        local used_priorities
                        used_priorities="$(az network nsg rule list \
                          --resource-group "$resolved_nsg_resource_group" \
                          --nsg-name "$resolved_nsg_name" \
                          --query "[].priority" \
                          -o tsv)"
                        local priority
                        for priority in $(seq 3000 4096); do
                          if ! printf '%s\n' "$used_priorities" | grep -qx "$priority"; then
                            printf '%s\n' "$priority"
                            return 0
                          fi
                        done
                        echo "No free NSG priority found in range 3000-4096." >&2
                        return 1
                      }

                      resolve_control_plane_nsg
                      agent_ip="$(curl -fsS https://api.ipify.org)"
                      rule_name="Allow-AzurePipelines-SSH-Worker-$(Build.BuildId)"
                      priority="$(first_available_priority)"

                      az network nsg rule create \
                        --resource-group "$resolved_nsg_resource_group" \
                        --nsg-name "$resolved_nsg_name" \
                        --name "$rule_name" \
                        --priority "$priority" \
                        --direction Inbound \
                        --access Allow \
                        --protocol Tcp \
                        --source-address-prefixes "$agent_ip/32" \
                        --destination-port-ranges 22 \
                        --description "Temporary SSH access for Azure Pipelines build $(Build.BuildId)"

                      echo "Allowed ${agent_ip}/32 to ${resolved_nsg_resource_group}/${resolved_nsg_name} as ${rule_name}."
                  env:
                    CONTROL_PLANE_PUBLIC_IP: ${{ parameters.controlPlanePublicIp }}
                    CONTROL_PLANE_SSH_NSG_NAME: ${{ parameters.controlPlaneSshNsgName }}
                    CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP: ${{ parameters.controlPlaneSshNsgResourceGroup }}

                - bash: |
                    set -euo pipefail

                    export PATH="$HOME/.local/bin:$PATH"
                    if ! command -v ansible-playbook >/dev/null 2>&1; then
                      python3 -m pip install --user ansible-core
                    fi

                    echo "##vso[task.prependpath]$HOME/.local/bin"
                    ansible-playbook --version
                  displayName: Ensure Ansible is available

                - task: NodeTool@0
                  displayName: Install worker Node.js runtime
                  inputs:
                    versionSpec: 24.14.0

                - bash: |
                    set -euo pipefail

                    playwright_browsers="$PIPELINE_WORKSPACE/ms-playwright"
                    rm -rf "$playwright_browsers"
                    mkdir -p "$playwright_browsers"

                    npm ci --prefix frontend/workflow-editor --no-audit --no-fund
                    PLAYWRIGHT_BROWSERS_PATH="$playwright_browsers" \
                      npm exec --prefix frontend/workflow-editor -- playwright install chromium

                    test -d frontend/workflow-editor/node_modules/playwright
                    test -d frontend/workflow-editor/node_modules/playwright-core
                    test -d "$playwright_browsers"
                  displayName: Install worker Playwright runtime
                  env:
                    PIPELINE_WORKSPACE: $(Pipeline.Workspace)

                - bash: |
                    set -euo pipefail

                    if ! command -v npm >/dev/null 2>&1; then
                      echo "Missing npm on the pipeline agent. Install Node/npm or use a pool image that includes it." >&2
                      exit 1
                    fi

                    codex_prefix="$PIPELINE_WORKSPACE/host-codex"
                    rm -rf "$codex_prefix"
                    mkdir -p "$codex_prefix"

                    npm install --prefix "$codex_prefix" --include=optional --no-audit --no-fund "$HOST_CODEX_NPM_PACKAGE"

                    export HOST_CODEX_ROOT="$codex_prefix/node_modules/@openai/codex"
                    ./scripts/build_agent_sandbox_runner_image.sh
                    test -s dist/agent-sandbox-runner.tar
                  displayName: Build container runner image archive
                  env:
                    HOST_CODEX_NPM_PACKAGE: ${{ parameters.hostCodexNpmPackage }}
                    PIPELINE_WORKSPACE: $(Pipeline.Workspace)

                - task: UseDotNet@2
                  displayName: Install worker .NET SDK
                  inputs:
                    packageType: sdk
                    version: ${{ parameters.dotnetSdkVersion }}
                    installationPath: $(Pipeline.Workspace)/dotnet

                - bash: |
                    set -euo pipefail

                    unexpanded_vault_macro='$''(ANSIBLE_VAULT_PASSWORD)'
                    if [ "${ANSIBLE_VAULT_PASSWORD:-}" = "$unexpanded_vault_macro" ]; then
                      echo "Azure Pipelines did not expand the ANSIBLE_VAULT_PASSWORD variable." >&2
                      echo "Define ANSIBLE_VAULT_PASSWORD on this YAML pipeline, or include and authorize the variable group that contains it." >&2
                      exit 1
                    fi
                    if [ -z "${ANSIBLE_VAULT_PASSWORD:-}" ]; then
                      echo "Azure Pipelines expanded ANSIBLE_VAULT_PASSWORD, but the value is empty." >&2
                      echo "Set a non-empty secret value on this pipeline or in its linked variable group." >&2
                      exit 1
                    fi
                    for key_file_var in AGENT_SANDBOX_CONTROL_PLANE_SSH_KEY_FILE AGENT_SANDBOX_WORKER_SSH_KEY_FILE; do
                      key_file="${!key_file_var:-}"
                      if [ -z "$key_file" ]; then
                        echo "$key_file_var was not set by the secure file download step." >&2
                        exit 1
                      fi
                      chmod 600 "$key_file"
                    done

                    if [ -z "${HOST_DOTNET_ROOT:-}" ]; then
                      dotnet_path="$(command -v dotnet || true)"
                      if [ -n "$dotnet_path" ]; then
                        dotnet_real_path="$(readlink -f "$dotnet_path")"
                        HOST_DOTNET_ROOT="$(dirname "$dotnet_real_path")"
                        export HOST_DOTNET_ROOT
                      fi
                    fi
                    if [ -z "${HOST_DOTNET_ROOT:-}" ] || [ ! -x "$HOST_DOTNET_ROOT/dotnet" ]; then
                      echo "Could not resolve a local .NET SDK root for the worker toolchain." >&2
                      echo "Install dotnet on the pipeline agent, set HOST_DOTNET_ROOT, or set HOST_DOTNET_ARCHIVE." >&2
                      echo "Expected \$HOST_DOTNET_ROOT/dotnet to exist and be executable." >&2
                      exit 1
                    fi
                    echo "Using HOST_DOTNET_ROOT=$HOST_DOTNET_ROOT"

                    if [ -z "${HOST_NODE_ROOT:-}" ]; then
                      node_path="$(command -v node || true)"
                      if [ -n "$node_path" ]; then
                        node_real_path="$(readlink -f "$node_path")"
                        HOST_NODE_ROOT="$(dirname "$(dirname "$node_real_path")")"
                        export HOST_NODE_ROOT
                      fi
                    fi
                    if [ -z "${HOST_NODE_ROOT:-}" ] || [ ! -x "$HOST_NODE_ROOT/bin/node" ] || [ ! -x "$HOST_NODE_ROOT/bin/npm" ] || [ ! -x "$HOST_NODE_ROOT/bin/npx" ]; then
                      echo "Could not resolve a local Node runtime root for the worker toolchain." >&2
                      echo "Install Node 24.14.0 on the pipeline agent, set HOST_NODE_ROOT, or set HOST_NODE_ARCHIVE." >&2
                      echo "Expected bin/node, bin/npm, and bin/npx under HOST_NODE_ROOT." >&2
                      exit 1
                    fi
                    echo "Using HOST_NODE_ROOT=$HOST_NODE_ROOT"

                    vault_file="$PIPELINE_WORKSPACE/.ansible-vault-pass"
                    umask 077
                    printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$vault_file"
                    trap 'rm -f "$vault_file"' EXIT

                    limit_args=()
                    if [ "${WORKER_TARGET:-all}" != "all" ]; then
                      limit_args=(--limit "$WORKER_TARGET")
                    fi

                    ansible-playbook \
                      -i "$ANSIBLE_INVENTORY" \
                      --vault-password-file "$vault_file" \
                      -e "agent_sandbox_repo_version=$AGENT_SANDBOX_REPO_VERSION" \
                      "${limit_args[@]}" \
                      ansible/worker.yml
                  displayName: Deploy worker VM with Ansible
                  env:
                    AGENT_SANDBOX_CONTROL_PLANE_SSH_KEY_FILE: $(controlPlaneSshKey.secureFilePath)
                    AGENT_SANDBOX_WORKER_SSH_KEY_FILE: $(workerSshKey.secureFilePath)
                    ANSIBLE_VAULT_PASSWORD: $(ANSIBLE_VAULT_PASSWORD)
                    HOST_DOTNET_ROOT: $(Pipeline.Workspace)/dotnet
                    HOST_PLAYWRIGHT_BROWSERS: $(Pipeline.Workspace)/ms-playwright
                    HOST_PLAYWRIGHT_NODE_MODULES: $(Build.SourcesDirectory)/frontend/workflow-editor/node_modules
                    PIPELINE_WORKSPACE: $(Pipeline.Workspace)

                - task: AzureCLI@2
                  displayName: Remove temporary control-plane SSH rule
                  condition: always()
                  inputs:
                    azureSubscription: ${{ parameters.azureServiceConnection }}
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set +e

                      resolve_control_plane_nsg() {
                        if [ "$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP" != "auto" ] && [ "$CONTROL_PLANE_SSH_NSG_NAME" != "auto" ]; then
                          resolved_nsg_resource_group="$CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP"
                          resolved_nsg_name="$CONTROL_PLANE_SSH_NSG_NAME"
                          return 0
                        fi

                        public_ip_id="$(az network public-ip list --query "[?ipAddress=='${CONTROL_PLANE_PUBLIC_IP}'].id | [0]" -o tsv)"
                        [ -n "$public_ip_id" ] || return 0
                        ip_config_id="$(az network public-ip show --ids "$public_ip_id" --query "ipConfiguration.id" -o tsv)"
                        [ -n "$ip_config_id" ] || return 0
                        nic_id="${ip_config_id%/ipConfigurations/*}"
                        nsg_id="$(az network nic show --ids "$nic_id" --query "networkSecurityGroup.id" -o tsv)"
                        if [ -z "$nsg_id" ]; then
                          subnet_id="$(az network nic show --ids "$nic_id" --query "ipConfigurations[0].subnet.id" -o tsv)"
                          if [ -n "$subnet_id" ]; then
                            nsg_id="$(az network vnet subnet show --ids "$subnet_id" --query "networkSecurityGroup.id" -o tsv)"
                          fi
                        fi
                        [ -n "$nsg_id" ] || return 0
                        resolved_nsg_name="${nsg_id##*/}"
                        nsg_rg_part="${nsg_id#*/resourceGroups/}"
                        resolved_nsg_resource_group="${nsg_rg_part%%/*}"
                      }

                      resolve_control_plane_nsg
                      if [ -z "${resolved_nsg_resource_group:-}" ] || [ -z "${resolved_nsg_name:-}" ]; then
                        echo "Could not resolve the control-plane NSG for cleanup; no rule removed."
                        exit 0
                      fi

                      rule_name="Allow-AzurePipelines-SSH-Worker-$(Build.BuildId)"
                      az network nsg rule delete \
                        --resource-group "$resolved_nsg_resource_group" \
                        --nsg-name "$resolved_nsg_name" \
                        --name "$rule_name"
                      delete_exit=$?
                      if [ "$delete_exit" -eq 0 ]; then
                        echo "Removed temporary SSH rule ${rule_name} from ${resolved_nsg_resource_group}/${resolved_nsg_name}."
                      else
                        echo "Temporary SSH rule ${rule_name} was not removed; it may not have been created."
                      fi
                      exit 0
                  env:
                    CONTROL_PLANE_PUBLIC_IP: ${{ parameters.controlPlanePublicIp }}
                    CONTROL_PLANE_SSH_NSG_NAME: ${{ parameters.controlPlaneSshNsgName }}
                    CONTROL_PLANE_SSH_NSG_RESOURCE_GROUP: ${{ parameters.controlPlaneSshNsgResourceGroup }}
