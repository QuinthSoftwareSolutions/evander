host: "0.0.0.0"
port: 8000
log_level: "INFO"
approval_ttl_seconds: 3600
runtime_dir: "/home/jonathan/agent-sandbox/runtime"
audit_log_path: "/home/jonathan/agent-sandbox/runtime/audit.jsonl"
session_store_path: "/home/jonathan/agent-sandbox/runtime/sessions.json"
approval_store_path: "/home/jonathan/agent-sandbox/runtime/approvals.json"
draft_store_path: "/home/jonathan/agent-sandbox/runtime/drafts.json"
email_store_path: "/home/jonathan/agent-sandbox/runtime/emails.json"
discord_command_store_path: "/home/jonathan/agent-sandbox/runtime/discord_commands.json"
discord_backend: "stub"
discord_bot_token_env: "DISCORD_BOT_TOKEN"
# HTTP(S) URLs are trimmed and normalized without trailing slashes.
discord_api_base_url: "https://discord.com/api/v10"
discord_poll_limit: 50
discord_timeout_seconds: 15.0
discord_retry_count: 3
discord_retry_base_backoff_seconds: 0.5
discord_retry_max_backoff_seconds: 5.0
discord_operator_user_allowlist: []
# Must be a valid network CIDR (host addresses like 192.168.250.1/24 are rejected).
bind_network_cidr: "192.168.250.0/24"
gateway_url: "http://192.168.250.1:8000/mcp"
openai_relay_host: "0.0.0.0"
openai_relay_port: 11434
openai_api_base_url: "https://api.openai.com/v1"
openai_api_key_env: "OPENAI_API_KEY"
openai_relay_timeout_seconds: 300.0
nuget_relay_host: "0.0.0.0"
nuget_relay_port: 11666
nuget_public_feed_base_url: "https://api.nuget.org"
nuget_azure_feed_base_url: "https://pkgs.dev.azure.com/example/example/_packaging/example/nuget"
nuget_azure_pat_env: "AZURE_ARTIFACTS_PAT"
nuget_relay_timeout_seconds: 300.0
default_session_ttl_seconds: 28800
email_mailbox_allowlist: []
email_folder_allowlist_by_mailbox:
  ops-gmail:
    - "inbox"
    - "drafts"
  exec-graph:
    - "inbox"
    - "drafts"
  finance-graph:
    - "inbox"
    - "drafts"
email_draft_recipient_allowlist: []
email_draft_domain_allowlist: []
email_send_enabled: false
email_provider_timeout_seconds: 30.0
email_mailboxes:
  - mailbox_id: "ops-gmail"
    provider: "gmail"
    account: "me"
    auth_env_var_names:
      access_token: "GMAIL_OPS_ACCESS_TOKEN"
    folder_allowlist_defaults:
      - "inbox"
      - "drafts"
    folder_mapping:
      inbox: "INBOX"
      drafts: "DRAFT"
  - mailbox_id: "exec-graph"
    provider: "graph"
    address: "leader@example.com"
    auth_env_var_names:
      access_token: "GRAPH_EXEC_ACCESS_TOKEN"
    folder_allowlist_defaults:
      - "inbox"
      - "drafts"
    folder_mapping:
      inbox: "Inbox"
      drafts: "Drafts"
  - mailbox_id: "finance-graph"
    provider: "graph"
    address: "finance@example.com"
    auth_env_var_names:
      access_token: "GRAPH_FINANCE_ACCESS_TOKEN"
    folder_allowlist_defaults:
      - "inbox"
      - "drafts"
    folder_mapping:
      inbox: "Inbox"
      drafts: "Drafts"
