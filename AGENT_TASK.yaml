  git_feature_updates, git_release_requests, GitPromotionRecord lifecycle, team.git.promotion_requested
  events. OBJECTIVE: (a) Ephemeral completion: extend apply_ephemeral_action (src/truman_team_addon/repository.py:405-483)
  to read optional agent_branch and commit_sha from the ephemeral team-action.json;
  validate agent_branch equals the deterministic ephemeral_agent_branch(assignment.session_id,
  assignment.id) from step 1 helpers (reject mismatches with recorded error); store
  both on the EphemeralAssignment; keep existing parent deliverable-notice inbox behavior;
  never auto-promote. (b) In apply_agent_action handle git_review_promotions[] ({assignment_id,
  deliverable_id?}): actor must be parent_agent_id of the assignment and assignment.state
  must be COMPLETED/ACCEPTED; source=assignment.agent_branch (error if absent), target=review_branch(team_id,
  assignment_id); create a pending GitPromotionRecord (promotion_kind=''review'')
  in state.git_promotions; emit event team.git.promotion_requested with payload {promotion_id,
  promotion_kind:''review'', project_id, host_repo_path, bare_repo_name/bare_repo_path
  (from Project.git — error if project has no git config), source_branch, target_branch,
  deliverable_id?, assignment_id}; on later success (recorded via step-6 effect) review_branch
  + promotion id get attached to assignment/deliverable.git_refs. (c) git_feature_updates[]
  ({task_id, source_review_branches[], feature_branch?}): actor owns the task or supervises
  the owner; default target feature_branch(team_id, task_id, actor.id); validate every
  branch via validate_branch_name; create pending GitPromotionRecord (kind=''feature'')
  and emit the same event type with promotion_kind=''feature'' and source_branches
  list; on success create/update a Deliverable whose git_refs.feature_branch is set;
  conflicts must surface as failed records (enforced in step 6 effect), never resolved.
  (d) git_release_requests[] ({id, project_id, deliverable_ids[], release_branch?,
  canonical_branch?}): only project lead or team manager; all deliverables must belong
  to that project, be accepted, and have git_refs.feature_branch or non-Git artifact_refs;
