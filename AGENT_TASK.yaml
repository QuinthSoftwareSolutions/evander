  (enum already exists, models.py line ~60) addressed to the manager itself for audit
  (payload = full escalation), and append an event dict to the result''s events list
  with event_type=''team.operator.escalation_requested'' and payload {team_id, manager_agent_id,
  communication_target_id, title, message, urgency, project_id?, task_id?}. Add module
  constant OPERATOR_ESCALATION_EVENT_TYPE=''team.operator.escalation_requested'' next
  to EPHEMERAL_REQUESTED_EVENT_TYPE (repository.py:39-40) and surface event ids in
  a new result key operator_escalation_event_ids. Events are published by the provider
  layer: confirm TeamApplyAgentActionEffectProvider (src/truman_team_addon/providers.py:114-165)
  passes ALL result events through _publish_team_events (providers.py:620-639) — extend
  the provider to publish the new events list the same way ephemeral_events are published.
  Escalations count as progress. READ FIRST: repository.py apply_ephemeral_action
  event construction (405-483) and _ephemeral_assignment_event_payload (1227-1282)
  for the event-dict shape; providers.py _publish_team_events and _internal_event_bus
  (620-653); src/agent_sandbox/events/internal.py InternalEventBus.publish (event_type
  regex, idempotency_key). MIRROR: how team.ephemeral.requested events flow repository->provider->bus
  (tests/test_team_addon_runtime.py test_ephemeral_lifecycle_collects_action_routes_parent_and_cleans_up
  shows the assertion style with a fake/real bus). VALIDATE: `./.venv/bin/pytest -q
  tests/test_team_addon_repository.py tests/test_team_addon_runtime.py`. DEFINITION
  OF DONE: tests cover top-manager-allowed, non-manager-rejected, missing-communication-target
  -> recorded failure and zero events, and successful escalation produces an ESCALATION
