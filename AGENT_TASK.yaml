- 'STEP 1 — Extend Team Add-on state models and add deterministic branch-name helpers.
  OBJECTIVE: add all new add-on-owned state per spec: Team.operator_communication_target_id
  (str|None, default None) on Team (models.py:96-113); ProjectGitConfig model (host_repo_path
  required; exactly one of bare_repo_name|bare_repo_path enforced by model_validator;
  base_branch default ''main''; optional canonical_origin_url, provider, canonical_release_branch_prefix
  default ''releases/<project-id>/'') attached as Project.git: ProjectGitConfig|None
  (models.py:116-134); DeliverableGitRefs model (agent_branch, review_branch, feature_branch,
  release_branch, commit_sha all str|None; promotion_record_ids list[str]) attached
  as Deliverable.git_refs (models.py:226-244); GitPromotionRecord model (id, project_id,
  task_id|None, deliverable_id|None, release_package_id|None, actor_agent_id, source_branch,
  target_branch, promotion_kind Literal[''review'',''feature'',''release'',''canonical_push''],
  state Literal[''pending'',''succeeded'',''failed''], commit_sha|None, outputs dict,
  error|None, created_at/updated_at) plus new TeamState.git_promotions: dict[str,
  GitPromotionRecord] (TeamState at models.py:393-651); extend ReleasePackage (models.py:308-324)
  with feature_branches list[str], release_branch|None, canonical_branch|None, published_commit_sha|None,
  git_promotion_record_ids list[str], published_at datetime|None, error|None (state
  stays TeamRecordState); add optional agent_branch/commit_sha fields to EphemeralAssignment
  (models.py:327-390). Add module-level helpers (same file or new src/truman_team_addon/git_naming.py):
  validate_branch_name(value) rejecting '':'', leading ''/'', ''..'', control chars,
  whitespace, ''refs/'' prefix; and deterministic name builders ephemeral_agent_branch(session_id,
  assignment_id)=''agents/<session-id>/<assignment-id>'', review_branch(team_id, assignment_id)=''team/<team-id>/reviews/<assignment-id>'',
  feature_branch(team_id, task_id, agent_id)=''team/<team-id>/features/<task-id>-<agent-id>'',
  release_branch(team_id, release_id)=''team/<team-id>/releases/<release-id>'', canonical_release_branch(project,
  release_id) honoring ProjectGitConfig.canonical_release_branch_prefix. Wire new
  collections into TeamState._validate_state (models.py:414+) referential checks (git_promotions
  reference existing projects/deliverables/releases) and into team_state_payload (models.py:696).
  READ FIRST: src/truman_team_addon/models.py in full (Pydantic v2 BaseModel, _strip_strings
  validator lines 73-78, ProjectGoal lines 85-93, TeamRecordState lines 14-68); tests/test_team_addon_models.py
  helper _valid_state(). MIRROR: existing field patterns (Field defaults, utc_now
  timestamps, unique-list validators) and existing model_validator style. VALIDATE:
  `python3 -m venv .venv && ./.venv/bin/pip install -e ''.[dev]''` (once), then `./.venv/bin/pytest
  -q tests/test_team_addon_models.py`. DEFINITION OF DONE: new model tests cover ProjectGitConfig
  exactly-one bare repo rule, branch-name validator rejection cases ('':'',''/x'',''a..b'',''refs/heads/x''),
  deterministic name builders, GitPromotionRecord/ReleasePackage round-trip through
  TeamState validation; all existing model tests still pass. OUT OF SCOPE: no repository/provider/API/UI
  changes; do not touch agent_sandbox core models; no meeting concepts.'
- 'STEP 2 — Repository: task delegation (task_creations) and downward status requests
  (status_requests) with hierarchy permissions; tighten upward questions/status_reports.
  OBJECTIVE: in TeamStateRepository.apply_agent_action (src/truman_team_addon/repository.py:681-944)
  handle two new action fields. task_creations[] ({id, owner_agent_id, project_id,
  priority, title, description, optional state}): permission = actor may target itself,
  a direct subordinate (actor.subordinate_agent_ids), any agent in its project hierarchy
  if actor is that project''s lead_agent_id, or direct project leads if actor is the
  team manager; reject targets outside actor''s team or outside the target project
  (record per-item error via the existing errors[] + _mark_action_failure pattern,
  repository.py:1021-1045); created tasks default to TeamTaskState.PENDING and only
  accept explicit non-terminal states; reuse create_or_reprioritize_task internals
  (repository.py:204-240) for task construction; append created ids to a new result
  key created_task_ids. status_requests[] ({recipient_agent_id, task_id?, question}):
  recipient must be a direct subordinate (else per-item error); create an AgentInboxItem
  with item_type=TeamInboxItemType.STATUS_REQUEST and payload carrying the question
  (mirror the questions[] inbox creation block already in apply_agent_action); append
  to new result key created_status_request_ids; rely on existing lease_due_agents
  pending-inbox wake (repository.py:575-657) — no new wake code. Tighten existing
  questions[]/status_reports[] handling so recipient (explicit or defaulted) must
  equal actor''s reports_to_agent_id; a top-level manager (reports_to_agent_id None)
  gets a clear per-item error directing to operator_escalations. Add private hierarchy
  helpers (_is_direct_subordinate, _is_project_lead_for, _is_team_manager, _agent_in_project_hierarchy)
  near existing helpers (repository.py:984-1045). Both new field types count as progress
  (set progress flag, repository.py:749/930). READ FIRST: repository.py apply_agent_action
  in full, _resolve_action_agent (1005-1018), models.py PersistentAgent (137-170)
  and AgentInboxItem (266-285). MIRROR: tests/test_team_addon_repository.py test_repository_writes_increment_revision_and_preserve_hierarchy
  and tests/test_team_addon_runtime.py test_repository_leases_due_agents_and_applies_action
  (uses _seed_team helper). VALIDATE: `./.venv/bin/pytest -q tests/test_team_addon_repository.py
  tests/test_team_addon_runtime.py tests/test_team_addon_models.py`. DEFINITION OF
  DONE: tests prove self/subordinate/lead/manager task creation allowed, unrelated-agent
  and cross-project creation rejected with recorded errors, status request to non-subordinate
  rejected, STATUS_REQUEST inbox item created for subordinate, question to non-superior
  rejected, and created tasks reset no_progress_count. OUT OF SCOPE: no escalation/review/git
  fields yet; no provider output-schema changes (step 6 covers schemas); no API/UI.'
- 'STEP 3 — Repository: operator escalations (operator_escalations) emitting team.operator.escalation_requested.
  OBJECTIVE: handle operator_escalations[] ({title, message, urgency default ''normal'',
  optional task_id, project_id}) in apply_agent_action (src/truman_team_addon/repository.py:681-944).
