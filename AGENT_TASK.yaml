  7; do not call the communication sender from the repository or provider directly.'
- 'STEP 4 — Repository: action-driven reviews (review_requests, review_decisions)
  and goal updates with project status recalculation. OBJECTIVE: in apply_agent_action
  (src/truman_team_addon/repository.py:681-944) handle three fields. review_requests[]
  ({id, deliverable_id, reviewer_agent_id, instructions}): actor must be the deliverable''s
  producer_agent_id, supervise the producer (direct or transitive up-chain), or hold
  project-lead/manager authority over the deliverable''s project; reviewer must belong
  to the same team; never auto-assign. Reuse record_review_request internals (repository.py:296-325)
  to create the ReviewRequest and append to deliverable.review_request_ids; store
  instructions in a review-specific AgentInboxItem for the reviewer (item_type STATUS_REQUEST
  or a payload-tagged review variant — keep TeamInboxItemType unchanged unless a dedicated
  REVIEW_REQUEST member is added in models, in which case update tests/UI maps); deliverable
  stays pending/in_progress per existing TeamRecordState semantics — never accepted
  here. Output key created_review_request_ids. review_decisions[] ({review_request_id,
  state in accepted|rejected|blocked, findings[]}): only the assigned reviewer_agent_id
  may decide; set ReviewRequest.state, findings, decision_at (field exists, models.py:247-263).
  Cascade deterministically: accepted -> review accepted; deliverable accepted iff
  ALL its review_requests accepted; task accepted only when deliverable accepted AND
  no other open (non-terminal) deliverables/reviews remain on that task. rejected
  -> review rejected, deliverable rejected, task BLOCKED (deterministic rule per spec).
  blocked -> review+deliverable+task blocked. Output key decided_review_request_ids.
  goal_updates[] ({project_id, goal_id, state}): only that project''s lead_agent_id
  or the team manager; set ProjectGoal.state (models.py:85-93). Then implement _recalculate_project_status(state,
  project_id) and call it after goal updates, review decisions, task state changes,
  and (later, step 5) release changes: completed if all goals accepted AND no active
  (non-terminal) project tasks AND no project deliverables/reviews/release_packages
  pending or blocked; blocked if any of those is blocked; otherwise active. Output
  key updated_goal_ids. All three count as progress. READ FIRST: models.py TeamTaskState/TeamRecordState
  enums (14-68), AgentTask (194-223), Deliverable (226-244), ReviewRequest (247-263),
  Project/ProjectGoal (85-134); repository.py deliverables[] handling inside apply_agent_action
  for the inbox-notice pattern. MIRROR: test style in tests/test_team_addon_repository.py
  and tests/test_team_addon_runtime.py test_action_artifact_query_and_apply_provider.
  VALIDATE: `./.venv/bin/pytest -q tests/test_team_addon_repository.py tests/test_team_addon_runtime.py
  tests/test_team_addon_models.py`. DEFINITION OF DONE: tests cover reviewer-only
  decision enforcement, accepted-review -> deliverable/task acceptance cascade (including
  multi-review and multi-deliverable hold-back), rejected -> task blocked, blocked
  -> all blocked, decision_at set, goal update permission (lead/manager allowed, unrelated
  agent rejected), and project status recalculation to completed/blocked/active. OUT
  OF SCOPE: no Git fields (step 5); no API endpoint for decisions (step 8); never
  infer goal acceptance from text.'
