  canonical_origin_url, provider). Add constant GIT_PROMOTION_EVENT_TYPE=''team.git.promotion_requested''
  beside repository.py:39-40. New result keys: git_promotion_event_ids, release_package_ids.
  Ensure TeamApplyAgentActionEffectProvider publishes these events (same path as step
  3). All count as progress; recalc project status after release changes. READ FIRST:
  step-1 helpers; repository.py accept_ephemeral_deliverable (485-525) and _apply_ephemeral_acceptance
  (1185-1224); models.py EphemeralAssignment/ReleasePackage; src/agent_sandbox/effects/providers/git_promote_agent_branch.py
  and git_push_branch.py input fields so event payloads carry exactly what those effects
  need (host_repo_path, bare_repo_name|bare_repo_path, agent_branch, review_branch
  / local_branch, origin_branch, canonical_origin_url, provider, base_branch). MIRROR:
  ephemeral request->event flow (repository.request_ephemeral_assignments 327-357
