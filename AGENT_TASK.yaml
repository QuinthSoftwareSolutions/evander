  pack routing (step 7); do not modify src/agent_sandbox/effects/* core providers;
  no network/remote pushes in tests (use local bare repos under tmp_path).'
- 'STEP 7 — Extend the packaged TEAM_RUNTIME_V1 workflow to route escalation and Git
  promotion events. OBJECTIVE: edit src/truman_team_addon/workflow_packs.py (TEAM_RUNTIME_V1,
  lines 6-199). Add trigger nodes: ''team-operator-escalation'' (type trigger:event,
  event_type ''team.operator.escalation_requested'') and ''team-git-promotion-requested''
  (type trigger:event, event_type ''team.git.promotion_requested''), mirroring the
  existing ''team-ephemeral-requested'' trigger (lines 36-54). Routes: (1) escalation
  trigger -> new effect node ''team-notify-operator'' of type effect:communication:send-message
  with communication_target_id and message bound from the trigger event payload (binding
  syntax `${{ ... }}` exactly as existing nodes bind, e.g. team-create-ephemeral-agent
  consuming event payload); message should template title/message/urgency. (2) git
  promotion trigger -> gate(s) on payload promotion_kind: ''review'' -> effect:git:promote-agent-branch
  node (host_repo_path/bare_repo_*/agent_branch/review_branch bound from payload)
  -> effect:team:record-git-promotion (promotion_id + success/outputs/error/commit_sha
  bound from the git effect outputs); ''feature'' -> effect:team:consolidate-git-branches
  -> effect:team:record-git-promotion; ''release'' -> effect:team:consolidate-git-branches
  (feature branches -> release branch) -> effect:team:record-git-promotion; ''canonical_push''
  -> effect:git:push-branch (local_branch=release branch, origin_branch=canonical
  branch, canonical_origin_url/provider/base_branch from payload) -> effect:team:mark-release-published.
  Use the existing filter-gate pattern (team-completed-persistent/team-completed-ephemeral,
  lines 55-82) for the promotion_kind split. CRITICAL INVARIANT: no route may push
  ephemeral/review/feature branches via effect:git:push-branch — only the canonical_push
  route uses push-branch and only with the release branch. READ FIRST: workflow_packs.py
  in full; tests/test_team_addon_runtime.py test_team_runtime_pack_wires_ephemeral_event_flow
  (the pack-JSON wiring assertion pattern: parse team_runtime_v1()[''config''], index
  nodes by id, assert node types/config/edges); src/agent_sandbox/triggers/providers/schemas.py
  EventTriggerDefinition; src/agent_sandbox/effects/providers/schemas.py GitPromoteAgentBranchEffectDefinition/GitPushBranchEffectDefinition
  (lines ~996-1048) and CommunicationSendMessageEffectDefinition (lines ~851-863)
  for exact required config keys. MIRROR: existing edge wiring (lines 183-197). VALIDATE:
  `./.venv/bin/pytest -q tests/test_team_addon_runtime.py tests/test_workflow_packs.py`.
  DEFINITION OF DONE: new pack-wiring tests assert: escalation event routes to a communication:send-message
  node bound to the payload''s communication_target_id; each promotion_kind routes
  to the correct git effect and then to record-git-promotion/mark-release-published;
  and an explicit test asserts the ONLY effect:git:push-branch node in the pack is
  on the canonical_push path with the release/canonical branch bindings. OUT OF SCOPE:
