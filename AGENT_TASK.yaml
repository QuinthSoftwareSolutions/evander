- 'STEP 6 — New add-on effect providers: effect:team:record-git-promotion, effect:team:mark-release-published,
  optional effect:team:consolidate-git-branches; extend apply-agent-action output
  schema. OBJECTIVE: in src/truman_team_addon/providers.py add TeamRecordGitPromotionEffectProvider
  (type ''effect:team:record-git-promotion''; inputs promotion_id, success, outputs
  dict, error?, commit_sha?; behavior: repository method record_git_promotion_result()
  sets GitPromotionRecord.state succeeded/failed, stores outputs/error/commit_sha,
  and on success attaches the resulting branch + record id to the linked assignment/deliverable.git_refs
  or release package; on failure marks linked deliverable/release blocked and creates
  an inbox notice to the actor''s superior or project lead) and TeamMarkReleasePublishedEffectProvider
  (type ''effect:team:mark-release-published''; inputs release_package_id, success,
  canonical_branch, published_commit_sha, outputs, error; success -> ReleasePackage
  state ACCEPTED + published_commit_sha/canonical_branch/published_at set; failure
  -> state BLOCKED + error stored + inbox notification to project lead or manager;
  then _recalculate_project_status). Because effect:git:promote-agent-branch handles
  only single agent_branch->review_branch and effect:git:push-branch only single local->origin
  (see src/agent_sandbox/effects/providers/git_promote_agent_branch.py:29-44 and git_push_branch.py:18-41
  — neither merges multiple branches), add an add-on-owned TeamConsolidateGitBranchesEffectProvider
  (type ''effect:team:consolidate-git-branches''; inputs host_repo_path, source_branches[],
  target_branch, base_branch?; behavior: subprocess git ONLY inside host_repo_path,
  refuse dirty worktree unless operating in an isolated worktree path, deterministic
  merge commits in listed order, on merge conflict abort the merge and return success=false
  with conflict output — never auto-resolve). Validate every branch input with validate_branch_name
  before any subprocess call. Add matching Pydantic definitions in src/truman_team_addon/provider_schemas.py
  (mirror TeamAcceptEphemeralDeliverableEffectDefinition style, lines 87-93) and entries
  in TEAM_OUTPUT_SCHEMAS (lines 133-223); extend the effect:team:apply-agent-action
  output schema with created_task_ids, created_status_request_ids, created_review_request_ids,
  decided_review_request_ids, updated_goal_ids, operator_escalation_event_ids, git_promotion_event_ids,
  release_package_ids; register everything in register_providers (providers.py:513-565).
  READ FIRST: providers.py TeamAcceptEphemeralDeliverableEffectProvider (281-315)
  as the minimal effect template; provider_runtime contracts used via context; tests/test_team_addon_runtime.py
  provider invocation pattern (provider.initialize(definition, context) then execute()).
