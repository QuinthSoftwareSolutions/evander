plan_summary: 'Complete the Team Add-on (src/truman_team_addon/) with hierarchical
  agent operations (task delegation, downward status requests, operator escalation),
  action-driven reviews with decision cascades, goal updates with project status recalculation,
  and a Git-first delivery flow (agent branch -> review branch -> feature branch ->
  release branch -> canonical push) per ADO work item 15903. END STATE: persistent
  agents drive everything through extended `effect:team:apply-agent-action` action
  fields (task_creations, status_requests, operator_escalations, review_requests,
  review_decisions, goal_updates, git_review_promotions, git_feature_updates, git_release_requests);
  ephemeral agents report agent_branch/commit_sha in team-action.json; the packaged
  TEAM_RUNTIME_V1 workflow routes new internal events (team.operator.escalation_requested
  -> effect:communication:send-message, team.git.promotion_requested -> existing git
  effects -> new effect:team:record-git-promotion / effect:team:mark-release-published);
  the Admin API/UI expose operator target, project Git config, review decisions, releases,
  and promotion records. ARCHITECTURAL CONSTRAINTS: (1) ALL new state lives in truman_team_addon
  models/state.json — never touch agent_sandbox core models; (2) all writes go through
  TeamStateRepository.update() optimistic-revision mutators (TeamStateConflictError
  -> HTTP 409) and must satisfy TeamState._validate_state referential integrity (new
  collections/refs must be added to that validator); (3) events publish via InternalEventBus
  (_publish_team_events in providers.py) and are consumed via trigger:event nodes
  in the pack — providers never call other effects directly; (4) reuse effect:git:promote-agent-branch
  and effect:git:push-branch for single-branch ops; only multi-branch merge consolidation
  justifies a new add-on-owned effect that shells out strictly inside the trusted
  project host_repo_path; (5) only release branches are ever pushed to canonical remote;
  (6) reviews are action-driven, never auto-assigned; goal acceptance is explicit,
  never inferred. SEQUENCING: models first (step 1), then repository action handlers
  (steps 2-5, each independently testable), then new effect providers/schemas (step
  6), then workflow pack routing (step 7), then Admin API (step 8), UI (step 9), docs/changelog/final
  verification (step 10). Steps 2-4 are independent of Git work (step 5-7) but all
  depend on step 1. GLOBAL RISKS/INVARIANTS: the worktree has no .venv and no uv on
  PATH — each implementer must first run `python3 -m venv .venv && ./.venv/bin/pip
  install -e ''.[dev]''` (repo convention is `./.venv/bin/pytest -q`; use `uv run
  pytest -q` only if uv is available). Branch names must be validated as plain branch
  names (reject '':'', leading ''/'', ''..'', control chars, ''refs/'' prefix). Merge
  conflicts must fail and record blocked/failed promotion records — never auto-resolve.
  Created tasks/actions count as progress and reset AgentRuntime.no_progress_count
  (repository.py:930 pattern). Meetings are OUT OF SCOPE. Do not remove artifact_refs
  (non-Git deliverable) support. Do not modify frontend/workflow-editor/dist hash-pointer
  churn. Every step must keep the existing focused suite green: ./.venv/bin/pytest
  -q tests/test_team_addon_models.py tests/test_team_addon_repository.py tests/test_team_addon_api.py
  tests/test_team_addon_runtime.py tests/test_addons.py tests/test_artifact_spaces.py,
  plus `git diff --check`. Record all user-visible additions in CHANGELOG.md (dated
  `## YYYY-MM-DD - Title` + bullets).'
