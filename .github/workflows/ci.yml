name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Reject tracked runtime databases
        run: |
          tracked=$(git ls-files -- \
            ':(top)communication-targets.db' ':(top,glob)communication-targets.db-*' \
            ':(top)discord-inbox-store.db' ':(top,glob)discord-inbox-store.db-*' \
            ':(top)teams_messages.db' ':(top,glob)teams_messages.db-*' \
            ':(top)wake-requests-store.db' ':(top,glob)wake-requests-store.db-*')
          if [ -n "$tracked" ]; then
            printf 'Runtime database files must not be tracked:\n%s\n' "$tracked"
            exit 1
          fi
      - name: Install locked development dependencies
        run: |
          python -m pip install uv==0.10.11
          uv sync --frozen --extra dev
      - name: Run the complete Python suite
        run: ./.venv/bin/python scripts/run_tests.py --workers 2 --timeout 1800

  admin-web:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend/admin-web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/admin-web/package-lock.json
      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build Admin Web
        run: timeout --kill-after=10s 600s npm run build
      - name: Run unit and browser tests
        run: timeout --kill-after=10s 600s npm test
