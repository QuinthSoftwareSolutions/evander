<script>
const icons={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',teams:'M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M2 21v-3a6 6 0 0 1 12 0v3 M17 5a3 3 0 0 1 0 6 M17 15a5 5 0 0 1 5 5',sessions:'M3 5h18v14H3z M7 9l3 3-3 3 M13 15h4',workflow:'M3 3h6v6H3z M15 15h6v6h-6z M6 9v9h9 M15 3h6v6h-6z M9 6h6',configuration:'M4 6h16 M4 12h16 M4 18h16 M8 3v6 M16 9v6 M10 15v6',generic:'M4 4h16v16H4z M8 9h8 M8 14h5',search:'M10 17a7 7 0 1 0 0-14 7 7 0 0 0 0 14 M15 15l6 6',arrow:'M5 12h14 M14 7l5 5-5 5',alert:'M12 3L2 21h20z M12 9v5 M12 17v1',clock:'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18 M12 7v5l3 2'};
const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name]||icons.generic}"/></svg>`;
const escapeHtml=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const badge=(label,tone='')=>`<span class="chip ${tone}"><span class="dot" aria-hidden="true"></span>${label}</span>`;
let pageName='dashboard', selected=null, teamLayout='list', settingsSection='targets', unlocked=false, dirty=false, query='', statusFilter='all', zoom=1, revision=42, lastFocus=null;
const states={Active:'active',Running:'active',Blocked:'bad','Needs review':'warn',Review:'warn',Complete:'good',Idle:'',Pending:'',Waiting:'warn'};
const sessionData=[['Example App team lead','Active','Team lead','gpt-6-sol','On message','12 s ago'],['Example App implementation','Running','Developer','gpt-6-sol','After dispatch','28 s ago'],['Release reviewer','Idle','Reviewer','gpt-6-astra','14:30','2 min ago'],['Example Portal developer','Running','Developer','gpt-6-sol','After dispatch','41 s ago'],['Backup Service lead','Active','Team lead','gpt-6-sol','On message','1 min ago'],['Example App triage','Idle','Triage','gpt-6-sol','14:45','4 min ago'],['UI reviewer','Idle','Reviewer','gpt-6-astra','On message','6 min ago'],['Release operator','Active','Release','gpt-6-sol','On message','2 min ago'],['Documentation','Idle','Developer','gpt-6-sol','15:00','8 min ago'],['Integration review','Active','Reviewer','gpt-6-astra','On message','3 min ago'],['Build verification','Running','Verification','gpt-6-sol','After dispatch','52 s ago'],['Repository maintenance','Idle','Maintenance','gpt-6-sol','16:00','12 min ago'],['Workflow triage','Active','Triage','gpt-6-sol','On message','1 min ago'],['Operations assistant','Active','Assistant','gpt-6-sol','On message','4 min ago'],['Policy reviewer','Idle','Reviewer','gpt-6-astra','On message','11 min ago'],['Test coordinator','Idle','Verification','gpt-6-sol','15:30','5 min ago']];
const taskData=[['T-142','Verify release candidate','Backup Service','Release operator','Blocked','High','12 min'],['T-143','Review session expiry changes','Example App','UI reviewer','Needs review','High','8 min'],['T-144','Refine station logout flow','Example Portal','Example Portal developer','Running','Normal','3 min'],['T-145','Check integration retry behavior','Example App','Integration review','Running','High','6 min'],['T-146','Update operator guide','Example App','Documentation','Pending','Normal','19 min'],['T-147','Investigate missing wake','Example App','Example App triage','Blocked','High','22 min'],['T-148','Review deployment evidence','Backup Service','Release reviewer','Needs review','Normal','14 min'],['T-149','Reconcile project task ownership','Example App','Example App team lead','Running','Normal','2 min'],['T-150','Validate communication targets','Example Portal','Policy reviewer','Pending','Normal','31 min'],['T-151','Add verification notes','Backup Service','Build verification','Complete','Normal','42 min'],['T-152','Check workflow run history','Example App','Workflow triage','Complete','Normal','1 h'],['T-153','Refresh troubleshooting notes','Example Portal','Documentation','Pending','Low','1 h']];
let newsIndex=0;
const runtimeDefaults={backend:'container_worker_vm',image:'evander-runner:stable',timeout:'900',model:'gpt-6-sol',tools:'18 tools allowed'};
let runtimeSaved={},runtimeDraft={};
const newsStories=[{title:'A clearer view of the work in motion',date:'22 September 2026',category:'Operations',summary:'Follow a task from intake to review, with its evidence and next step close at hand. Review context and recent activity now sit together, making it easier to see what is ready and what still needs attention.',body:'The most useful updates explain what has changed, why it matters, and what operators can now do. A release story has room for that context, with a clear route to the detailed changelog. Images and diagrams can appear when they help explain a change.'},{title:'Better tools for everyday administration',date:'18 September 2026',category:'Product update',summary:'A second illustrative story demonstrates browsing recent updates without leaving the dashboard. Each story has a clear title, useful summary, publication date, and a full reading view.',body:'Keep the narrative and practical tips that make release news useful. Previous and next controls, archive access, version details, and changelog downloads belong to this same feature.'}];
function releaseNews(){const n=newsStories[newsIndex];return `<section><div class="section-head"><h2>Release news</h2><span class="small">Latest updates</span></div><article class="release-story"><div class="news-meta"><span class="chip">${n.category}</span><time>${n.date}</time></div><h3>${n.title}</h3><p>${n.summary}</p><div class="news-actions"><button class="text-button" data-action="read-news">Read update ${icon('arrow')}</button><div class="news-controls"><button data-news="prev" aria-label="Previous release story" ${newsIndex===0?'disabled':''}>‹</button><span class="muted">${newsIndex+1} / ${newsStories.length}</span><button data-news="next" aria-label="Next release story" ${newsIndex===newsStories.length-1?'disabled':''}>›</button></div></div></article><div class="health-compact"><div class="section-head"><h2>Capacity & health</h2>${badge('Healthy','good')}</div><div class="health-row"><div>Worker capacity<small>3 workers · 7 of 12 slots in use</small></div><div class="meter" aria-label="7 of 12 slots in use"><span style="width:58%"></span></div></div><div class="health-row"><span>Gateway & relays</span>${badge('Available','good')}</div><div class="health-row"><span>Trigger / effect workers</span>${badge('Running','active')}</div></div></section>`;}
const targets=Array.from({length:18},(_,index)=>({id:`${index%2?'teams':'discord'}-${String(18-index).padStart(2,'0')}`,provider:index%2?'Teams':'Discord',address:index%2?`team:operations/channel:channel-${index}`:`channel:1234567890${index}`})).sort((a,b)=>a.id.localeCompare(b.id));
const navGroups=[['Overview',[['dashboard','Dashboard'],['reports','Reports']]],['Operations',[['agents','Agents'],['sessions','Sessions'],['issues','Issues'],['approvals','Approvals'],['artifacts','Artifacts']]],['Automation',[['workflow','Workflow'],['skills','Skills']]],['Extensions',[['teams','Teams'],['addons','Add-ons'],['connectors','Connectors'],['files','Host directories']]],['Infrastructure',[['subscriptions','Subscriptions'],['git','Git repositories'],['vms','VMs'],['workers','Workers']]],['Governance',[['visibility','Tool visibility'],['tools','MCP tools'],['audit','Tool calls'],['configuration','Configuration'],['users','Users & groups']]]];
const sketchPages=['dashboard','teams','sessions','workflow','configuration'];
const pageNotes={dashboard:['Operational attention comes first','A single metric strip leads into attention, release news, capacity, and recent work. News retains a readable article, previous/next controls, and an expanded reading view. Exceptions carry context and a direct route to evidence.','Release news stays visible by default. Discuss the balance between the article width and the attention list, including an optional personal layout preference.'],teams:['Give each level of navigation one job','The existing Team destinations are grouped into work, people, communication, governance, and activity. Tasks use a compact list for comparison and a board for handoffs; both open the same inspector.','This grouping is a proposal. Every existing destination remains mapped in the written study, including Memory and Planning.'],sessions:['Browse the inventory, inspect in context','A full-width table makes sessions comparable. Selecting a record opens a 340 px inspector with key facts, activity, and links to full policy and wake editors. Closing it restores the table.','Discuss whether you prefer the inspector to open on selection or only on an explicit Inspect action.'],workflow:['Keep the canvas central','Pack selection and save actions move to a slim toolbar. Runs occupy a collapsible bottom tray. Nodes use short labels and explicit state; selecting a node opens the shared inspector.','The sketch shows a proposed layout of illustrative nodes. It does not change any graph, binding, route, revision, or live workflow.'],configuration:['Continue the existing compact collections','Settings keep searchable section navigation. Records become aligned rows; inherited values and local overrides remain visible. More complex fields use a label/value layout and a persistent save bar.','The study includes Communication targets and Agent runtime. Full schema coverage is a required gate before any migration.']};
function renderNav(){document.querySelector('#navigation').innerHTML=navGroups.map(([label,items])=>`<div class="nav-group"><div class="nav-label">${label}</div>${items.map(([id,title])=>`<button class="nav-item ${pageName===id?'selected':''}" data-page="${id}" ${pageName===id?'aria-current="page"':''}>${icon(id)}<span>${title}</span>${id==='approvals'?'<span class="nav-count">2</span>':''}</button>`).join('')}</div>`).join('');}
function heading(title,description,actions=''){return `<div class="page-heading"><div><h1>${title}</h1>${description?`<p>${description}</p>`:''}</div><div class="heading-actions">${actions}</div></div>`;}
function searchBox(placeholder){return `<label class="search">${icon('search')}<input type="search" id="record-search" placeholder="${placeholder}" aria-label="${placeholder}" value="${escapeHtml(query)}"></label>`;}
function stateSelect(options){return `<select id="state-filter" aria-label="Filter by state"><option value="all">All states</option>${options.map(x=>`<option ${statusFilter===x?'selected':''}>${x}</option>`).join('')}</select>`;}
function matches(text,state){return text.toLowerCase().includes(query.toLowerCase())&&(statusFilter==='all'||state===statusFilter);}
function renderDashboard(){return heading('Dashboard','Your operational overview',`<span class="small muted hide-mobile">Updated 14:24 · sample</span><button data-action="refresh">↻ Refresh</button>`)+`<div class="page-body"><div class="metrics">${[['Agents working','3','of 16'],['Needs attention','4','items'],['Active workflows','3','runs'],['Worker capacity','7 / 12','slots'],['Estimated cost','$18.42','today · UTC']].map(([label,value,detail])=>`<div class="metric"><div class="metric-label">${label}</div><div class="metric-value">${value}<small>${detail}</small></div></div>`).join('')}</div><div class="dashboard-grid"><div><section><div class="section-head"><h2>Needs attention <span class="chip">4</span></h2><span class="small">Across your directory</span></div><div class="data-list">${[['Verify release candidate','Backup Service · verification evidence requires review','Review evidence','T-142'],['Review session expiry changes','Example App · a reviewer decision is pending','Open review','T-143'],['Investigate missing wake','Example App · scheduled work has not started','Inspect task','T-147'],['Review deployment evidence','Backup Service · release package awaits review','Open review','T-148']].map(([title,desc,action,id])=>`<div class="attention-row"><span class="status-icon">${icon('alert')}</span><div><h3>${title}</h3><p>${desc}</p></div><button data-task="${id}">${action}</button></div>`).join('')}</div></section><section class="section"><div class="section-head"><h2>Recent work</h2><button class="text-button" data-page="teams">Open Teams ${icon('arrow')}</button></div><div class="table-wrap"><table><thead><tr><th>Work</th><th>Project</th><th>State</th><th>Owner</th><th>Updated</th></tr></thead><tbody>${taskData.slice(0,6).map(t=>`<tr><td><button class="text-button row-label" data-task="${t[0]}">${t[1]}</button></td><td>${t[2]}</td><td>${badge(t[4],states[t[4]])}</td><td>${t[3]}</td><td class="muted numeric">${t[6]} ago</td></tr>`).join('')}</tbody></table></div></section></div>${releaseNews()}</div><div class="note-strip inline wrap"><span>Evander · release archive, version details & changelog</span><span class="spacer"></span><button class="text-button" data-action="release-notes">Release archive ${icon('arrow')}</button></div></div>`;}
function renderSessions(){const rows=sessionData.map((s,i)=>({s,i})).filter(({s})=>matches(s.join(' '),s[1]));return heading('Sessions <span class="chip">16</span>','Execution context, access, and wake schedules',`<button data-action="columns">Columns</button>`)+`<div class="content-split ${selected?'has-inspector':''}"><div class="list-body"><div class="toolbar">${searchBox('Search sessions…')}${stateSelect(['Active','Running','Idle'])}<span class="spacer"></span><span class="small muted">${rows.length} sessions</span></div><div class="table-wrap"><table><thead><tr><th>Session</th><th>State</th><th>Role</th><th class="optional-col">Model</th><th>Next wake</th><th class="optional-col">Updated</th><th><span class="sr-only">Inspect</span></th></tr></thead><tbody>${rows.map(({s,i})=>`<tr class="${selected===String(i)?'selected':''}"><td><button class="text-button row-label" data-session="${i}" aria-pressed="${selected===String(i)}">${s[0]}</button></td><td>${badge(s[1],states[s[1]])}</td><td>${s[2]}</td><td class="optional-col mono">${s[3]}</td><td class="muted">${s[4]}</td><td class="optional-col muted numeric">${s[5]}</td><td><button class="icon-button plain" data-session="${i}" aria-label="Inspect ${s[0]}">›</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No matching sessions. Try another search or state.</div>'}</div><div class="table-footer"><span>${rows.length} of 16 sessions</span><span>Selected records open alongside the list</span></div></div>${selected!==null?sessionInspector(Number(selected)):''}</div>`;}
function inspector(title,subtitle,body,footer=''){return `<aside class="inspector" aria-label="Record details"><div class="inspector-head"><div><h2 tabindex="-1" id="inspector-title">${escapeHtml(title)}</h2><p class="small">${subtitle}</p></div><span class="spacer"></span><button class="icon-button plain" data-action="close-inspector" aria-label="Close details">×</button></div><div class="inspector-content">${body}</div>${footer?`<div class="inspector-footer">${footer}</div>`:''}</aside>`;}
function keyValues(values){return `<dl class="key-values">${values.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;}
function sessionInspector(i){const s=sessionData[i];return inspector(s[0],`session-${String(i+1).padStart(3,'0')} · root/example-development`,`<section class="inspector-section">${badge(s[1],states[s[1]])}${keyValues([['Role',s[2]],['Model',s[3]],['Provider','Configured relay'],['Created','22 Sep, 09:12'],['Expires','23 Sep, 09:12'],['Next wake',s[4]]])}</section><section class="inspector-section"><h3>Access</h3>${keyValues([['Tools','18 allowed · 3 need approval'],['Repositories','Example App · read and scoped push'],['Policy','Inherited from directory']])}<button class="text-button" data-action="policy">View access policy ${icon('arrow')}</button></section><section class="inspector-section"><h3>Recent activity</h3>${[['Dispatch completed','14:23 · task context saved'],['Agent replied','14:21 · review evidence attached'],['Wake received','14:19 · project work available']].map(([a,b])=>`<div class="timeline-item"><span class="dot"></span><div>${a}<small>${b}</small></div></div>`).join('')}</section><section class="inspector-section"><h3>Wake schedule</h3><p class="muted">Responds to project messages. Scheduled wakes and their dispatch history remain available in the full record.</p></section>`,`<button class="primary" data-action="session-record">Open full session</button><button data-action="session-edit" ${unlocked?'':'disabled'} title="${unlocked?'Edit illustrative record':'Unlock editing to change this record'}">Edit</button>`);}
function renderTeams(){const rows=taskData.filter(t=>matches(t.join(' '),t[4]));return heading('Teams','Example App development',`<button data-action="team-switch">Example App development ▾</button>`)+`<div class="tabs" aria-label="Team areas">${['Workspace','Work','People','Communication','Governance','Activity'].map(x=>`<button class="${x==='Work'?'selected':''}" data-team-area="${x}">${x}</button>`).join('')}</div><div class="content-split ${selected?'has-inspector':''}"><div class="list-body"><div class="team-strip"><strong>Task board</strong><span>12 tasks</span><span>2 blocked</span><span>2 need review</span><span class="spacer"></span><button class="text-button" data-action="team-destinations">Projects, cases & more ▾</button></div><div class="toolbar">${searchBox('Search tasks…')}${stateSelect(['Blocked','Needs review','Running','Pending','Complete'])}<span class="spacer"></span><div class="segmented" aria-label="Task presentation"><button data-layout="list" class="${teamLayout==='list'?'selected':''}" aria-pressed="${teamLayout==='list'}">List</button><button data-layout="board" class="${teamLayout==='board'?'selected':''}" aria-pressed="${teamLayout==='board'}">Board</button></div></div>${teamLayout==='list'?`<div class="table-wrap"><table><thead><tr><th>Task</th><th>State</th><th>Project</th><th class="optional-col">Owner</th><th class="optional-col">Priority</th><th>Updated</th></tr></thead><tbody>${rows.map(t=>`<tr class="${selected===t[0]?'selected':''}"><td><button class="text-button row-label" data-task="${t[0]}" aria-pressed="${selected===t[0]}">${t[1]}</button></td><td>${badge(t[4],states[t[4]])}</td><td>${t[2]}</td><td class="optional-col">${t[3]}</td><td class="optional-col muted">${t[5]}</td><td class="muted numeric">${t[6]}</td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No matching tasks.</div>'}</div>`:renderBoard(rows)}<div class="table-footer"><span>${rows.length} of 12 tasks</span><span>Same records in List and Board</span></div></div>${selected?taskInspector(selected):''}</div>`;}
function renderBoard(rows){return `<div class="board">${[['Ready',['Pending']],['Working',['Running','Blocked']],['In review',['Needs review']],['Complete',['Complete']]].map(([label,values])=>{const tasks=rows.filter(t=>values.includes(t[4]));return `<section class="board-column"><h3>${label}<span class="muted">${tasks.length}</span></h3>${tasks.map(t=>`<article class="task-card" tabindex="0" role="button" data-task="${t[0]}" aria-label="Inspect ${t[1]}"><small>${t[0]} · ${t[2]}</small><p>${t[1]}</p><div class="inline">${badge(t[4],states[t[4]])}<small>${t[6]}</small></div></article>`).join('')}</section>`;}).join('')}</div>`;}
function taskInspector(id){const t=taskData.find(x=>x[0]===id);return inspector(t[1],`${t[0]} · ${t[2]}`,`<section class="inspector-section">${badge(t[4],states[t[4]])}${keyValues([['Owner',t[3]],['Priority',t[5]],['Updated',t[6]+' ago'],['Project',t[2]]])}</section><section class="inspector-section"><h3>Expected outcome</h3><p>${t[0]==='T-142'?'A release candidate with complete verification evidence and a recorded review decision.':'Complete the task with reviewable evidence attached to its outcome.'}</p></section><section class="inspector-section"><h3>${t[4]==='Blocked'?'What is blocking this':'Next step'}</h3><p>${t[4]==='Blocked'?'A required verification result is missing. Inspect the existing evidence before requesting another run.':'The assigned agent can continue when the pending review or dependency is resolved.'}</p></section><section class="inspector-section"><h3>Evidence</h3><button class="text-button" data-action="evidence">Verification report ${icon('arrow')}</button><p class="small muted">Attached 12 minutes ago · illustrative artifact</p></section><section class="inspector-section"><h3>Recent activity</h3><div class="timeline-item"><span class="dot"></span><div>Task updated<small>Outcome and next step recorded</small></div></div></section>`,`<button class="primary" data-action="evidence">View evidence</button><button data-action="task-message" ${unlocked?'':'disabled'} title="${unlocked?'Open message draft':'Unlock editing to send a message'}">Message owner</button>`);}
const settingCategories=[['People & communications',[['targets','Communication targets'],['contacts','Contacts'],['mailboxes','Email mailboxes']]],['Runtime & models',[['runtime','Agent runtime'],['models','Models & knowledge']]],['System',[['code','Code, issues & PRs'],['access','Access & approvals'],['network','Network & packages'],['automation','Automation assignment'],['advanced','Advanced / raw']]]];
function settingsNavigation(){return `<aside class="settings-nav" aria-label="Configuration sections"><button data-action="settings-search">${icon('search')} Find setting</button>${settingCategories.map(([label,items])=>`<div class="category">${label}</div>${items.map(([id,title])=>`<button data-settings="${id}" class="${settingsSection===id?'selected':''}">${title}</button>`).join('')}`).join('')}<div class="category">Inspect configuration</div><button data-action="effective">Effective values</button><button data-action="validation">Validation</button><button data-action="history">Change history</button></aside>`;}
function renderConfiguration(){return heading('Configuration','Directory settings and inherited defaults',`<select class="settings-mobile" style="display:none" id="settings-mobile" aria-label="Configuration section"><option value="targets" ${settingsSection==='targets'?'selected':''}>Communication targets</option><option value="runtime" ${settingsSection==='runtime'?'selected':''}>Agent runtime</option></select>`)+`<div class="content-split">${settingsNavigation()}<div class="settings-main">${settingsSection==='targets'?renderTargets():renderRuntime()}</div>${selected&&settingsSection==='targets'?targetInspector(Number(selected)):''}</div><div class="save-bar"><span id="save-state">${dirty?'Unsaved changes':unlocked?'No unsaved changes':'Editing locked · unlock to change settings'}</span><span class="spacer"></span><span class="muted revision">Revision ${revision}</span><button data-action="discard" ${dirty?'':'disabled'}>Discard</button><button class="primary" data-action="save" ${dirty&&unlocked?'':'disabled'}>Save changes</button></div>`;}
function renderTargets(){const rows=targets.map((t,i)=>({t,i})).filter(({t})=>[t.id,t.address,t.provider].join(' ').toLowerCase().includes(query.toLowerCase()));return `<div class="settings-title"><div><h2>Communication targets</h2><p>Destinations and capabilities available to this directory.</p></div><span class="spacer"></span><button data-action="add-target" ${unlocked?'':'disabled'} title="Unlock editing to add a target">+ Add target</button></div><div class="scope-strip"><span>Scope <strong>root / example-development</strong></span><span>18 local · 0 inherited in sample</span></div><div class="toolbar">${searchBox('Search communication targets…')}<span class="spacer"></span><span class="small muted">${rows.length} records</span></div><div class="table-wrap"><table><thead><tr><th>Target</th><th>Provider</th><th>Destination</th><th>Capabilities</th><th>Source</th></tr></thead><tbody>${rows.map(({t,i})=>`<tr class="${selected===String(i)?'selected':''}"><td><button class="text-button" data-target="${i}">${t.id}</button></td><td>${t.provider}</td><td class="mono">${t.address}</td><td class="muted">Read · notify</td><td><span class="chip">Local</span></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No matching targets.</div>'}</div><div class="table-footer"><span>${rows.length} of 18 communication targets</span><span>Choose a row to inspect</span></div>`;}
function targetInspector(i){const t=targets[i];return inspector(t.id,`${t.provider} · local definition`,`<section class="inspector-section"><h3>Destination</h3><p class="mono" style="overflow-wrap:anywhere">${t.address}</p></section><section class="inspector-section"><h3>Capabilities</h3><p>Read · notify</p></section><section class="inspector-section"><h3>Scope</h3><p>Defined in root/example-development. An inherited target would also show its parent and offer explicit Override or Disable actions.</p></section>`,`<button class="primary" data-action="edit-target" ${unlocked?'':'disabled'} title="Unlock editing to change this target">Edit target</button>`);}
function renderRuntime(){return `<div class="settings-title"><div><h2>Agent runtime</h2><p>Execution and launch settings for this directory.</p></div>${badge('Valid','good')}</div><div class="scope-strip"><span>Scope <strong>root / example-development</strong></span><span>Values inherit from <strong>root</strong></span></div><div class="settings-fields"><div class="section-head"><h3>Execution</h3><span class="small">Effective values</span></div>${[['backend','Execution backend','Where new agents run.','container_worker_vm'],['image','Runner image','Default image for new worker containers.','evander-runner:stable'],['timeout','Prompt timeout','Maximum duration of a prompt dispatch.','900'],['model','Default model','Used when a session has no explicit model.','gpt-6-sol'],['tools','Allowed tools','Inherited policy remains inspectable.','18 tools allowed']].map(([id,label,desc,value])=>`<div class="field-row"><div><label for="field-${id}">${label}</label><p>${desc}</p></div><div><input id="field-${id}" value="${escapeHtml(runtimeDraft[id]??value)}" ${unlocked&&id in runtimeDraft?'':'disabled'}><span class="source" id="source-${id}">${id in runtimeDraft?'Local override':'Inherited from root'}</span></div><button data-override="${id}" ${unlocked?'':'disabled'} title="Unlock editing to override an inherited value">${id in runtimeDraft?'Inherit':'Override'}</button></div>`).join('')}</div><div class="note-strip">Changes apply to this directory. Existing sessions retain their recorded configuration unless an explicit operation updates them.</div>`;}
const workflowNodes=[['Intake','TRIGGER','Message received',48,68],['Triage','GATE','Route to project',302,68],['Assign','EFFECT','Assign owner',556,68],['Implement','AGENT','Implement change',48,252],['Review','GATE','Review evidence',302,252],['Verify','EFFECT','Verify candidate',556,252],['Release','EFFECT','Publish approved SHA',810,252]];
function renderWorkflow(){return heading('Example App development','Workflow pack · Example App lifecycle',`<span class="chip hide-mobile">Saved · r42</span><button data-action="validation">Validate</button><button class="primary" data-action="workflow-save" ${unlocked?'':'disabled'} title="Unlock editing to save a workflow">Save</button>`)+`<div class="content-split"><div style="display:flex;flex-direction:column;flex:1;min-width:0;min-height:0"><div class="workbench"><div class="workbench-toolbar"><button data-action="workflow-browse">Browse workflows ▾</button><div class="segmented" aria-label="Workflow view"><button class="selected" data-action="workflow-editor">Editor</button><button data-action="runs">Runs</button><button data-action="history">History</button></div><span class="spacer"></span><span class="muted">3 active runs</span><button data-action="add-node" ${unlocked?'':'disabled'}>+ Add node</button></div><div class="graph-area"><svg class="graph-svg" viewBox="0 0 1040 410" style="transform:scale(${zoom});transform-origin:top left" aria-label="Illustrative Example App workflow"><defs><marker id="arrowhead" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="var(--muted)"/></marker></defs><text class="lane-label" x="48" y="41">INTAKE & ASSIGNMENT</text><text class="lane-label" x="48" y="224">DEVELOPMENT & RELEASE</text>${[[244,102,302,102],[498,102,556,102],[244,286,302,286],[498,286,556,286],[752,286,810,286]].map(([x1,y1,x2,y2])=>`<path class="edge" d="M${x1} ${y1}H${x2-4}" marker-end="url(#arrowhead)"/>`).join('')}<path class="edge" d="M654 136V179H28V286H44" marker-end="url(#arrowhead)"/><text class="edge-label" x="376" y="169">owner assigned</text><text class="edge-label" x="506" y="276">approved</text>${workflowNodes.map(([name,kind,label,x,y])=>`<g class="node ${selected===name?'selected':''}" data-node="${name}" tabindex="0" role="button" aria-label="Inspect ${name} node"><rect x="${x}" y="${y}" width="196" height="68" rx="6"/><text class="kind" x="${x+12}" y="${y+18}">${kind}</text><text class="node-label" x="${x+12}" y="${y+38}">${label}</text><text class="node-status ${name==='Review'?'running':''}" x="${x+12}" y="${y+56}">${name==='Review'?'● 2 waiting for review':name==='Implement'?'● 1 running':name==='Release'?'Approved version only':'Ready'}</text></g>`).join('')}</svg><div class="zoom-controls"><button data-zoom="out" aria-label="Zoom out">−</button><span>${Math.round(zoom*100)}%</span><button data-zoom="in" aria-label="Zoom in">+</button><button data-zoom="fit">Fit</button></div></div><div class="runs-tray" id="runs-tray"><div class="section-head"><h3>Recent runs</h3><button class="text-button" data-action="toggle-runs">Hide</button></div><table><thead><tr><th>Run</th><th>Project</th><th>Current step</th><th>State</th><th>Started</th></tr></thead><tbody>${[['run-2048','Example App','Review evidence','Waiting','14:19'],['run-2047','Example Portal','Implement change','Running','14:12'],['run-2046','Backup Service','Review evidence','Waiting','14:08']].map(r=>`<tr><td><button class="text-button" data-run="${r[0]}">${r[0]}</button></td><td>${r[1]}</td><td>${r[2]}</td><td>${badge(r[3],states[r[3]])}</td><td class="numeric muted">${r[4]}</td></tr>`).join('')}</tbody></table></div></div></div>${selected?workflowInspector(selected):''}</div>`;}
function workflowInspector(name){return inspector(name,name.startsWith('run')?'Workflow run · Example App lifecycle':'Workflow node · Example App lifecycle',`<section class="inspector-section"><h3>${name.startsWith('run')?'Execution':'Configuration'}</h3>${keyValues([['Type',name.startsWith('run')?'Runtime inspection':workflowNodes.find(n=>n[0]===name)?.[1]||'Gate'],['Revision','r42'],['State',name==='Review'?'Waiting for review':'Available']])}</section><section class="inspector-section"><h3>Inputs & routing</h3><p class="muted">Node bindings, output ports, validation results, and branch conditions remain explicit in the full editor.</p></section><section class="inspector-section"><h3>Recent executions</h3><button class="text-button" data-run="run-2048">run-2048 · waiting</button><br><button class="text-button" data-run="run-2046">run-2046 · waiting</button></section>`,`<button data-action="node-config" ${unlocked?'':'disabled'}>Edit configuration</button>`);}
function render(){renderNav();document.querySelector('#lock-toggle').textContent=unlocked?'Editing enabled':'Edits locked';document.querySelector('#lock-toggle').setAttribute('aria-pressed',String(unlocked));document.querySelector('#page-root').innerHTML=({dashboard:renderDashboard,teams:renderTeams,sessions:renderSessions,workflow:renderWorkflow,configuration:renderConfiguration}[pageName])();document.title=`${pageName.charAt(0).toUpperCase()+pageName.slice(1)} · Evander design study`;}
function navigate(name){if(!sketchPages.includes(name)){openDialog(name==='reports'?'Reports':navGroups.flatMap(x=>x[1]).find(x=>x[0]===name)?.[1]||name,`<p>This destination is included in the navigation inventory. Its individual screen is outside this five-page sketch.</p><p>It would use the same collection, record, settings, or workbench pattern. See the written proposal for the mapping and rollout sequence.</p>`);return;}if(dirty){openDialog('Unsaved sample changes','<p>Save or discard the configuration draft before switching pages.</p><button data-action="close-dialog">Return to configuration</button>');return;}pageName=name;selected=null;query='';statusFilter='all';document.querySelector('#rail').classList.remove('mobile-open');history.replaceState(null,'','#'+name);render();}
function openDialog(title,body){lastFocus=document.activeElement;document.querySelector('#dialog-title').textContent=title;document.querySelector('#dialog-body').innerHTML=body;if(!document.querySelector('#dialog').open)document.querySelector('#dialog').showModal();}
function toast(message){const element=document.querySelector('#toast');element.textContent=message;element.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>element.hidden=true,4500);}
function showNotes(){const n=pageNotes[pageName];openDialog('A calmer operational workspace',`<p class="muted">Five representative screens using one visual and interaction language.</p><div class="principle-grid">${[['01 / Spend space on work','Use aligned rows for repeated records. Reserve cards for boards and independently meaningful summaries.'],['02 / Establish one hierarchy','A compact context bar, one page heading, one task toolbar, then the working surface.'],['03 / Reveal detail in context','Open a shared inspector when a record is selected. Keep filters and position when it closes.'],['04 / Make state legible','Pair restrained color with text. Keep empty, loading, stale, partial, and failed states distinct.'],['05 / Keep room for reading','Use readable body text and a consistent spacing scale. Use compact spacing and larger touch targets.'],['06 / Keep trust visible','Show directory, lock state, inheritance, pending edits, revision conflicts, and provenance where actions depend on them.']].map(([a,b])=>`<div><h3>${a}</h3><p>${b}</p></div>`).join('')}</div><h3>${n[0]}</h3><p>${n[1]}</p><p class="muted">${n[2]}</p><h3>First rollout to discuss</h3><p>Shared foundations → Sessions pilot → collections and Configuration → Teams → workflow workbench and Dashboard.</p>`);}
function showFinder(){openDialog('Find a page',`<label class="search" style="max-width:none">${icon('search')}<input id="page-finder" type="search" placeholder="Search the five sketched pages" aria-label="Find a sketched page"></label><div class="finder-results" id="finder-results"></div>`);updateFinder('');document.querySelector('#page-finder').focus();}
function updateFinder(q){document.querySelector('#finder-results').innerHTML=sketchPages.filter(x=>x.includes(q.toLowerCase())).map(x=>`<button data-find-page="${x}">${icon(x)}${x[0].toUpperCase()+x.slice(1)}<small>Interactive sketch</small></button>`).join('')||'<p class="muted">No matching sketched page.</p>';}
const sampleDialogs={notifications:['Notifications','<p>No unread notifications in this example. A real notification should link to the exact task, approval, or run and retain its read state.</p>'],columns:['Table columns','<p>The default columns answer the common comparison task. Optional columns and widths should persist per view. A selected record exposes further details in the inspector.</p>'],policy:['Session access policy','<p>The full policy record would keep all tool, communication, repository, and approval controls. The inspector presents a compact summary and an explicit route to that editor.</p>'], 'session-record':['Full session','<p>The full record uses the shared header and tabs for Overview, Access, Wake schedules, and Activity. Long policy editors and durable wake history have their own working surface.</p>'], 'session-edit':['Edit session','<p>This sketch stops at the entry point. The full editor would preserve expiry, model, permission, and wake controls with explicit save feedback.</p>'],evidence:['Verification evidence','<p>A real evidence view would show the immutable candidate, what was checked, the result, missing coverage, and the linked review decision.</p><p class="muted">This is illustrative content, not a verification result for any project.</p>'],'task-message':['Message owner','<p>Messaging would open the existing conversation for this task and agent, preserving its context and send policy.</p>'],'team-switch':['Team scope','<p>The team selector scopes Team views inside the global directory. Changing teams should retain the chosen view and make the scope change visible.</p>'],'team-destinations':['Team destinations','<p><strong>Work:</strong> Projects, Task board, Cases, Delivery, Planning.</p><p><strong>People:</strong> Teams, roles, Org chart.</p><p><strong>Communication:</strong> Chat, Mail.</p><p><strong>Activity:</strong> Operations, Activity, Activity timeline, Memory.</p><p>Workspace and Governance remain direct destinations. The final group labels need discussion.</p>'],'release-notes':['What’s new','<p>Release news remains visible on the dashboard. This archive would include earlier stories, their images and authorship, version details, changelog downloads, and practical tips.</p>'],effective:['Effective configuration','<p>Every effective value should show its source directory. Operators can compare local overrides with parent defaults and inspect raw configuration when needed.</p>'],validation:['Validation','<p>Sample validation is clear. Production validation must continue to show field errors, warnings, affected nodes, and a link to the exact location.</p><p class="muted">No real configuration or graph was validated by this sketch.</p>'],history:['Change history','<p>History remains tied to revisions and exact saved content. Comparing revisions should open a readable change view with actor and timestamp.</p>'],'workflow-browse':['Workflow library','<p>A searchable pack and graph navigator opens on demand. Recently used workflows are accessible first; graph editing keeps its full canvas.</p>'],'add-node':['Add workflow node','<p>A searchable node palette groups triggers, gates, queries, and effects. Selecting a provider retains its schema and binding editor.</p>'],'node-config':['Node configuration','<p>The inspector leads to the existing schema-driven fields, input bindings, output ports, and validation messages. Complex configuration can open in a wider editor.</p>'],'settings-search':['Find setting','<p>Reuse the existing configuration search, including labels, descriptions, field identifiers, and section links. Search must include the complete backend field inventory.</p>'],'edit-target':['Edit communication target','<p>The editor retains address, provider, capabilities, inheritance, override, and disable controls. This concept only demonstrates where the editor opens.</p>'],'add-target':['Add communication target','<p>A focused form would create the target in the selected directory. Its provider fields and capability policy remain explicit.</p>'],'workflow-save':['Workflow save','<p>No workflow changes exist in this sketch. Production saving must use the current revision and handle validation and concurrent edits.</p>']};
document.addEventListener('click',event=>{const b=event.target.closest('button,[data-task][role=button],[data-node]');if(!b||b.disabled)return;if(b.dataset.page){navigate(b.dataset.page);return;}if(b.dataset.findPage){document.querySelector('#dialog').close();navigate(b.dataset.findPage);return;}if(b.dataset.session!==undefined){selected=b.dataset.session;render();document.querySelector('#inspector-title')?.focus();return;}if(b.dataset.task){if(pageName!=='teams'){pageName='teams';history.replaceState(null,'','#teams');}selected=b.dataset.task;render();document.querySelector('#inspector-title')?.focus();return;}if(b.dataset.target!==undefined){selected=b.dataset.target;render();document.querySelector('#inspector-title')?.focus();return;}if(b.dataset.node||b.dataset.run){selected=b.dataset.node||b.dataset.run;render();document.querySelector('#inspector-title')?.focus();return;}if(b.dataset.layout){teamLayout=b.dataset.layout;render();return;}if(b.dataset.settings){if(dirty){toast('Save or discard the current sample changes first.');return;}if(!['targets','runtime'].includes(b.dataset.settings)){openDialog('Configuration coverage','<p>This section remains in the full field inventory. Communication targets and Agent runtime are the two settings sketches included here.</p>');return;}settingsSection=b.dataset.settings;query='';selected=null;render();return;}if(b.dataset.teamArea){if(b.dataset.teamArea==='Work')return;openDialog(b.dataset.teamArea,`<p>${b.dataset.teamArea==='Workspace'?'The Team overview would share the dashboard’s attention, work, and capacity pattern.':`The ${escapeHtml(b.dataset.teamArea.toLowerCase())} area groups related Team destinations while preserving their existing operations.`}</p><p>This interactive Team sketch focuses on the Task board and its record inspector.</p>`);return;}if(b.dataset.override){const id=b.dataset.override;if(id in runtimeDraft)delete runtimeDraft[id];else runtimeDraft[id]=runtimeDefaults[id];dirty=JSON.stringify(runtimeSaved)!==JSON.stringify(runtimeDraft);render();document.querySelector('#field-'+id)?.focus();return;}if(b.dataset.zoom){zoom=b.dataset.zoom==='fit'?1:Math.max(.7,Math.min(1.4,zoom+(b.dataset.zoom==='in'?.1:-.1)));render();return;}if(b.dataset.news){newsIndex+=b.dataset.news==='next'?1:-1;render();return;}const action=b.dataset.action;if(action==='read-news'){const n=newsStories[newsIndex];openDialog(n.title,`<article class="news-full"><p class="muted small">${n.date} · illustrative release story</p><p>${n.summary}</p><h3>What this means for operators</h3><p>${n.body}</p><button data-action="release-notes">Version details & changelog</button></article>`);return;}if(action==='close-dialog'){document.querySelector('#dialog').close();return;}if(action==='find'){showFinder();return;}if(action==='mobile-nav'){document.querySelector('#rail').classList.toggle('mobile-open');return;}if(action==='close-inspector'){const old=selected;selected=null;render();document.querySelector(`[data-session="${old}"],[data-task="${old}"],[data-target="${old}"],[data-node="${old}"]`)?.focus();return;}if(action==='refresh'){toast('Sample view refreshed. No live service is connected.');return;}if(action==='save'){runtimeSaved={...runtimeDraft};dirty=false;revision++;document.querySelectorAll('.source').forEach(x=>{if(x.textContent.includes('Local'))x.textContent='Local override · saved';});updateSave();toast('Sample changes saved in this page only.');return;}if(action==='discard'){runtimeDraft={...runtimeSaved};dirty=false;render();toast('Sample draft discarded.');return;}if(action==='toggle-runs'){document.querySelector('#runs-tray').hidden=true;return;}if(action==='runs'){const tray=document.querySelector('#runs-tray');tray.hidden=false;tray.scrollIntoView({block:'nearest'});return;}if(action==='workflow-editor'){selected=null;render();return;}if(sampleDialogs[action])openDialog(...sampleDialogs[action]);});
function updateSave(){const save=document.querySelector('[data-action=save]'),discard=document.querySelector('[data-action=discard]');if(save)save.disabled=!dirty||!unlocked;if(discard)discard.disabled=!dirty;const state=document.querySelector('#save-state');if(state)state.textContent=dirty?'Unsaved changes':unlocked?'No unsaved changes':'Editing locked · unlock to change settings';const rev=document.querySelector('.revision');if(rev)rev.textContent='Revision '+revision;}
document.addEventListener('input',event=>{if(event.target.id==='record-search'){const value=event.target.value;query=value;render();const el=document.querySelector('#record-search');el?.focus();}if(event.target.id==='page-finder')updateFinder(event.target.value);if(event.target.id.startsWith('field-')){runtimeDraft[event.target.id.slice(6)]=event.target.value;dirty=JSON.stringify(runtimeSaved)!==JSON.stringify(runtimeDraft);updateSave();}});
document.addEventListener('change',event=>{if(event.target.id==='state-filter'){statusFilter=event.target.value;render();}if(event.target.id==='settings-mobile'){if(dirty){event.target.value=settingsSection;toast('Save or discard the current sample changes first.');return;}settingsSection=event.target.value;selected=null;query='';render();}});
document.addEventListener('keydown',event=>{if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='k'){event.preventDefault();showFinder();}if(event.key==='Escape'&&!document.querySelector('#dialog').open){if(selected!==null){document.querySelector('[data-action=close-inspector]')?.click();}document.querySelector('#rail').classList.remove('mobile-open');}if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-task][role=button],[data-node]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.querySelector('#theme-toggle').addEventListener('click',event=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';event.currentTarget.textContent=dark?'Light':'Dark';event.currentTarget.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme');});
document.querySelector('#rationale-button').addEventListener('click',showNotes);
document.querySelector('#lock-toggle').addEventListener('click',()=>{if(dirty){toast('Save or discard the sample draft before locking.');return;}unlocked=!unlocked;render();toast(unlocked?'Editing enabled for this sketch only.':'Editing locked. Inspection remains available.');});
document.querySelector('#dialog').addEventListener('close',()=>{if(lastFocus?.isConnected)lastFocus.focus();});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
window.addEventListener('hashchange',()=>{const name=location.hash.slice(1);if(sketchPages.includes(name)&&name!==pageName){if(dirty){history.replaceState(null,'','#'+pageName);toast('Save or discard the current sample changes first.');}else navigate(name);}});
const initial=location.hash.slice(1);if(sketchPages.includes(initial))pageName=initial;render();
</script>
