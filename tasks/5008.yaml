- text: <div>I've given this some thought and I'm a little uncertain how to proceed.
    <a href="#" data-vss-mention="version:2.0,4f3f3e7c-a453-6ea8-b168-ba558f8b38bc">@Joakim
    Svensson</a>&nbsp;in the scenario you describe, it makes a lot of sense to use
    the codes instead of the IDs, but what about when a deviation is explicitly selected
    in the GUI instead of used as an input? Then altering a Deviation Code or Deviation
    Subcode's code would break the step. Should we add extra fields to the step so
    that one can either select code/subcode Ids or provide string codes for configuration?</div>
  author: ''
