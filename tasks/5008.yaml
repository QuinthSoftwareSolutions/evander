- text: <div><a href="#" data-vss-mention="version:2.0,24df1579-1799-645b-a070-d8a29d3f6b42">@Jonathan
    Quinth</a>&nbsp;</div><div><br></div><div>Well, as for changing codes/subcodes
    (or deleting them), thats a preperation thing, and people need to know what they
    are doing.</div><div><br></div><div>As for code/subcode selection on the step,
    yea extra fields is probably the best way forward.</div><div><br></div><div>Perhaps&nbsp;
    a checkbox that lets the user select a &quot;mode&quot; for this. &quot;Manual
    selection&quot; or something.</div><div>The default is checked, the behavior is
    the same as current, where you use dropdown to select, and Input's set Id's.</div><div><br></div><div><i>Note</i><b>:</b></div><div><i>The
    common case (that I have right now anyway), you will probably never select the
    Code dynamically, only the subcode, since we will mostly setup one one deviation
    code-list per machine/station.</i></div><div><br></div><div>If in unchecked, these
    are not dropdowns but regular text inputs. You either manually type in the code/subcode,
    or inputs set strings for code/subcode.</div><div><br></div><div>Ex:</div><div><br></div><div><img
    src="https://dev.azure.com/exampleindustry/70a1569b-16ac-476e-a6b5-44830b54dcc7/_apis/wit/attachments/6b19852e-280c-410b-be45-e8c53e937a17?fileName=image.png"
    alt=Image><br></div><div><br></div>
