---
- name: Skip managed Admin Web Caddy proxy when disabled
  ansible.builtin.debug:
    msg: "Managed Admin Web Caddy proxy is disabled."
  when: not (evander_admin_web_caddy_enabled | bool)

- name: Manage Admin Web Caddy proxy
  when: evander_admin_web_caddy_enabled | bool
  block:
    - name: Assert Admin Web Caddy hostname is configured
      ansible.builtin.assert:
        that:
          - evander_services.admin_web | bool
          - evander_admin_web_caddy_hostname | length > 0
          - >-
            evander_teams_notifications_public_base_url | length == 0 or
            evander_teams_notifications_caddy_hostname | length > 0
        fail_msg: >-
          evander_services.admin_web must be enabled and
          evander_admin_web_caddy_hostname must be set, or
          EVANDER_ADMIN_WEB_PUBLIC_BASE_URL must be present in
          evander_admin_web_env.
        success_msg: "Admin Web Caddy hostname is configured."

    - name: Install Caddy package
      ansible.builtin.apt:
        name: caddy
        state: present

    - name: Ensure Admin Web frontend dist directory exists
      ansible.builtin.stat:
        path: "{{ evander_admin_web_frontend_dist_dir }}/index.html"
      register: evander_admin_web_frontend_index

    - name: Assert Admin Web frontend assets were built
      ansible.builtin.assert:
        that:
          - evander_admin_web_frontend_index.stat.exists
        fail_msg: >-
          Expected built Admin Web frontend at
          {{ evander_admin_web_frontend_dist_dir }}/index.html before
          enabling Caddy static serving.
        success_msg: "Admin Web frontend assets are present."

    - name: Render Admin Web Caddyfile
      ansible.builtin.template:
        src: Caddyfile.j2
        dest: "{{ evander_admin_web_caddy_config_path }}"
        owner: root
        group: root
        mode: "0644"
      register: evander_admin_web_caddy_config
      when: evander_admin_web_caddy_manage_config | bool

    - name: Validate Admin Web Caddyfile
      ansible.builtin.command:
        cmd: "caddy validate --adapter caddyfile --config {{ evander_admin_web_caddy_config_path }}"
      changed_when: false
      when:
        - evander_admin_web_caddy_manage_config | bool
        - evander_admin_web_caddy_validate_config | bool

    - name: Enable and start Caddy
      ansible.builtin.systemd:
        name: caddy.service
        enabled: true
        state: started

    - name: Reload Caddy after Caddyfile changes
      ansible.builtin.systemd:
        name: caddy.service
        state: reloaded
      when: evander_admin_web_caddy_config.changed | default(false)
