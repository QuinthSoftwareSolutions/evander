---
- name: Stop legacy Qdrant semantic store service from retired operational name
  ansible.builtin.systemd:
    name: agent-sandbox-qdrant.service
    enabled: false
    state: stopped
  failed_when: false

- name: Remove legacy Qdrant semantic store unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/agent-sandbox-qdrant.service
    - /etc/systemd/system/agent-sandbox-qdrant.service.d
  register: evander_legacy_qdrant_unit_remove

- name: Reload systemd after removing legacy Qdrant unit files
  ansible.builtin.systemd:
    daemon_reload: true
  when: evander_legacy_qdrant_unit_remove.changed

- name: Stop Qdrant semantic store when disabled
  ansible.builtin.systemd:
    name: evander-qdrant.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (evander_services.semantic_store | default(false) | bool)

- name: Configure Qdrant semantic store
  when: evander_services.semantic_store | default(false) | bool
  block:
    - name: Install Docker for Qdrant semantic store
      ansible.builtin.apt:
        name: docker.io
        state: present

    - name: Ensure Docker service is enabled and running for Qdrant
      ansible.builtin.systemd:
        name: docker.service
        enabled: true
        state: started

    - name: Ensure Qdrant semantic store data directory exists
      ansible.builtin.file:
        path: "{{ evander_qdrant_data_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Pull pinned Qdrant semantic store image
      ansible.builtin.command:
        argv:
          - docker
          - pull
          - "{{ evander_qdrant_image }}"
      register: evander_qdrant_image_pull
      changed_when: "'Image is up to date' not in evander_qdrant_image_pull.stdout"

    - name: Install Qdrant semantic store systemd unit
      ansible.builtin.template:
        src: evander-qdrant.service.j2
        dest: /etc/systemd/system/evander-qdrant.service
        owner: root
        group: root
        mode: "0644"
      register: evander_qdrant_unit

    - name: Reconcile Qdrant semantic store service
      ansible.builtin.systemd:
        name: evander-qdrant.service
        enabled: true
        state: "{{ 'restarted' if evander_qdrant_unit.changed else 'started' }}"
        daemon_reload: true

    - name: Wait for Qdrant semantic store listener
      ansible.builtin.wait_for:
        host: "{{ evander_qdrant_bind_host }}"
        port: "{{ evander_qdrant_port }}"
        timeout: 120

    - name: Verify Qdrant semantic store health endpoint
      ansible.builtin.uri:
        url: "http://{{ evander_qdrant_bind_host }}:{{ evander_qdrant_port }}/healthz"
        method: GET
        return_content: true
        status_code: 200
      register: evander_qdrant_health
      retries: 12
      delay: 5
      until: evander_qdrant_health.status == 200
