---
- name: Ensure repo deploy-key SSH directory exists
  ansible.builtin.file:
    path: "{{ evander_repo_ssh_private_key_path | dirname }}"
    state: directory
    owner: "{{ evander_run_user }}"
    group: "{{ evander_run_user }}"
    mode: "0700"
  when: (evander_repo_ssh_private_key | default('') | length) > 0

- name: Install repo deploy key
  ansible.builtin.copy:
    content: "{{ evander_repo_ssh_private_key }}"
    dest: "{{ evander_repo_ssh_private_key_path }}"
    owner: "{{ evander_run_user }}"
    group: "{{ evander_run_user }}"
    mode: "0600"
  no_log: true
  when: (evander_repo_ssh_private_key | default('') | length) > 0

- name: Verify repo deploy key is usable non-interactively
  ansible.builtin.command:
    cmd: "ssh-keygen -y -P '' -f {{ evander_repo_ssh_private_key_path }}"
  become_user: "{{ evander_run_user }}"
  changed_when: false
  failed_when: false
  no_log: true
  register: evander_repo_deploy_key_check
  when: (evander_repo_ssh_private_key | default('') | length) > 0

- name: Assert repo deploy key is not passphrase protected
  ansible.builtin.assert:
    that:
      - evander_repo_deploy_key_check.rc == 0
    fail_msg: >-
      evander_repo_ssh_private_key must be a passphrase-free deploy key.
      The repo checkout runs non-interactively as {{ evander_run_user }},
      so passphrase-protected keys cannot be unlocked during deployment.
    success_msg: Repo deploy key is usable non-interactively.
  when: (evander_repo_ssh_private_key | default('') | length) > 0

- name: Check whether the destination checkout already exists
  ansible.builtin.stat:
    path: "{{ evander_deploy_path }}/.git"
  register: evander_repo_checkout_git_dir

- name: List tracked Ansible-managed paths known to the deployed checkout
  ansible.builtin.command:
    argv: >-
      {{
        ['git', '-C', evander_deploy_path, 'ls-files', '--']
        + evander_repo_managed_tracked_config_paths
      }}
  become_user: "{{ evander_run_user }}"
  register: evander_repo_known_tracked_paths
  changed_when: false
  when:
    - evander_repo_checkout_git_dir.stat.exists
    - (evander_repo_managed_tracked_config_paths | length) > 0

- name: Reset tracked Ansible-managed config before repo update
  ansible.builtin.command:
    argv: >-
      {{
        ['git', '-C', evander_deploy_path, 'checkout', '--']
        + evander_repo_known_tracked_paths.stdout_lines
      }}
  become_user: "{{ evander_run_user }}"
  changed_when: false
  when:
    - evander_repo_checkout_git_dir.stat.exists
    - (evander_repo_known_tracked_paths.stdout_lines | default([]) | length) > 0

- name: Clean untracked Ansible-managed config before repo update
  ansible.builtin.command:
    argv: >-
      {{
        ['git', '-C', evander_deploy_path, 'clean', '-f', '-x', '--']
        + evander_repo_managed_untracked_config_paths
      }}
  become_user: "{{ evander_run_user }}"
  changed_when: false
  when:
    - evander_repo_checkout_git_dir.stat.exists
    - (evander_repo_managed_untracked_config_paths | length) > 0

- name: Check out the requested repo revision
  ansible.builtin.git:
    repo: "{{ evander_repo_url }}"
    dest: "{{ evander_deploy_path }}"
    version: "{{ evander_repo_version }}"
    accept_newhostkey: "{{ evander_repo_accept_newhostkey | bool }}"
    key_file: >-
      {{
        evander_repo_ssh_private_key_path
        if (evander_repo_ssh_private_key | default('') | length) > 0
        else omit
      }}
    update: true
    force: false
  become_user: "{{ evander_run_user }}"
