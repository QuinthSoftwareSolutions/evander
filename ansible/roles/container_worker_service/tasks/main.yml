---
- name: Stop legacy worker daemon service from retired operational name
  ansible.builtin.systemd:
    name: agent-sandbox-worker-daemon.service
    enabled: false
    state: stopped
  failed_when: false

- name: Remove legacy worker daemon unit files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/agent-sandbox-worker-daemon.service
    - /etc/systemd/system/agent-sandbox-worker-daemon.service.d
  register: evander_legacy_worker_daemon_unit_remove

- name: Reload systemd after removing legacy worker daemon unit files
  ansible.builtin.systemd:
    daemon_reload: true
  when: evander_legacy_worker_daemon_unit_remove.changed

- name: Render worker daemon environment
  ansible.builtin.template:
    src: worker-daemon.env.j2
    dest: "{{ evander_deploy_path }}/config/worker-daemon.env"
    owner: "{{ evander_run_user }}"
    group: "{{ evander_run_user }}"
    mode: "0600"
  no_log: true
  register: evander_worker_env_render

- name: Install worker daemon systemd unit
  ansible.builtin.template:
    src: evander-worker-daemon.service.j2
    dest: /etc/systemd/system/evander-worker-daemon.service
    owner: root
    group: root
    mode: "0644"
  register: evander_worker_unit_render

- name: Reconcile worker daemon service
  ansible.builtin.systemd:
    name: evander-worker-daemon.service
    enabled: true
    state: >-
      {{
        'restarted'
        if (
          evander_worker_env_render.changed
          or evander_worker_unit_render.changed
          or (evander_run_user_membership_changed | default(false))
        )
        else 'started'
      }}
    daemon_reload: true
