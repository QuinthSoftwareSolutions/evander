---
- name: Assert worker MSSQL configuration is complete
  ansible.builtin.assert:
    that:
      - agent_sandbox_worker_mssql_accept_eula | bool
      - (agent_sandbox_worker_mssql_admin_password | default('') | string | length) > 0
      - (agent_sandbox_worker_mssql_port | int) > 0
      - (agent_sandbox_worker_mssql_port | int) <= 65535
    fail_msg: >-
      Enable agent_sandbox_worker_mssql_accept_eula and set
      agent_sandbox_worker_mssql_admin_password from Vault before enabling
      worker MSSQL provisioning.
    success_msg: Worker MSSQL configuration is complete.
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Install worker MSSQL apt prerequisites
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - gnupg
    state: present
    update_cache: true
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Ensure apt keyring directory exists
  ansible.builtin.file:
    path: "{{ agent_sandbox_worker_mssql_apt_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Install Microsoft apt signing key
  ansible.builtin.get_url:
    url: "{{ agent_sandbox_worker_mssql_apt_key_url }}"
    dest: "{{ agent_sandbox_worker_mssql_apt_key_path }}"
    owner: root
    group: root
    mode: "0644"
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Add Microsoft SQL Server apt repository
  ansible.builtin.apt_repository:
    repo: "{{ agent_sandbox_worker_mssql_server_repo }}"
    filename: microsoft-mssql-server
    state: present
    update_cache: true
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Add Microsoft SQL tools apt repository
  ansible.builtin.apt_repository:
    repo: "{{ agent_sandbox_worker_mssql_tools_repo }}"
    filename: microsoft-prod
    state: present
    update_cache: true
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Install SQL Server engine
  ansible.builtin.apt:
    name: "{{ agent_sandbox_worker_mssql_server_package }}"
    state: present
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Check whether SQL Server has been configured
  ansible.builtin.stat:
    path: /var/opt/mssql/mssql.conf
  register: agent_sandbox_worker_mssql_conf
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Run initial SQL Server setup
  ansible.builtin.command:
    argv:
      - /opt/mssql/bin/mssql-conf
      - -n
      - setup
  environment:
    ACCEPT_EULA: "Y"
    MSSQL_PID: "{{ agent_sandbox_worker_mssql_pid }}"
    MSSQL_SA_PASSWORD: "{{ agent_sandbox_worker_mssql_admin_password }}"
  no_log: true
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - not agent_sandbox_worker_mssql_conf.stat.exists

- name: Reconcile SQL Server SA password
  ansible.builtin.command:
    argv:
      - /opt/mssql/bin/mssql-conf
      - -n
      - set-sa-password
  environment:
    MSSQL_SA_PASSWORD: "{{ agent_sandbox_worker_mssql_admin_password }}"
  no_log: true
  changed_when: false
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - agent_sandbox_worker_mssql_conf.stat.exists

- name: Configure SQL Server TCP port
  ansible.builtin.command:
    argv:
      - /opt/mssql/bin/mssql-conf
      - set
      - network.tcpport
      - "{{ agent_sandbox_worker_mssql_port }}"
  register: agent_sandbox_worker_mssql_tcpport
  changed_when: "'SQL Server needs to be restarted' in (agent_sandbox_worker_mssql_tcpport.stdout | default(''))"
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Start SQL Server
  ansible.builtin.systemd:
    name: mssql-server.service
    enabled: true
    state: "{{ 'restarted' if agent_sandbox_worker_mssql_tcpport.changed | default(false) else 'started' }}"
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Install SQL Server client tools
  ansible.builtin.apt:
    name: "{{ agent_sandbox_worker_mssql_tools_packages }}"
    state: present
  environment:
    ACCEPT_EULA: "Y"
  when: agent_sandbox_worker_mssql_enabled | bool

- name: Allow local SQL Server health checks
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - INPUT
      - -i
      - lo
      - -p
      - tcp
      - --dport
      - "{{ agent_sandbox_worker_mssql_port }}"
      - -j
      - ACCEPT
  register: agent_sandbox_worker_mssql_loopback_rule
  failed_when: false
  changed_when: false
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - agent_sandbox_worker_mssql_manage_iptables | bool

- name: Insert local SQL Server health-check firewall rule
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - INPUT
      - "1"
      - -i
      - lo
      - -p
      - tcp
      - --dport
      - "{{ agent_sandbox_worker_mssql_port }}"
      - -j
      - ACCEPT
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - agent_sandbox_worker_mssql_manage_iptables | bool
    - agent_sandbox_worker_mssql_loopback_rule.rc != 0

- name: Allow Docker bridge SQL Server access
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - INPUT
      - -p
      - tcp
      - --dport
      - "{{ agent_sandbox_worker_mssql_port }}"
      - -s
      - "{{ agent_sandbox_worker_mssql_allowed_source_cidr }}"
      - -j
      - ACCEPT
  register: agent_sandbox_worker_mssql_docker_rule
  failed_when: false
  changed_when: false
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - agent_sandbox_worker_mssql_manage_iptables | bool

- name: Insert Docker bridge SQL Server firewall rule
  ansible.builtin.command:
    argv:
      - iptables
      - -I
      - INPUT
      - "2"
      - -p
      - tcp
      - --dport
      - "{{ agent_sandbox_worker_mssql_port }}"
      - -s
      - "{{ agent_sandbox_worker_mssql_allowed_source_cidr }}"
      - -j
      - ACCEPT
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - agent_sandbox_worker_mssql_manage_iptables | bool
    - agent_sandbox_worker_mssql_docker_rule.rc != 0

- name: Check default SQL Server deny firewall rule
  ansible.builtin.command:
    argv:
      - iptables
      - -C
      - INPUT
      - -p
      - tcp
      - --dport
      - "{{ agent_sandbox_worker_mssql_port }}"
      - -j
      - DROP
  register: agent_sandbox_worker_mssql_drop_rule
  failed_when: false
  changed_when: false
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - agent_sandbox_worker_mssql_manage_iptables | bool

- name: Insert default SQL Server deny firewall rule
  ansible.builtin.command:
    argv:
      - iptables
      - -A
      - INPUT
      - -p
      - tcp
      - --dport
      - "{{ agent_sandbox_worker_mssql_port }}"
      - -j
      - DROP
  when:
    - agent_sandbox_worker_mssql_enabled | bool
    - agent_sandbox_worker_mssql_manage_iptables | bool
    - agent_sandbox_worker_mssql_drop_rule.rc != 0

- name: Verify SQL Server admin connectivity
  ansible.builtin.command:
    argv:
      - "{{ agent_sandbox_worker_mssql_sqlcmd_path }}"
      - -S
      - "{{ agent_sandbox_worker_mssql_admin_host }},{{ agent_sandbox_worker_mssql_port }}"
      - -U
      - "{{ agent_sandbox_worker_mssql_admin_user }}"
      - -C
      - -b
      - -Q
      - "SELECT 1"
  environment:
    SQLCMDPASSWORD: "{{ agent_sandbox_worker_mssql_admin_password }}"
  no_log: true
  changed_when: false
  when: agent_sandbox_worker_mssql_enabled | bool
