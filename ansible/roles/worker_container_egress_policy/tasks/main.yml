---
- name: Resolve worker egress policy activation
  ansible.builtin.set_fact:
    evander_worker_egress_policy_active: >-
      {{
        (evander_worker_egress_policy_enabled | bool)
        and (
          evander_worker_docker_network | default('none') | string | trim | lower
          not in ['', 'none']
        )
      }}
    evander_worker_effective_egress_policy_allow_tcp_endpoints: >-
      {{
        (evander_worker_egress_policy_allow_tcp_endpoints | default([]))
        + (evander_worker_egress_policy_extra_allow_tcp_endpoints | default([]))
      }}

- name: Install worker egress policy
  when: evander_worker_egress_policy_active | bool
  block:
    - name: Render worker egress policy script
      ansible.builtin.template:
        src: evander-worker-egress-policy.sh.j2
        dest: "{{ evander_worker_egress_policy_script_path }}"
        owner: root
        group: root
        mode: "0755"
      register: evander_worker_egress_policy_script_render

    - name: Install worker egress policy systemd unit
      ansible.builtin.template:
        src: evander-worker-egress-policy.service.j2
        dest: /etc/systemd/system/evander-worker-egress-policy.service
        owner: root
        group: root
        mode: "0644"
      register: evander_worker_egress_policy_unit_render

    - name: Reconcile worker egress policy service
      ansible.builtin.systemd:
        name: evander-worker-egress-policy.service
        enabled: true
        state: >-
          {{
            'restarted'
            if (
              evander_worker_egress_policy_script_render.changed
              or evander_worker_egress_policy_unit_render.changed
            )
            else 'started'
          }}
        daemon_reload: true

- name: Check existing worker egress policy systemd unit
  ansible.builtin.stat:
    path: /etc/systemd/system/evander-worker-egress-policy.service
  register: evander_worker_egress_policy_unit_stat
  when: not (evander_worker_egress_policy_active | bool)

- name: Disable inactive worker egress policy service
  ansible.builtin.systemd:
    name: evander-worker-egress-policy.service
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - not (evander_worker_egress_policy_active | bool)
    - evander_worker_egress_policy_unit_stat.stat.exists | default(false)
