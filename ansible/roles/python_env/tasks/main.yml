---
- name: Create the repo virtualenv with uv
  ansible.builtin.command:
    cmd: "uv venv {{ evander_deploy_path }}/.venv"
    creates: "{{ evander_deploy_path }}/.venv/bin/python"
  args:
    chdir: "{{ evander_deploy_path }}"
  become_user: "{{ evander_run_user }}"

- name: Install the repo into the virtualenv
  ansible.builtin.command:
    cmd: "uv pip install --python {{ evander_deploy_path }}/.venv/bin/python -e .{{ evander_python_install_extras }}"
  args:
    chdir: "{{ evander_deploy_path }}"
  environment: "{{ evander_python_install_env | default({}) }}"
  become_user: "{{ evander_run_user }}"
  changed_when: false
