---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Define verification targets
  ansible.builtin.set_fact:
    evander_verification_units:
      - key: admin_web
        unit: evander-admin-web.service
      - key: gateway
        unit: evander-gateway.service
      - key: firewall
        unit: evander-firewall.service
      - key: openai_relay
        unit: evander-openai-relay.service
      - key: didww_sip_bridge
        unit: evander-didww-sip-bridge.service
      - key: nuget_relay
        unit: evander-nuget-relay.service
      - key: npm_audit_facade
        unit: evander-npm-audit-facade.service
      - key: package_cache
        unit: evander-nexus.service
      - key: semantic_store
        unit: evander-qdrant.service
      - key: apt_cache
        unit: apt-cacher-ng.service
      - key: http_target_relay
        unit: evander-http-target-relay.service
      - key: ado_worker
        unit: evander-ado-worker.service
      - key: proxy_issue_sync
        unit: evander-proxy-issue-sync.service
      - key: discord_ingest
        unit: evander-discord-ingest.service
      - key: discord_wake
        unit: evander-discord-wake.service
      - key: scheduled_wake
        unit: evander-scheduled-wake.service
      - key: managed_git_refresh
        unit: evander-managed-git-refresh.service
      - key: teams_ingest
        unit: evander-teams-ingest.service
      - key: teams_notifications
        unit: evander-teams-notifications.service
      - key: teams_meeting_ingest
        unit: evander-teams-meeting-ingest.service
      - key: effect_orchestrator
        unit: evander-effect-orchestrator.service
      - key: trigger_orchestrator
        unit: evander-trigger-orchestrator.service

- name: Verify enabled services are active
  ansible.builtin.assert:
    that:
      - "ansible_facts.services.get(item.unit, {}).get('status') == 'enabled'"
      - "ansible_facts.services.get(item.unit, {}).get('state') == 'running'"
    fail_msg: "{{ item.unit }} should be enabled and running."
    success_msg: "{{ item.unit }} is enabled and running."
  loop: "{{ evander_verification_units }}"
  when: evander_services.get(item.key, false) | bool

- name: Verify disabled services are not enabled
  ansible.builtin.assert:
    that:
      - "ansible_facts.services.get(item.unit, {}).get('status') != 'enabled'"
      - "ansible_facts.services.get(item.unit, {}).get('state') != 'running'"
    fail_msg: "{{ item.unit }} should remain installed but not enabled/running."
    success_msg: "{{ item.unit }} remains installed without being enabled/running."
  loop: "{{ evander_verification_units }}"
  when: not (evander_services.get(item.key, false) | bool)

- name: Inspect managed Git refresh broker socket
  ansible.builtin.stat:
    path: /run/evander/managed-git-refresh.sock
  register: evander_managed_git_refresh_socket
  when: evander_services.get('managed_git_refresh', false) | bool

- name: Verify managed Git refresh broker socket is ready
  ansible.builtin.assert:
    that:
      - evander_managed_git_refresh_socket.stat.exists
      - evander_managed_git_refresh_socket.stat.issock
    fail_msg: evander-managed-git-refresh.service is active but its broker socket is unavailable.
    success_msg: Managed Git refresh broker socket is ready.
  when: evander_services.get('managed_git_refresh', false) | bool

- name: Verify managed Admin Web Caddy is active
  ansible.builtin.assert:
    that:
      - "ansible_facts.services.get('caddy.service', {}).get('status') == 'enabled'"
      - "ansible_facts.services.get('caddy.service', {}).get('state') == 'running'"
    fail_msg: "caddy.service should be enabled and running for managed Admin Web public access."
    success_msg: "caddy.service is enabled and running for managed Admin Web public access."
  when: evander_admin_web_caddy_enabled | bool

- name: Verify managed Asterisk is active
  ansible.builtin.assert:
    that:
      - "ansible_facts.services.get('asterisk.service', {}).get('status') == 'enabled'"
      - "ansible_facts.services.get('asterisk.service', {}).get('state') == 'running'"
    fail_msg: "asterisk.service should be enabled and running for managed DIDWW SIP bridge access."
    success_msg: "asterisk.service is enabled and running for managed DIDWW SIP bridge access."
  when: evander_asterisk_didww_enabled | bool

- name: Verify managed Asterisk ARI endpoint
  ansible.builtin.uri:
    url: >-
      http://{{ evander_asterisk_http_bind_host }}:{{ evander_asterisk_http_bind_port }}/ari/asterisk/info
    method: GET
    url_username: "{{ evander_asterisk_ari_user }}"
    url_password: "{{ evander_asterisk_ari_password }}"
    force_basic_auth: true
    status_code: 200
  no_log: true
  when: evander_asterisk_didww_enabled | bool

- name: Verify the libvirt network exists
  ansible.builtin.command:
    cmd: "virsh net-info evander"
  changed_when: false
  register: evander_libvirt_network
  when: evander_service_profile == "full"

- name: Verify the nftables table exists
  ansible.builtin.command:
    cmd: "nft list table inet evander"
  changed_when: false
  register: evander_firewall_table
  when: evander_services.firewall | bool

- name: Verify the base image exists
  ansible.builtin.stat:
    path: "{{ evander_base_image_path }}"
  register: evander_base_image
  when: evander_service_profile == "full"

- name: Assert the base image is present
  ansible.builtin.assert:
    that:
      - evander_base_image.stat.exists
    fail_msg: "Expected base image at {{ evander_base_image_path }}."
    success_msg: "Base image present at {{ evander_base_image_path }}."
  when: evander_service_profile == "full"

- name: Run repo-aware status verification
  ansible.builtin.command:
    cmd: "./.venv/bin/evander-cli status --runtime-dir runtime"
  args:
    chdir: "{{ evander_deploy_path }}"
  become_user: "{{ evander_run_user }}"
  changed_when: false
  register: evander_status

- name: Wait for enabled TCP listeners
  ansible.builtin.wait_for:
    host: "{{ item.host | default('127.0.0.1') }}"
    port: "{{ item.port }}"
    timeout: 30
  loop:
    - key: admin_web
      port: 8100
    - key: gateway
      port: 8000
    - key: openai_relay
      port: 11434
    - key: nuget_relay
      port: 11666
    - key: npm_audit_facade
      port: "{{ evander_npm_audit_facade_port }}"
    - key: package_cache
      port: "{{ evander_nexus_port }}"
    - key: semantic_store
      port: "{{ evander_qdrant_port }}"
      host: "{{ evander_qdrant_bind_host }}"
    - key: apt_cache
      port: "{{ evander_apt_cache_port }}"
    - key: http_target_relay
      port: 11777
    - key: teams_notifications
      port: "{{ evander_teams_notifications_listener_port }}"
      host: "{{ evander_teams_notifications_listener_host }}"
  when: evander_services.get(item.key, false) | bool

- name: Verify enabled relay health endpoints
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    return_content: true
    status_code: 200
  loop:
    - key: admin_web
      url: "http://127.0.0.1:8100/healthz"
    - key: openai_relay
      url: "http://127.0.0.1:11434/healthz"
    - key: nuget_relay
      url: "http://127.0.0.1:11666/healthz"
    - key: npm_audit_facade
      url: "http://127.0.0.1:{{ evander_npm_audit_facade_port }}/healthz"
    - key: package_cache
      url: "http://127.0.0.1:{{ evander_nexus_port }}/service/rest/v1/status"
    - key: semantic_store
      url: "http://{{ evander_qdrant_bind_host }}:{{ evander_qdrant_port }}/healthz"
    - key: apt_cache
      url: "http://127.0.0.1:{{ evander_apt_cache_port }}/acng-report.html"
    - key: http_target_relay
      url: "http://127.0.0.1:11777/healthz"
    - key: teams_notifications
      url: "http://{{ evander_teams_notifications_listener_endpoint_host }}:{{ evander_teams_notifications_listener_port }}/healthz"
  when: evander_services.get(item.key, false) | bool

- name: Verify managed Admin Web Caddy serves frontend and proxies health
  ansible.builtin.shell: |
    set -euo pipefail
    host="{{ evander_admin_web_caddy_hostname }}"
    dist_dir="{{ evander_admin_web_frontend_dist_dir }}"
    curl_common=(
      curl
      --fail
      --silent
      --show-error
      --insecure
      --connect-timeout
      "{{ evander_admin_web_caddy_verification_connect_timeout_seconds }}"
      --max-time
      "{{ evander_admin_web_caddy_verification_max_time_seconds }}"
      --resolve
      "${host}:443:127.0.0.1"
    )

    probe_caddy_url() {
      local url="$1"
      echo "Probing ${url}"
      "${curl_common[@]}" -o /dev/null "${url}"
    }

    probe_caddy_url "https://${host}/healthz"
    probe_caddy_url "https://${host}/"
    probe_caddy_url "https://${host}/index.html"

    {% if evander_teams_notifications_public_base_url | length > 0 %}
    callback_host="{{ evander_teams_notifications_caddy_hostname }}"
    challenge="evander-caddy-notification-probe"
    challenge_response="$(
      "${curl_common[@]}" \
        --resolve "${callback_host}:443:127.0.0.1" \
        --request POST \
        "https://${callback_host}/msgraph/teams/notifications?validationToken=${challenge}"
    )"
    if [[ "${challenge_response}" != "${challenge}" ]]; then
      echo "Teams notification callback challenge did not traverse Caddy correctly" >&2
      exit 1
    fi
    {% endif %}

    for extension in js css; do
      asset_path="$(find "${dist_dir}/assets" -maxdepth 1 -type f -name "*.${extension}" -print -quit)"
      if [[ -z "${asset_path}" ]]; then
        echo "No built ${extension} asset found under ${dist_dir}/assets" >&2
        exit 1
      fi
      url_path="/${asset_path#"${dist_dir}/"}"
      probe_caddy_url "https://${host}${url_path}"
    done
  args:
    executable: /bin/bash
  register: evander_admin_web_caddy_frontend_probe
  retries: "{{ evander_admin_web_caddy_verification_retries | int }}"
  delay: "{{ evander_admin_web_caddy_verification_delay_seconds | int }}"
  until: evander_admin_web_caddy_frontend_probe.rc == 0
  changed_when: false
  when:
    - evander_admin_web_caddy_enabled | bool
    - evander_services.admin_web | bool

- name: Emit deployment verification summary
  ansible.builtin.debug:
    msg:
      - "service profile: {{ evander_service_profile }}"
      - "libvirt network: {{ evander_libvirt_network.stdout_lines | default(['skipped']) }}"
      - "firewall table verified: {{ (evander_firewall_table.rc == 0) if (evander_services.firewall | bool) else 'skipped' }}"
      - "base image: {{ evander_base_image_path if evander_service_profile == 'full' else 'skipped' }}"
      - "status command: {{ evander_status.stdout_lines | default([]) }}"
