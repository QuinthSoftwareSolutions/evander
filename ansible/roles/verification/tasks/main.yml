---
- name: Gather service facts
  ansible.builtin.service_facts:

- name: Define verification targets
  ansible.builtin.set_fact:
    agent_sandbox_verification_units:
      - key: admin_web
        unit: agent-sandbox-admin-web.service
      - key: gateway
        unit: agent-sandbox-gateway.service
      - key: firewall
        unit: agent-sandbox-firewall.service
      - key: openai_relay
        unit: agent-sandbox-openai-relay.service
      - key: didww_sip_bridge
        unit: agent-sandbox-didww-sip-bridge.service
      - key: nuget_relay
        unit: agent-sandbox-nuget-relay.service
      - key: npm_audit_facade
        unit: agent-sandbox-npm-audit-facade.service
      - key: package_cache
        unit: agent-sandbox-nexus.service
      - key: semantic_store
        unit: agent-sandbox-qdrant.service
      - key: apt_cache
        unit: apt-cacher-ng.service
      - key: http_target_relay
        unit: agent-sandbox-http-target-relay.service
      - key: ado_worker
        unit: agent-sandbox-ado-worker.service
      - key: proxy_issue_sync
        unit: agent-sandbox-proxy-issue-sync.service
      - key: discord_ingest
        unit: agent-sandbox-discord-ingest.service
      - key: discord_wake
        unit: agent-sandbox-discord-wake.service
      - key: scheduled_wake
        unit: agent-sandbox-scheduled-wake.service
      - key: teams_ingest
        unit: agent-sandbox-teams-ingest.service
      - key: teams_meeting_ingest
        unit: agent-sandbox-teams-meeting-ingest.service
      - key: effect_orchestrator
        unit: agent-sandbox-effect-orchestrator.service
      - key: trigger_orchestrator
        unit: agent-sandbox-trigger-orchestrator.service

- name: Verify enabled services are active
  ansible.builtin.assert:
    that:
      - "ansible_facts.services.get(item.unit, {}).get('status') == 'enabled'"
      - "ansible_facts.services.get(item.unit, {}).get('state') == 'running'"
    fail_msg: "{{ item.unit }} should be enabled and running."
    success_msg: "{{ item.unit }} is enabled and running."
  loop: "{{ agent_sandbox_verification_units }}"
  when: agent_sandbox_services.get(item.key, false) | bool

- name: Verify disabled services are not enabled
  ansible.builtin.assert:
    that:
      - "ansible_facts.services.get(item.unit, {}).get('status') != 'enabled'"
      - "ansible_facts.services.get(item.unit, {}).get('state') != 'running'"
    fail_msg: "{{ item.unit }} should remain installed but not enabled/running."
    success_msg: "{{ item.unit }} remains installed without being enabled/running."
  loop: "{{ agent_sandbox_verification_units }}"
  when: not (agent_sandbox_services.get(item.key, false) | bool)

- name: Verify managed Admin Web Caddy is active
  ansible.builtin.assert:
    that:
      - "ansible_facts.services.get('caddy.service', {}).get('status') == 'enabled'"
      - "ansible_facts.services.get('caddy.service', {}).get('state') == 'running'"
    fail_msg: "caddy.service should be enabled and running for managed Admin Web public access."
    success_msg: "caddy.service is enabled and running for managed Admin Web public access."
  when: agent_sandbox_admin_web_caddy_enabled | bool

- name: Verify the libvirt network exists
  ansible.builtin.command:
    cmd: "virsh net-info agent-sandbox"
  changed_when: false
  register: agent_sandbox_libvirt_network
  when: agent_sandbox_service_profile == "full"

- name: Verify the nftables table exists
  ansible.builtin.command:
    cmd: "nft list table inet agent_sandbox"
  changed_when: false
  register: agent_sandbox_firewall_table
  when: agent_sandbox_services.firewall | bool

- name: Verify the base image exists
  ansible.builtin.stat:
    path: "{{ agent_sandbox_base_image_path }}"
  register: agent_sandbox_base_image
  when: agent_sandbox_service_profile == "full"

- name: Assert the base image is present
  ansible.builtin.assert:
    that:
      - agent_sandbox_base_image.stat.exists
    fail_msg: "Expected base image at {{ agent_sandbox_base_image_path }}."
    success_msg: "Base image present at {{ agent_sandbox_base_image_path }}."
  when: agent_sandbox_service_profile == "full"

- name: Run repo-aware status verification
  ansible.builtin.command:
    cmd: "./.venv/bin/agent-sandbox-cli status --runtime-dir runtime"
  args:
    chdir: "{{ agent_sandbox_deploy_path }}"
  become_user: "{{ agent_sandbox_run_user }}"
  changed_when: false
  register: agent_sandbox_status

- name: Wait for enabled TCP listeners
  ansible.builtin.wait_for:
    host: "{{ item.host | default('127.0.0.1') }}"
    port: "{{ item.port }}"
    timeout: 30
  loop:
    - key: admin_web
      port: 8100
    - key: gateway
      port: 8000
    - key: openai_relay
      port: 11434
    - key: nuget_relay
      port: 11666
    - key: npm_audit_facade
      port: "{{ agent_sandbox_npm_audit_facade_port }}"
    - key: package_cache
      port: "{{ agent_sandbox_nexus_port }}"
    - key: semantic_store
      port: "{{ agent_sandbox_qdrant_port }}"
      host: "{{ agent_sandbox_qdrant_bind_host }}"
    - key: apt_cache
      port: "{{ agent_sandbox_apt_cache_port }}"
    - key: http_target_relay
      port: 11777
  when: agent_sandbox_services.get(item.key, false) | bool

- name: Verify enabled relay health endpoints
  ansible.builtin.uri:
    url: "{{ item.url }}"
    method: GET
    return_content: true
    status_code: 200
  loop:
    - key: admin_web
      url: "http://127.0.0.1:8100/healthz"
    - key: openai_relay
      url: "http://127.0.0.1:11434/healthz"
    - key: nuget_relay
      url: "http://127.0.0.1:11666/healthz"
    - key: npm_audit_facade
      url: "http://127.0.0.1:{{ agent_sandbox_npm_audit_facade_port }}/healthz"
    - key: package_cache
      url: "http://127.0.0.1:{{ agent_sandbox_nexus_port }}/service/rest/v1/status"
    - key: semantic_store
      url: "http://{{ agent_sandbox_qdrant_bind_host }}:{{ agent_sandbox_qdrant_port }}/healthz"
    - key: apt_cache
      url: "http://127.0.0.1:{{ agent_sandbox_apt_cache_port }}/acng-report.html"
    - key: http_target_relay
      url: "http://127.0.0.1:11777/healthz"
  when: agent_sandbox_services.get(item.key, false) | bool

- name: Verify managed Admin Web Caddy serves frontend and proxies health
  ansible.builtin.shell: |
    set -euo pipefail
    host="{{ agent_sandbox_admin_web_caddy_hostname }}"
    dist_dir="{{ agent_sandbox_admin_web_frontend_dist_dir }}"
    curl_common=(
      curl
      --fail
      --silent
      --show-error
      --insecure
      --connect-timeout
      "{{ agent_sandbox_admin_web_caddy_verification_connect_timeout_seconds }}"
      --max-time
      "{{ agent_sandbox_admin_web_caddy_verification_max_time_seconds }}"
      --resolve
      "${host}:443:127.0.0.1"
    )

    probe_caddy_url() {
      local url="$1"
      echo "Probing ${url}"
      "${curl_common[@]}" -o /dev/null "${url}"
    }

    probe_caddy_url "https://${host}/healthz"
    probe_caddy_url "https://${host}/"
    probe_caddy_url "https://${host}/index.html"

    for extension in js css; do
      asset_path="$(find "${dist_dir}/assets" -maxdepth 1 -type f -name "*.${extension}" -print -quit)"
      if [[ -z "${asset_path}" ]]; then
        echo "No built ${extension} asset found under ${dist_dir}/assets" >&2
        exit 1
      fi
      url_path="/${asset_path#"${dist_dir}/"}"
      probe_caddy_url "https://${host}${url_path}"
    done
  args:
    executable: /bin/bash
  register: agent_sandbox_admin_web_caddy_frontend_probe
  retries: "{{ agent_sandbox_admin_web_caddy_verification_retries | int }}"
  delay: "{{ agent_sandbox_admin_web_caddy_verification_delay_seconds | int }}"
  until: agent_sandbox_admin_web_caddy_frontend_probe.rc == 0
  changed_when: false
  when:
    - agent_sandbox_admin_web_caddy_enabled | bool
    - agent_sandbox_services.admin_web | bool

- name: Emit deployment verification summary
  ansible.builtin.debug:
    msg:
      - "service profile: {{ agent_sandbox_service_profile }}"
      - "libvirt network: {{ agent_sandbox_libvirt_network.stdout_lines | default(['skipped']) }}"
      - "firewall table verified: {{ (agent_sandbox_firewall_table.rc == 0) if (agent_sandbox_services.firewall | bool) else 'skipped' }}"
      - "base image: {{ agent_sandbox_base_image_path if agent_sandbox_service_profile == 'full' else 'skipped' }}"
      - "status command: {{ agent_sandbox_status.stdout_lines | default([]) }}"
