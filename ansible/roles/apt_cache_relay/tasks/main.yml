---
- name: Stop apt cache relay when disabled
  ansible.builtin.systemd:
    name: apt-cacher-ng.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (evander_services.apt_cache | default(false) | bool)

- name: Configure apt cache relay
  when: evander_services.apt_cache | default(false) | bool
  block:
    - name: Install apt-cacher-ng package
      ansible.builtin.apt:
        name: apt-cacher-ng
        state: present
        update_cache: true

    - name: Ensure apt-cacher-ng cache directory exists
      ansible.builtin.file:
        path: "{{ evander_apt_cache_cache_dir }}"
        state: directory
        owner: apt-cacher-ng
        group: apt-cacher-ng
        mode: "0755"

    - name: Configure apt-cacher-ng listener and cache directory
      ansible.builtin.lineinfile:
        path: "{{ evander_apt_cache_config_path }}"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: '^\s*#?\s*Port:'
          line: "Port: {{ evander_apt_cache_port }}"
        - regexp: '^\s*#?\s*BindAddress:'
          line: "BindAddress: {{ evander_apt_cache_bind_host }}"
        - regexp: '^\s*#?\s*CacheDir:'
          line: "CacheDir: {{ evander_apt_cache_cache_dir }}"
      register: evander_apt_cache_config

    - name: Configure apt-cacher-ng HTTPS pass-through allowlist
      ansible.builtin.lineinfile:
        path: "{{ evander_apt_cache_config_path }}"
        regexp: '^\s*#?\s*PassThroughPattern:'
        line: "PassThroughPattern: {{ evander_apt_cache_passthrough_pattern }}"
      register: evander_apt_cache_passthrough_config
      when: (evander_apt_cache_passthrough_pattern | default('') | string | length) > 0

    - name: Reconcile apt cache relay service
      ansible.builtin.systemd:
        name: apt-cacher-ng.service
        enabled: true
        state: >-
          {{
            'restarted'
            if (
              evander_apt_cache_config.changed
              or evander_apt_cache_passthrough_config.changed | default(false)
            )
            else 'started'
          }}
        daemon_reload: true

    - name: Wait for apt cache relay listener
      ansible.builtin.wait_for:
        host: "127.0.0.1"
        port: "{{ evander_apt_cache_port }}"
        timeout: 60

    - name: Verify apt cache relay report endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ evander_apt_cache_port }}/acng-report.html"
        method: GET
        return_content: true
        status_code: 200
