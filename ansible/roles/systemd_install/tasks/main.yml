---
- name: Run systemd install preflight
  ansible.builtin.command:
    cmd: "./scripts/install_systemd_units.sh --preflight"
  args:
    chdir: "{{ evander_deploy_path }}"
  changed_when: false
  environment:
    SUDO_USER: "{{ evander_run_user }}"
    EVANDER_GIT_USER: "{{ evander_git_user | default(evander_run_user) }}"
    EVANDER_SERVICE_PROFILE: "{{ evander_service_profile }}"

- name: Install repo-native systemd units
  ansible.builtin.command:
    cmd: "./scripts/install_systemd_units.sh"
  args:
    chdir: "{{ evander_deploy_path }}"
  environment:
    SUDO_USER: "{{ evander_run_user }}"
    EVANDER_GIT_USER: "{{ evander_git_user | default(evander_run_user) }}"
    EVANDER_SERVICE_PROFILE: "{{ evander_service_profile }}"
