---
- name: Render managed env files
  ansible.builtin.template:
    src: env_file.j2
    dest: "{{ agent_sandbox_deploy_path }}/{{ item.path }}"
    owner: "{{ agent_sandbox_run_user }}"
    group: "{{ agent_sandbox_run_user }}"
    mode: "{{ item.mode }}"
  vars:
    env_map: "{{ item.env }}"
  loop:
    - path: "config/firewall.env"
      env: "{{ agent_sandbox_firewall_env }}"
      mode: "0640"
    - path: "config/gateway.env"
      env: "{{ agent_sandbox_gateway_env }}"
      mode: "0600"
    - path: "config/admin-web.env"
      env: "{{ agent_sandbox_admin_web_env }}"
      mode: "0600"
    - path: "config/openai-relay.env"
      env: "{{ agent_sandbox_openai_relay_env }}"
      mode: "0600"
    - path: "config/nuget-relay.env"
      env: "{{ agent_sandbox_nuget_relay_env }}"
      mode: "0600"
    - path: "config/http-target-relay.env"
      env: "{{ agent_sandbox_http_target_relay_env }}"
      mode: "0640"
    - path: "config/ado-worker.env"
      env: "{{ agent_sandbox_ado_worker_env }}"
      mode: "0600"
  register: agent_sandbox_env_file_render

- name: Render optional shared secrets.env
  ansible.builtin.template:
    src: env_file.j2
    dest: "{{ agent_sandbox_deploy_path }}/secrets.env"
    owner: "{{ agent_sandbox_run_user }}"
    group: "{{ agent_sandbox_run_user }}"
    mode: "0600"
  vars:
    env_map: "{{ agent_sandbox_shared_secrets_env }}"
  when: agent_sandbox_render_shared_secrets_env | bool
  register: agent_sandbox_shared_secrets_render

- name: Remove secrets.env when disabled
  ansible.builtin.file:
    path: "{{ agent_sandbox_deploy_path }}/secrets.env"
    state: absent
  when: not (agent_sandbox_render_shared_secrets_env | bool)
  register: agent_sandbox_shared_secrets_remove

- name: Render managed worker/global JSON config
  ansible.builtin.template:
    src: json_file.j2
    dest: "{{ agent_sandbox_deploy_path }}/{{ item.path }}"
    owner: "{{ agent_sandbox_run_user }}"
    group: "{{ agent_sandbox_run_user }}"
    mode: "{{ item.mode }}"
  vars:
    json_payload: "{{ item.payload }}"
  loop:
    - path: "config/ado-worker/config.json"
      payload: "{{ agent_sandbox_ado_worker_config }}"
      mode: "0600"
    - path: "config/discord-ingest/config.json"
      payload: "{{ agent_sandbox_discord_ingest_config }}"
      mode: "0640"
    - path: "config/discord-wake/config.json"
      payload: "{{ agent_sandbox_discord_wake_config }}"
      mode: "0640"
    - path: "config/scheduled-wake/config.json"
      payload: "{{ agent_sandbox_scheduled_wake_config }}"
      mode: "0640"
    - path: "config/teams-ingest/config.json"
      payload: "{{ agent_sandbox_teams_ingest_config }}"
      mode: "0640"
    - path: "config/host-heartbeat/config.json"
      payload: "{{ agent_sandbox_host_heartbeat_config }}"
      mode: "0640"
    - path: "config/trigger-orchestrator/config.json"
      payload: "{{ agent_sandbox_trigger_orchestrator_config }}"
      mode: "0640"
      enabled: "{{ agent_sandbox_manage_workflow_config }}"
  when: item.enabled | default(true) | bool
  register: agent_sandbox_json_config_render

- name: Check whether a controller-side workflow editor layout exists
  ansible.builtin.stat:
    path: "{{ agent_sandbox_workflow_layout_source_path }}"
  delegate_to: localhost
  become: false
  register: agent_sandbox_workflow_layout_source
  when: agent_sandbox_manage_workflow_config | bool

- name: Copy managed workflow editor layout
  ansible.builtin.copy:
    src: "{{ agent_sandbox_workflow_layout_source_path }}"
    dest: "{{ agent_sandbox_deploy_path }}/{{ agent_sandbox_workflow_layout_path }}"
    owner: "{{ agent_sandbox_run_user }}"
    group: "{{ agent_sandbox_run_user }}"
    mode: "0640"
  when:
    - agent_sandbox_manage_workflow_config | bool
    - agent_sandbox_workflow_layout_source.stat.exists | default(false)
  register: agent_sandbox_workflow_layout_copy

- name: Track whether managed service config changed
  ansible.builtin.set_fact:
    agent_sandbox_managed_service_config_changed: >-
      {{
        (agent_sandbox_env_file_render.changed | default(false))
        or (agent_sandbox_shared_secrets_render.changed | default(false))
        or (agent_sandbox_shared_secrets_remove.changed | default(false))
        or (agent_sandbox_json_config_render.changed | default(false))
        or (agent_sandbox_workflow_layout_copy.changed | default(false))
      }}
