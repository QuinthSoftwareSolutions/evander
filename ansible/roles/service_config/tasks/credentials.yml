---
- name: Initialize optional local credential custody
  ansible.builtin.command:
    argv:
      - "{{ evander_deploy_path }}/.venv/bin/evander-cli"
      - credentials
      - init
      - --runtime-dir
      - "{{ evander_runtime_dir }}"
      - --key-file
      - /etc/evander/credentials/master.key
      - --store-user
      - "{{ evander_run_user }}"
    chdir: "{{ evander_deploy_path }}"
  become: true
  no_log: true
  changed_when: false
  when: evander_initialize_credential_store | default(false) | bool
