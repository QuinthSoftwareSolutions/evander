---
- name: Check whether the Admin Web frontend exists
  ansible.builtin.stat:
    path: "{{ evander_admin_web_frontend_dir }}/package.json"
  register: evander_admin_web_frontend_package

- name: Install Admin Web frontend dependencies
  ansible.builtin.command:
    cmd: npm ci
  args:
    chdir: "{{ evander_admin_web_frontend_dir }}"
  become_user: "{{ evander_run_user }}"
  when:
    - evander_admin_web_frontend_build_enabled | bool
    - evander_admin_web_frontend_package.stat.exists

- name: Build Admin Web frontend assets
  ansible.builtin.command:
    cmd: npm run build
  args:
    chdir: "{{ evander_admin_web_frontend_dir }}"
  become_user: "{{ evander_run_user }}"
  when:
    - evander_admin_web_frontend_build_enabled | bool
    - evander_admin_web_frontend_package.stat.exists
