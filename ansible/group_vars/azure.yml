---
# Azure control-plane deployment overrides. Shared defaults live in all.yml.
agent_sandbox_repo_url: "git@github.com:QuinthSoftwareSolutions/agent-orchestrator.git"
agent_sandbox_repo_ssh_private_key: "{{ vault_agent_sandbox_repo_ssh_private_key }}"
agent_sandbox_deploy_path: "/opt/truman"
agent_sandbox_run_user: "truman"
agent_sandbox_service_profile: "control_plane_only"
agent_sandbox_manage_workflow_config: false
agent_sandbox_force_render_worker_config: false
agent_sandbox_worker_token: "{{ vault_agent_sandbox_worker_token }}"
agent_sandbox_nexus_admin_password: "{{ vault_agent_sandbox_nexus_admin_password | default('') }}"
agent_sandbox_control_plane_private_ip: "10.2.0.4"
agent_sandbox_git_host: "{{ agent_sandbox_control_plane_private_ip }}"

agent_sandbox_admin_web_env:
  ADMIN_WEB_HOST: "127.0.0.1"
  ADMIN_WEB_PORT: "8100"
  AGENT_SANDBOX_ADMIN_WEB_AUTH_MODE: "azure_sso"
  AGENT_SANDBOX_ADMIN_WEB_USERNAME: "admin"
  AGENT_SANDBOX_ADMIN_WEB_PASSWORD: "{{ vault_admin_web_password }}"
  AGENT_SANDBOX_ADMIN_WEB_SESSION_SECRET: "{{ vault_admin_web_session_secret }}"
  AGENT_SANDBOX_ADMIN_WEB_SESSION_TTL_SECONDS: "43200"
  AGENT_SANDBOX_ADMIN_WEB_COOKIE_SECURE: "true"
  AGENT_SANDBOX_ADMIN_WEB_PUBLIC_BASE_URL: "https://truman-admin.northeurope.cloudapp.azure.com"
  AGENT_SANDBOX_ADMIN_WEB_AZURE_TENANT_ID: "{{ vault_admin_web_azure_tenant_id }}"
  AGENT_SANDBOX_ADMIN_WEB_AZURE_CLIENT_ID: "{{ vault_admin_web_azure_client_id }}"
  AGENT_SANDBOX_ADMIN_WEB_AZURE_CLIENT_SECRET: "{{ vault_admin_web_azure_client_secret }}"
  AGENT_SANDBOX_ADMIN_WEB_AZURE_ALLOWED_USERS: "operator@example.invalid,operator@example.invalid"
  AGENT_SANDBOX_ADMIN_WEB_AZURE_REDIRECT_URI: "https://truman-admin.northeurope.cloudapp.azure.com/api/auth/azure-sso/callback"

agent_sandbox_render_shared_secrets_env: true
agent_sandbox_shared_secrets_env:
  OPENAI_API_KEY: "{{ vault_openai_api_key }}"
  AZURE_ARTIFACTS_PAT: "{{ vault_azure_artifacts_pat }}"
  ADO_WORK_ITEMS_AZURE_DEVOPS_PAT: "{{ vault_ado_work_items_pat }}"
  AZURE_DEVOPS_PAT: "{{ vault_azure_devops_pat }}"
  AZURE_DEVOPS_PR_PAT: "{{ vault_azure_devops_pr_pat }}"
  DISCORD_BOT_TOKEN: "{{ vault_discord_bot_token }}"
  MSSQL_SA_PASSWORD: "{{ vault_mssql_sa_password }}"
  AGENT_PROMPT_TOKEN_SECRET: "{{ vault_agent_prompt_token_secret }}"
  AGENT_SANDBOX_WORKER_TOKEN: "{{ vault_agent_sandbox_worker_token }}"
