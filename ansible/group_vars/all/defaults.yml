---
# Core deploy contract.
agent_sandbox_repo_url: "git@example.com:your-org/agent-sandbox.git"
agent_sandbox_repo_version: "main"
agent_sandbox_repo_accept_newhostkey: true
agent_sandbox_repo_ssh_private_key: ""
agent_sandbox_repo_ssh_private_key_path: "/home/{{ agent_sandbox_run_user }}/.ssh/agent-sandbox-repo-deploy-key"
agent_sandbox_manage_workflow_config: true
# Worker/global JSON config is operator-editable in the Admin GUI. Keep this true for
# fully Ansible-managed hosts; set false to create missing files but preserve live edits.
agent_sandbox_force_render_worker_config: true
agent_sandbox_repo_managed_base_tracked_config_paths:
  - config/admin-web.env
  - config/discord-ingest/config.json
  - config/firewall.env
  - config/teams-ingest/config.json
agent_sandbox_repo_managed_workflow_config_paths:
  - config/trigger-orchestrator/config.json
  - config/workflow-packs/agent-container-worker.v1.json
  - "{{ agent_sandbox_workflow_layout_path }}"
agent_sandbox_repo_managed_workflow_untracked_config_paths:
  - config/trigger-orchestrator/config.json
  - config/workflow-packs/agent-container-worker.v1.json
  - "{{ agent_sandbox_workflow_layout_path }}"
agent_sandbox_repo_managed_generated_tracked_paths:
  - frontend/workflow-editor/dist/index.html
agent_sandbox_repo_managed_tracked_config_paths: >-
  {{
    agent_sandbox_repo_managed_base_tracked_config_paths
    + agent_sandbox_repo_managed_generated_tracked_paths
    + (
      agent_sandbox_repo_managed_workflow_config_paths
      if agent_sandbox_manage_workflow_config
      else []
    )
  }}
agent_sandbox_repo_managed_base_untracked_config_paths:
  - config/ado-worker.env
  - config/discord-wake/config.json
  - config/gateway.env
  - config/http-target-relay.env
  - config/openai-relay.env
  - config/scheduled-wake/config.json
agent_sandbox_repo_managed_untracked_config_paths: >-
  {{
    agent_sandbox_repo_managed_base_untracked_config_paths
    + (
      agent_sandbox_repo_managed_workflow_untracked_config_paths
      if agent_sandbox_manage_workflow_config
      else []
    )
  }}
agent_sandbox_deploy_path: "/opt/agent-sandbox"
agent_sandbox_runtime_dir: "{{ agent_sandbox_deploy_path }}/runtime"
agent_sandbox_deployment_status_path: "{{ agent_sandbox_runtime_dir }}/deployment-status.json"
agent_sandbox_deployment_status_message: "Control plane update in progress."
agent_sandbox_deployment_status_ttl_seconds: 21600
agent_sandbox_run_user: "agent-sandbox"
agent_sandbox_manage_run_user: true
agent_sandbox_service_profile: "full"
agent_sandbox_run_user_supplementary_groups: >-
  {{
    ['libvirt', 'kvm']
    if agent_sandbox_service_profile == 'full'
    else []
  }}
agent_sandbox_common_host_packages:
  - acl
  - openssh-server
  - git
  - curl
  - python3
  - python3-pip
  - python3-venv
  - nodejs
  - npm
agent_sandbox_install_azure_cli: false
agent_sandbox_azure_cli_deb_architecture: >-
  {{
    'amd64'
    if ansible_architecture == 'x86_64'
    else (
      'arm64'
      if ansible_architecture in ['aarch64', 'arm64']
      else ansible_architecture
    )
  }}
agent_sandbox_local_vm_host_packages:
  - nftables
  - qemu-system-x86
  - qemu-utils
  - libvirt-daemon-system
  - libvirt-clients
  - virtinst
  - cloud-image-utils
  - ovmf
agent_sandbox_base_allowed_tcp_ports:
  - 22
  - 8000
  - 11434
  - 11666
  - 11777
agent_sandbox_control_plane_private_ip: "{{ ansible_default_ipv4.address | default('127.0.0.1') }}"

# Control-plane apt cache for worker VM provisioning. This is intentionally
# separate from Nexus, which only proxies PyPI and npm.
agent_sandbox_apt_cache_port: 3142
agent_sandbox_apt_cache_bind_host: "0.0.0.0"
agent_sandbox_apt_cache_cache_dir: "/var/cache/apt-cacher-ng"
agent_sandbox_apt_cache_config_path: "/etc/apt-cacher-ng/acng.conf"
agent_sandbox_apt_cache_passthrough_pattern: "^(packages\\.microsoft\\.com):443$"
agent_sandbox_worker_use_apt_proxy: true
agent_sandbox_worker_apt_proxy_config_path: "/etc/apt/apt.conf.d/01agent-sandbox-proxy"
agent_sandbox_worker_apt_proxy_url: "http://{{ agent_sandbox_control_plane_private_ip }}:{{ agent_sandbox_apt_cache_port }}"
agent_sandbox_worker_apt_proxy_https_url: ""
agent_sandbox_package_cache_allowed_tcp_ports: >-
  {{
    [agent_sandbox_nexus_port]
    if (agent_sandbox_services.package_cache | default(false) | bool)
    else []
  }}
agent_sandbox_apt_cache_allowed_tcp_ports: >-
  {{
    [agent_sandbox_apt_cache_port]
    if (agent_sandbox_services.apt_cache | default(false) | bool)
    else []
  }}
agent_sandbox_allowed_tcp_ports: >-
  {{
    agent_sandbox_base_allowed_tcp_ports
    + agent_sandbox_package_cache_allowed_tcp_ports
    + agent_sandbox_apt_cache_allowed_tcp_ports
  }}
agent_sandbox_git_host: "{{ agent_sandbox_control_plane_private_ip }}"

# Explicit worker egress destinations stay private to the control plane. The
# worker playbook can append operator-defined endpoints, but it should not need
# broad CIDRs or public internet destinations.
agent_sandbox_worker_egress_policy_allow_tcp_endpoints:
  - name: control-plane git ssh
    host: "{{ agent_sandbox_git_host }}"
    port: 22
  - name: control-plane mcp gateway
    host: "{{ agent_sandbox_control_plane_private_ip }}"
    port: 8000
  - name: control-plane openai relay
    host: "{{ agent_sandbox_control_plane_private_ip }}"
    port: 11434
  - name: control-plane nuget relay
    host: "{{ agent_sandbox_control_plane_private_ip }}"
    port: 11666
  - name: control-plane http target relay
    host: "{{ agent_sandbox_control_plane_private_ip }}"
    port: 11777
  - name: control-plane nexus package cache
    host: "{{ agent_sandbox_control_plane_private_ip }}"
    port: 8081
  - name: control-plane apt-cacher-ng
    host: "{{ agent_sandbox_control_plane_private_ip }}"
    port: 3142
agent_sandbox_worker_egress_policy_extra_allow_tcp_endpoints: []

# Control-plane package cache. Nexus Repository Community Edition proxies only
# public PyPI and npm in v1; publishing/internal hosted repositories are not
# provisioned by this role.
agent_sandbox_nexus_version: "3.91.1-04"
agent_sandbox_nexus_archive_url: "https://download.sonatype.com/nexus/3/nexus-{{ agent_sandbox_nexus_version }}-linux-x86_64.tar.gz"
agent_sandbox_nexus_archive_checksum: ""
agent_sandbox_nexus_user: "nexus"
agent_sandbox_nexus_group: "nexus"
agent_sandbox_nexus_install_parent: "/opt/sonatype"
agent_sandbox_nexus_install_dir: "{{ agent_sandbox_nexus_install_parent }}/nexus-{{ agent_sandbox_nexus_version }}"
agent_sandbox_nexus_current_link: "{{ agent_sandbox_nexus_install_parent }}/nexus"
agent_sandbox_nexus_data_dir: "/var/lib/agent-sandbox/nexus-data"
agent_sandbox_nexus_cache_dir: "/var/cache/agent-sandbox/nexus"
agent_sandbox_nexus_port: 8081
agent_sandbox_nexus_bind_host: "0.0.0.0"
agent_sandbox_nexus_admin_user: "admin"
agent_sandbox_nexus_admin_password: ""
agent_sandbox_nexus_accept_community_eula: true
agent_sandbox_nexus_blob_store: "default"
agent_sandbox_nexus_pypi_proxy_repository: "pypi-proxy"
agent_sandbox_nexus_pypi_group_repository: "pypi-all"
agent_sandbox_nexus_pypi_remote_url: "https://pypi.org/"
agent_sandbox_nexus_npm_proxy_repository: "npm-proxy"
agent_sandbox_nexus_npm_group_repository: "npm-all"
agent_sandbox_nexus_npm_remote_url: "https://registry.npmjs.org"
agent_sandbox_nexus_anonymous_reader_role: "agent-sandbox-package-cache-reader"
agent_sandbox_nexus_pypi_probe_asset_path: "packages/wheel/0.47.0/wheel-0.47.0-py3-none-any.whl"
agent_sandbox_worker_pypi_index_url: "http://{{ agent_sandbox_control_plane_private_ip }}:{{ agent_sandbox_nexus_port }}/repository/{{ agent_sandbox_nexus_pypi_group_repository }}/simple"
agent_sandbox_worker_npm_registry_url: "http://{{ agent_sandbox_control_plane_private_ip }}:{{ agent_sandbox_nexus_port }}/repository/{{ agent_sandbox_nexus_npm_group_repository }}/"
agent_sandbox_worker_validate_package_cache: true
agent_sandbox_worker_package_cache_probe_url: >-
  {{
    (
      agent_sandbox_worker_pypi_index_url
      | regex_replace('/simple/?$', '')
      | regex_replace('/+$', '')
    )
    ~ '/'
    ~ agent_sandbox_nexus_pypi_probe_asset_path
  }}

# Optional host-local semantic store. Qdrant is bound to localhost by default and is
# intentionally not added to guest/worker firewall allowances in this first slice.
agent_sandbox_qdrant_image: "qdrant/qdrant:v1.18.0"
agent_sandbox_qdrant_data_dir: "/var/lib/agent-sandbox/qdrant"
agent_sandbox_qdrant_bind_host: "127.0.0.1"
agent_sandbox_qdrant_port: 6333

# Host prerequisites.
agent_sandbox_host_packages: >-
  {{
    agent_sandbox_common_host_packages
    + (
      agent_sandbox_local_vm_host_packages
      if agent_sandbox_service_profile == 'full'
      else []
    )
  }}

# Install profile for the Python package.
agent_sandbox_python_install_extras: "[dev]"
agent_sandbox_python_install_env: {}

# Admin Web frontend build.
agent_sandbox_admin_web_frontend_dir: "{{ agent_sandbox_deploy_path }}/frontend/workflow-editor"
agent_sandbox_admin_web_frontend_dist_dir: "{{ agent_sandbox_admin_web_frontend_dir }}/dist"
agent_sandbox_admin_web_frontend_build_enabled: true
agent_sandbox_admin_web_caddy_enabled: false
agent_sandbox_admin_web_caddy_manage_config: "{{ agent_sandbox_admin_web_caddy_enabled }}"
agent_sandbox_admin_web_caddy_config_path: "/etc/caddy/Caddyfile"
agent_sandbox_admin_web_caddy_hostname: >-
  {{
    agent_sandbox_admin_web_env.get('AGENT_SANDBOX_ADMIN_WEB_PUBLIC_BASE_URL', '')
    | regex_replace('^https?://', '')
    | regex_replace('/.*$', '')
  }}
agent_sandbox_admin_web_caddy_upstream_host: "127.0.0.1"
agent_sandbox_admin_web_caddy_upstream_port: "{{ agent_sandbox_admin_web_env.get('ADMIN_WEB_PORT', '8100') }}"
agent_sandbox_admin_web_caddy_validate_config: true

# Workflow editor layout for a single-pack workflow is stored beside that pack.
agent_sandbox_managed_workflow_pack_files:
  - path: "config/workflow-packs/agent-container-worker.v1.json"
    source_path: "{{ playbook_dir }}/../config/workflow-packs/agent-container-worker.v1-example.json"
agent_sandbox_workflow_layout_path: "config/workflow-packs/agent-container-worker.v1.layout.json"
agent_sandbox_workflow_layout_source_path: "{{ playbook_dir }}/../config/workflow-packs/agent-container-worker.v1.layout-example.json"

# Repo-native scripts currently render units that point at deploy_path/runtime.
agent_sandbox_vm_storage_dir: "/var/lib/libvirt/images/agent-sandbox"
agent_sandbox_base_image_path: "{{ agent_sandbox_vm_storage_dir }}/images/ubuntu-24.04-server-cloudimg-amd64.img"

# Optional shared secret env file loaded by several systemd units.
agent_sandbox_render_shared_secrets_env: false
agent_sandbox_shared_secrets_env: {}

# Per-service environment files.
agent_sandbox_firewall_env:
  ALLOWED_TCP_PORTS: "{{ agent_sandbox_allowed_tcp_ports | join(' ') }}"

agent_sandbox_gateway_env:
  AZURE_DEVOPS_PR_PAT: ""

agent_sandbox_admin_web_env:
  ADMIN_WEB_HOST: "0.0.0.0"
  ADMIN_WEB_PORT: "8100"
  AGENT_SANDBOX_ADMIN_WEB_AUTH_MODE: "local_password"
  AGENT_SANDBOX_ADMIN_WEB_USERNAME: "admin"
  AGENT_SANDBOX_ADMIN_WEB_PASSWORD: "replace-with-real-password"
  AGENT_SANDBOX_ADMIN_WEB_SESSION_SECRET: "replace-with-random-secret"
  AGENT_SANDBOX_ADMIN_WEB_SESSION_TTL_SECONDS: "43200"
  AGENT_SANDBOX_ADMIN_WEB_COOKIE_SECURE: "false"

agent_sandbox_openai_relay_env:
  OPENAI_API_KEY: ""

agent_sandbox_nuget_relay_env:
  AZURE_ARTIFACTS_PAT: ""

agent_sandbox_http_target_relay_env: {}

agent_sandbox_ado_worker_env:
  ADO_WORK_ITEMS_AZURE_DEVOPS_PAT: ""

# Worker/global JSON config files.
agent_sandbox_ado_worker_config:
  runtime_dir: "runtime"
  poll_interval_seconds: 5
  directories: []
  yaml_output_dir: null
  setup_log_dir: null
  processed_store_path: null
  setup_script_path: "scripts/setup_vm.sh"
  ado_work_items_azure_devops_pat_env: "ADO_WORK_ITEMS_AZURE_DEVOPS_PAT"
  setup_timeout_seconds: 1800
  setup_concurrency_limit: 1
  setup_lock_path: null
  fetch_retry_count: 2
  fetch_retry_backoff_seconds: 2.0
  include_comments: true
  comments_max_count: 20
  comment_text_max_chars: 4000

agent_sandbox_discord_ingest_config:
  runtime_dir: "runtime"
  directories: []
  poll_interval_seconds: 5
  jitter_seconds: 5
  backoff_seconds: 60
  lock_path: null

agent_sandbox_discord_wake_config:
  runtime_dir: "runtime"
  directories: []
  poll_interval_seconds: 30
  jitter_seconds: 5
  cooldown_seconds: 60
  lock_path: null
  session_cooldown_path: null
  busy_check_script_path: "scripts/check_session_vm_busy.sh"
  resume_script_path: "scripts/resume_issue_agent.sh"
  wake_state_path: null
  vm_user: "agent"
  resume_timeout_seconds: 1200

agent_sandbox_scheduled_wake_config:
  runtime_dir: "runtime"
  directories: []
  poll_interval_seconds: 30
  jitter_seconds: 5
  cooldown_seconds: 60
  lock_path: null
  session_cooldown_path: null
  busy_check_script_path: "scripts/check_session_vm_busy.sh"
  resume_script_path: "scripts/resume_issue_agent.sh"
  wake_state_path: null
  vm_user: "agent"
  resume_timeout_seconds: 1200
  scheduled_wake_prefix_text: "You have unread PR comments. Please fetch them with list_unread_feedback."

agent_sandbox_teams_ingest_config:
  runtime_dir: "runtime"
  directories: []
  poll_interval_seconds: 2
  jitter_seconds: 5
  backoff_seconds: 60
  lock_path: null

agent_sandbox_trigger_orchestrator_config:
  runtime_dir: "runtime"
  poll_interval_seconds: 5
  jitter_seconds: 5
  lock_path: null
  event_queue_store_path: null
  event_queue_cursor_store_path: null
  workflow_packs:
    - "agent-container-worker.v1.json"
  workflow_transforms: []
  provider_loader:
    provider_profile: "profiles/agent-default"
    include_builtin: null
    provider_modules: []
    provider_entry_points_enabled: true

# Full current stack by default, with explicit toggle points for operators.
agent_sandbox_services:
  admin_web: true
  gateway: true
  firewall: "{{ agent_sandbox_service_profile == 'full' }}"
  openai_relay: true
  nuget_relay: true
  package_cache: true
  apt_cache: true
  semantic_store: true
  http_target_relay: true
  ado_worker: true
  proxy_issue_sync: true
  discord_ingest: true
  discord_wake: true
  scheduled_wake: true
  teams_ingest: true
  effect_orchestrator: true
  trigger_orchestrator: true
