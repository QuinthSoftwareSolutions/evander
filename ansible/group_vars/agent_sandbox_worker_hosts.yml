---
# Dedicated container-worker VM defaults. Shared repo checkout variables can still be
# overridden from inventory or Vault in the same way as the control-plane playbook.
agent_sandbox_deploy_path: "/opt/agent-sandbox-worker"
agent_sandbox_run_user: "agent-worker"
agent_sandbox_manage_run_user: true
agent_sandbox_run_user_supplementary_groups:
  - docker
agent_sandbox_install_azure_cli: false

agent_sandbox_repo_managed_tracked_config_paths: []
agent_sandbox_repo_managed_untracked_config_paths:
  - config/worker-daemon.env

# The worker systemd unit is rendered from this local Ansible checkout, while the
# daemon executable is installed from agent_sandbox_repo_version on the worker.
# Keep those two artifacts on the same commit unless explicitly bypassed.
agent_sandbox_worker_repo_version_mode: "playbook_revision"
agent_sandbox_worker_enforce_revision_match: true
agent_sandbox_worker_revision_guard_paths:
  - ansible/worker.yml
  - ansible/group_vars/agent_sandbox_worker_hosts.yml
  - ansible/roles/worker_apt_proxy
  - ansible/roles/worker_git_access
  - ansible/roles/worker_package_cache_preflight
  - ansible/roles/python_env
  - ansible/roles/container_worker_runtime
  - ansible/roles/worker_dotnet_toolchain
  - ansible/roles/worker_node_toolchain
  - ansible/roles/worker_playwright_toolchain
  - ansible/roles/worker_mssql
  - ansible/roles/worker_container_egress_policy
  - ansible/roles/container_worker_service
  - ansible/roles/container_worker_verification
  - pyproject.toml
  - src/agent_sandbox/worker
  - src/agent_sandbox/worker_daemon.py

agent_sandbox_host_packages:
  - acl
  - openssh-server
  - git
  - curl
  - python3
  - python3-pip
  - python3-venv
  - docker.io

agent_sandbox_python_install_extras: ""
agent_sandbox_worker_pypi_trusted_host: "{{ agent_sandbox_worker_pypi_index_url | urlsplit('hostname') }}"
agent_sandbox_python_install_env:
  UV_DEFAULT_INDEX: "{{ agent_sandbox_worker_pypi_index_url }}"
  UV_INDEX_URL: "{{ agent_sandbox_worker_pypi_index_url }}"
  UV_INSECURE_HOST: "{{ agent_sandbox_worker_pypi_trusted_host }}"
  PIP_INDEX_URL: "{{ agent_sandbox_worker_pypi_index_url }}"
  PIP_TRUSTED_HOST: "{{ agent_sandbox_worker_pypi_trusted_host }}"

agent_sandbox_worker_host: "0.0.0.0"
agent_sandbox_worker_port: 11888
agent_sandbox_worker_root: "/var/lib/agent-worker"
agent_sandbox_worker_runtime_dir: "{{ agent_sandbox_worker_root }}/runtime"
agent_sandbox_worker_sandbox_profile: "default"
# The worker daemon and generic worker inventory default to isolated containers.
# Deployments that need private control-plane reachability must opt into a
# non-none Docker network and the worker egress policy together.
agent_sandbox_worker_docker_network: "none"
agent_sandbox_worker_egress_policy_enabled: false
agent_sandbox_worker_egress_policy_chain: "AGENT-SANDBOX-WORKER-EGRESS"
agent_sandbox_worker_egress_policy_script_path: "/usr/local/sbin/agent-sandbox-worker-egress-policy"
agent_sandbox_worker_egress_policy_source_cidrs: []
agent_sandbox_worker_egress_policy_block_cidrs:
  - "169.254.0.0/16"
agent_sandbox_worker_read_only_rootfs: false
agent_sandbox_worker_tmpfs: []
# Empty means the playbook runs containers as the worker service account uid:gid so
# capability-dropped containers can still write durable session mounts.
agent_sandbox_worker_container_user: ""
agent_sandbox_worker_env:
  AGENT_SANDBOX_WORKER_TOKEN: "{{ agent_sandbox_worker_token }}"
  AGENT_SANDBOX_WORKER_MSSQL_ADMIN_PASSWORD: "{{ agent_sandbox_worker_mssql_admin_password }}"

# Optional worker-host SQL Server instance for session-scoped database provisioning.
# When enabled, agents request databases through MCP and receive a scoped SQL login
# that can connect from runner containers to agent_sandbox_worker_mssql_container_host.
agent_sandbox_worker_mssql_enabled: false
agent_sandbox_worker_mssql_accept_eula: false
agent_sandbox_worker_mssql_pid: "Developer"
agent_sandbox_worker_mssql_admin_user: "sa"
agent_sandbox_worker_mssql_admin_password: "{{ vault_agent_sandbox_worker_mssql_admin_password | default('') }}"
agent_sandbox_worker_mssql_admin_password_env: "AGENT_SANDBOX_WORKER_MSSQL_ADMIN_PASSWORD"
agent_sandbox_worker_mssql_admin_host: "127.0.0.1"
agent_sandbox_worker_mssql_port: 1433
agent_sandbox_worker_mssql_container_host: "172.17.0.1"
agent_sandbox_worker_mssql_sqlcmd_path: "/opt/mssql-tools18/bin/sqlcmd"
agent_sandbox_worker_mssql_package_proxy_environment:
  http_proxy: "{{ agent_sandbox_worker_apt_proxy_url }}"
  https_proxy: "{{ agent_sandbox_worker_apt_proxy_url }}"
agent_sandbox_worker_mssql_apt_key_url: "https://packages.microsoft.com/keys/microsoft.asc"
agent_sandbox_worker_mssql_apt_key_path: "/etc/apt/keyrings/microsoft.asc"
agent_sandbox_worker_mssql_server_repo: "deb [arch=amd64,arm64 signed-by={{ agent_sandbox_worker_mssql_apt_key_path }}] http://packages.microsoft.com/ubuntu/22.04/mssql-server-2022 jammy main"
agent_sandbox_worker_mssql_tools_repo: "deb [arch=amd64,arm64 signed-by={{ agent_sandbox_worker_mssql_apt_key_path }}] http://packages.microsoft.com/ubuntu/22.04/prod jammy main"
agent_sandbox_worker_mssql_server_package: "mssql-server"
agent_sandbox_worker_mssql_tools_packages:
  - mssql-tools18
  - unixodbc-dev
agent_sandbox_worker_mssql_manage_iptables: true
agent_sandbox_worker_mssql_allowed_source_cidr: "172.17.0.0/16"

# Worker Git is restricted to the control-plane bare mirror root. The worker
# daemon rejects repo_source values outside these prefixes.
agent_sandbox_control_plane_group: "agent_sandbox_hosts"
agent_sandbox_control_plane_host: "{{ groups.get(agent_sandbox_control_plane_group, []) | first | default('') }}"
agent_sandbox_control_plane_deploy_path: >-
  {{
    hostvars[agent_sandbox_control_plane_host].agent_sandbox_deploy_path | default('/opt/agent-sandbox')
    if (agent_sandbox_control_plane_host | string | length) > 0
    else '/opt/agent-sandbox'
  }}
agent_sandbox_git_host: >-
  {{
    hostvars[agent_sandbox_control_plane_host].get(
      'agent_sandbox_control_plane_private_ip',
      hostvars[agent_sandbox_control_plane_host].get(
        'ansible_default_ipv4',
        {}
      ).get(
        'address',
        hostvars[agent_sandbox_control_plane_host].get('ansible_host', '')
      )
    )
    if (agent_sandbox_control_plane_host | string | length) > 0
    else (agent_sandbox_control_plane_private_ip | default(''))
  }}
agent_sandbox_git_user: >-
  {{
    hostvars[agent_sandbox_control_plane_host].agent_sandbox_run_user | default('agent-sandbox')
    if (agent_sandbox_control_plane_host | string | length) > 0
    else 'agent-sandbox'
  }}
agent_sandbox_git_root: "{{ agent_sandbox_control_plane_deploy_path }}/git-remotes"
agent_sandbox_git_ssh_alias: "agent-sandbox-git-host"
agent_sandbox_worker_git_ssh_source_dir: "/home/{{ agent_sandbox_run_user }}/.ssh"
agent_sandbox_worker_git_key_path: "{{ agent_sandbox_worker_git_ssh_source_dir }}/agent-sandbox-git"
agent_sandbox_worker_git_allowed_from: "{{ ansible_default_ipv4.address | default(ansible_host) }}/32"
agent_sandbox_worker_git_access_enabled: "{{ (agent_sandbox_worker_git_ssh_source_dir | default('') | string | trim | length) > 0 }}"
agent_sandbox_worker_install_control_plane_git_authorized_key: "{{ (groups.get(agent_sandbox_control_plane_group, []) | length) > 0 }}"
agent_sandbox_worker_repo_checkout_via_control_plane_git: "{{ agent_sandbox_worker_install_control_plane_git_authorized_key }}"
agent_sandbox_worker_repo_mirror_name: "agent-sandbox-deploy"
agent_sandbox_worker_repo_mirror_path: "{{ agent_sandbox_git_root }}/{{ agent_sandbox_worker_repo_mirror_name }}.git"
agent_sandbox_worker_repo_checkout_url: "ssh://{{ agent_sandbox_git_ssh_alias }}{{ agent_sandbox_worker_repo_mirror_path }}"
agent_sandbox_worker_allowed_git_source_prefixes:
  - "ssh://{{ agent_sandbox_git_ssh_alias }}{{ agent_sandbox_git_root }}/"

# The runner image is deployed as a local Docker archive produced by
# scripts/build_agent_sandbox_runner_image.sh on the Ansible control machine.
agent_sandbox_runner_image_name: "agent-sandbox-runner:latest"
agent_sandbox_runner_image_archive_path: "{{ playbook_dir }}/../dist/agent-sandbox-runner.tar"
agent_sandbox_runner_image_remote_archive_path: "{{ agent_sandbox_worker_root }}/images/agent-sandbox-runner.tar"

# Worker-level read-only caches mounted into every runner container. The playbook
# creates these directories and seeds the .NET, Node, and Playwright caches.
# Operators can still populate NuGet fallback package artifacts out-of-band.
agent_sandbox_worker_toolchain_cache_root: "{{ agent_sandbox_worker_root }}/toolchain-cache"
agent_sandbox_worker_dotnet_cache_path: "{{ agent_sandbox_worker_toolchain_cache_root }}/dotnet"
agent_sandbox_worker_dotnet_tools_cache_path: "{{ agent_sandbox_worker_toolchain_cache_root }}/dotnet-tools"
agent_sandbox_worker_node_cache_path: "{{ agent_sandbox_worker_toolchain_cache_root }}/node-v24.14.0"
agent_sandbox_worker_playwright_runtime_cache_path: "{{ agent_sandbox_worker_toolchain_cache_root }}/playwright-runtime"
agent_sandbox_worker_playwright_browsers_cache_path: "{{ agent_sandbox_worker_toolchain_cache_root }}/ms-playwright"
agent_sandbox_worker_nuget_fallback_cache_path: "{{ agent_sandbox_worker_toolchain_cache_root }}/nuget-cache-ro"

# Seed the worker-mounted .NET SDK from the Ansible control machine.
# HOST_DOTNET_ROOT can override the default local dotnet path; set
# agent_sandbox_worker_dotnet_toolchain_archive_path to an existing .tar.gz when
# deploying from a prebuilt archive instead of a local dotnet directory.
agent_sandbox_worker_dotnet_toolchain_enabled: true
agent_sandbox_worker_dotnet_toolchain_local_path: >-
  {{
    lookup('env', 'HOST_DOTNET_ROOT')
    | default('/usr/lib/dotnet', true)
  }}
agent_sandbox_worker_dotnet_toolchain_archive_path: "{{ lookup('env', 'HOST_DOTNET_ARCHIVE') | default('', true) }}"
agent_sandbox_worker_dotnet_toolchain_remote_archive_path: "{{ agent_sandbox_worker_root }}/images/dotnet-toolchain.tar.gz"
agent_sandbox_worker_dotnet_tools_archive_path: "{{ lookup('env', 'HOST_DOTNET_TOOLS_ARCHIVE') | default('', true) }}"
agent_sandbox_worker_dotnet_tools_remote_archive_path: "{{ agent_sandbox_worker_root }}/images/dotnet-tools.tar.gz"
agent_sandbox_worker_dotnet_ef_package_id: "dotnet-ef"
agent_sandbox_worker_dotnet_ef_version: "{{ lookup('env', 'HOST_DOTNET_EF_VERSION') | default('10.0.0', true) }}"
agent_sandbox_worker_nuget_fallback_archive_path: "{{ lookup('env', 'HOST_NUGET_FALLBACK_ARCHIVE') | default('', true) }}"
agent_sandbox_worker_dotnet_restore_support_archive_path: >-
  {{
    lookup('env', 'HOST_DOTNET_RESTORE_SUPPORT_ARCHIVE')
    | default(agent_sandbox_worker_nuget_fallback_archive_path, true)
  }}
agent_sandbox_worker_dotnet_restore_support_remote_archive_path: "{{ agent_sandbox_worker_root }}/images/dotnet-restore-support.tar.gz"
agent_sandbox_worker_dotnet_restore_support_package_id: "Microsoft.Extensions.FileSystemGlobbing"
agent_sandbox_worker_dotnet_restore_support_package_version: "6.0.0"

# Seed the worker-mounted Node/npm toolchain from the Ansible control machine.
# HOST_NODE_ROOT can override the default local nvm path; set
# agent_sandbox_worker_node_toolchain_archive_path to an existing .tar.gz when
# deploying from a prebuilt archive instead of a local Node directory.
agent_sandbox_worker_node_toolchain_enabled: true
agent_sandbox_worker_node_version: "v24.14.0"
agent_sandbox_worker_node_toolchain_local_path: >-
  {{
    lookup('env', 'HOST_NODE_ROOT')
    | default(lookup('env', 'HOME') ~ '/.nvm/versions/node/' ~ agent_sandbox_worker_node_version, true)
  }}
agent_sandbox_worker_node_toolchain_archive_path: "{{ lookup('env', 'HOST_NODE_ARCHIVE') | default('', true) }}"
agent_sandbox_worker_node_toolchain_remote_archive_path: "{{ agent_sandbox_worker_root }}/images/node-{{ agent_sandbox_worker_node_version }}.tar.gz"

# Seed the worker-mounted Playwright runtime and browser cache from the Ansible
# control machine. HOST_PLAYWRIGHT_NODE_MODULES should point at a node_modules
# directory containing playwright and playwright-core; HOST_PLAYWRIGHT_BROWSERS
# should point at the Playwright browser cache.
agent_sandbox_worker_playwright_toolchain_enabled: true
agent_sandbox_worker_playwright_node_modules_local_path: >-
  {{
    lookup('env', 'HOST_PLAYWRIGHT_NODE_MODULES')
    | default(playbook_dir ~ '/../frontend/workflow-editor/node_modules', true)
  }}
agent_sandbox_worker_playwright_browsers_local_path: >-
  {{
    lookup('env', 'HOST_PLAYWRIGHT_BROWSERS')
    | default(lookup('env', 'HOME') ~ '/.cache/ms-playwright', true)
  }}
agent_sandbox_worker_playwright_runtime_archive_path: "{{ lookup('env', 'HOST_PLAYWRIGHT_RUNTIME_ARCHIVE') | default('', true) }}"
agent_sandbox_worker_playwright_browsers_archive_path: "{{ lookup('env', 'HOST_PLAYWRIGHT_BROWSERS_ARCHIVE') | default('', true) }}"
agent_sandbox_worker_playwright_runtime_remote_archive_path: "{{ agent_sandbox_worker_root }}/images/playwright-runtime.tar.gz"
agent_sandbox_worker_playwright_browsers_remote_archive_path: "{{ agent_sandbox_worker_root }}/images/playwright-browsers.tar.gz"
agent_sandbox_worker_readonly_mounts:
  - "{{ agent_sandbox_worker_dotnet_cache_path }}:/opt/agent-sandbox/toolchains/dotnet"
  - "{{ agent_sandbox_worker_dotnet_tools_cache_path }}:/opt/agent-sandbox/toolchains/dotnet-tools"
  - "{{ agent_sandbox_worker_node_cache_path }}:/opt/agent-sandbox/toolchains/node-v24.14.0"
  - "{{ agent_sandbox_worker_playwright_runtime_cache_path }}:/opt/agent-sandbox/playwright-runtime"
  - "{{ agent_sandbox_worker_playwright_browsers_cache_path }}:/opt/agent-sandbox/ms-playwright"
  - "{{ agent_sandbox_worker_nuget_fallback_cache_path }}:/opt/agent-sandbox/nuget-cache-ro"

# Optional images to pre-pull during deployment. The repo-local runner tarball
# above remains the documented deployment path for agent-sandbox-runner:latest.
agent_sandbox_worker_preload_images: []
