---
- name: Deploy evander container worker VMs
  hosts: evander_worker_hosts
  become: true
  vars:
    evander_repo_parent: "{{ evander_deploy_path | dirname }}"
  pre_tasks:
    - name: Resolve local worker playbook revision
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ playbook_dir }}/.."
          - rev-parse
          - --verify
          - HEAD
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      register: evander_worker_playbook_revision
      when: evander_worker_enforce_revision_match | bool

    - name: Check worker deploy source tree for uncommitted contract changes
      ansible.builtin.command:
        argv: >-
          {{
            [
              'git',
              '-C',
              playbook_dir ~ '/..',
              'status',
              '--porcelain',
              '--untracked-files=all',
              '--'
            ]
            + evander_worker_revision_guard_paths
          }}
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      register: evander_worker_dirty_contract_paths
      when: evander_worker_enforce_revision_match | bool

    - name: Assert worker deploy contract changes are committed
      ansible.builtin.assert:
        that:
          - (evander_worker_dirty_contract_paths.stdout_lines | length) == 0
        fail_msg: >-
          Worker deployment renders systemd from the local playbook but installs
          daemon code from Git. Commit and push worker playbook/daemon contract
          changes before deploying, or set
          evander_worker_enforce_revision_match=false after confirming the
          target revision is compatible. Dirty paths={{
            evander_worker_dirty_contract_paths.stdout_lines
          }}
        success_msg: Worker deploy contract files are committed.
      when: evander_worker_enforce_revision_match | bool

    - name: Default worker repo checkout to the playbook revision
      ansible.builtin.set_fact:
        evander_repo_version: "{{ evander_worker_playbook_revision.stdout }}"
      when:
        - evander_worker_enforce_revision_match | bool
        - evander_worker_repo_version_mode == 'playbook_revision'

    - name: Resolve requested worker repo revision locally
      ansible.builtin.command:
        argv:
          - git
          - -C
          - "{{ playbook_dir }}/.."
          - rev-parse
          - --verify
          - "{{ evander_repo_version }}^{commit}"
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      register: evander_worker_requested_revision
      when: evander_worker_enforce_revision_match | bool

    - name: Assert worker playbook and daemon checkout revisions match
      ansible.builtin.assert:
        that:
          - evander_worker_requested_revision.stdout == evander_worker_playbook_revision.stdout
        fail_msg: >-
          Worker deployment would render Ansible templates from local commit
          {{ evander_worker_playbook_revision.stdout }} but install daemon
          code from evander_repo_version={{ evander_repo_version }}
          ({{ evander_worker_requested_revision.stdout }}). Run the
          playbook from the target revision, use the default playbook_revision
          mode, or set evander_worker_enforce_revision_match=false only
          after confirming the unit and daemon CLI are compatible.
        success_msg: Worker playbook and daemon checkout revisions match.
      when: evander_worker_enforce_revision_match | bool

    - name: Assert the worker token is configured
      ansible.builtin.assert:
        that:
          - (evander_worker_token | default('') | string | length) > 0
        fail_msg: >-
          evander_worker_token must be set from Vault or inventory. It is rendered
          only to the worker daemon env file and must match the control-plane
          container_worker_token_env value.
        success_msg: Worker token is configured.

    - name: Assert the worker sandbox profile is supported
      ansible.builtin.assert:
        that:
          - evander_worker_sandbox_profile in ['default', 'strict']
        fail_msg: "evander_worker_sandbox_profile must be either 'default' or 'strict'."
        success_msg: Worker sandbox profile is supported.

    - name: Resolve worker Docker network and egress allowlist
      ansible.builtin.set_fact:
        evander_worker_docker_network_normalized: >-
          {{ evander_worker_docker_network | default('none') | string | trim | lower }}
        evander_worker_effective_egress_policy_allow_tcp_endpoints: >-
          {{
            (evander_worker_egress_policy_allow_tcp_endpoints | default([]))
            + (evander_worker_egress_policy_extra_allow_tcp_endpoints | default([]))
          }}

    - name: Assert the worker Docker network is not host
      ansible.builtin.assert:
        that:
          - evander_worker_docker_network_normalized != 'host'
        fail_msg: "The container worker daemon refuses Docker host networking."
        success_msg: Worker Docker network is acceptable.

    - name: Assert non-none worker Docker networking has egress policy
      ansible.builtin.assert:
        that:
          - evander_worker_egress_policy_enabled | bool
          - (evander_worker_effective_egress_policy_allow_tcp_endpoints | length) > 0
        fail_msg: >-
          evander_worker_docker_network={{ evander_worker_docker_network }}
          requires evander_worker_egress_policy_enabled=true and at least
          one allowlisted endpoint in
          evander_worker_egress_policy_allow_tcp_endpoints or
          evander_worker_egress_policy_extra_allow_tcp_endpoints. Use
          evander_worker_docker_network=none for isolated containers.
        success_msg: Worker Docker network is paired with an egress policy.
      when: evander_worker_docker_network_normalized not in ['', 'none']

    - name: Assert networked Codex authentication has a restricted proxy
      ansible.builtin.assert:
        that:
          - (evander_worker_codex_egress_proxy_url | default('') | string | trim | length) > 0
          - (evander_worker_codex_egress_proxy_url | string) is match('^http://[^/]+(:[0-9]+)?$')
        fail_msg: >-
          Networked Codex authentication requires an HTTP CONNECT proxy URL.
          Set evander_worker_codex_egress_proxy_url to the private control-plane
          proxy endpoint; do not grant the worker or containers general internet
          access.
        success_msg: Networked Codex authentication has a restricted proxy endpoint.
      when:
        - evander_worker_docker_network_normalized not in ['', 'none']
        - (evander_worker_codex_auth_image | default('') | string | trim | length) > 0

    - name: Assert worker egress allowlist endpoints are concrete
      ansible.builtin.assert:
        that:
          - (item.host | default('') | string | trim | length) > 0
          - "'<' not in (item.host | string)"
          - "'>' not in (item.host | string)"
          - (item.port | int) > 0
          - (item.port | int) <= 65535
        fail_msg: >-
          Worker egress allowlist endpoints must use concrete private host or
          CIDR values and TCP ports from 1 through 65535. Invalid endpoint={{
            item
          }}.
        success_msg: Worker egress allowlist endpoint is concrete.
      loop: "{{ evander_worker_effective_egress_policy_allow_tcp_endpoints }}"
      when:
        - evander_worker_egress_policy_enabled | bool
        - evander_worker_docker_network_normalized not in ['', 'none']

    - name: Assert worker state paths are absolute
      ansible.builtin.assert:
        that:
          - evander_worker_root is match('^/')
          - evander_worker_runtime_dir is match('^/')
        fail_msg: "evander_worker_root and evander_worker_runtime_dir must be absolute paths."
        success_msg: Worker state paths are absolute.

    - name: Assert MSSQL seed sidecar configuration is complete
      ansible.builtin.assert:
        that:
          - evander_worker_mssql_enabled | bool
          - (evander_worker_mssql_seed_sidecar_token | default('') | string | length) > 0
          - (evander_worker_mssql_seed_sidecar_port | int) > 0
          - (evander_worker_mssql_seed_sidecar_port | int) <= 65535
          - evander_worker_mssql_seed_sidecar_backup_dir is match('^/')
          - evander_worker_mssql_seed_sidecar_data_dir is match('^/')
        fail_msg: >-
          evander_worker_mssql_seed_sidecar_enabled requires worker MSSQL,
          a non-empty evander_worker_mssql_seed_sidecar_token, a valid sidecar
          port, and absolute backup/data directories.
        success_msg: MSSQL seed sidecar configuration is complete.
      when: evander_worker_mssql_seed_sidecar_enabled | default(false) | bool

  roles:
    - role: worker_apt_proxy
    - role: host_prereqs
    - role: worker_git_access
    - role: repo_checkout
    - role: worker_package_cache_preflight
    - role: python_env
    - role: container_worker_runtime
    - role: worker_dotnet_toolchain
    - role: worker_node_toolchain
    - role: worker_playwright_toolchain
    - role: worker_mssql
    - role: worker_mssql_client_toolchain
    - role: worker_container_egress_policy
    - role: container_worker_service
    - role: browser_sessions_runtime
    - role: container_worker_verification
