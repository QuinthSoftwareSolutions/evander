[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evander-wordpress-addon"
version = "0.1.3"
description = "Recoverable WordPress content and source publication for Evander."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "evander>=0.120.2",
  "httpx>=0.28.1",
  "pydantic>=2.8.0",
  "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[project.entry-points."evander.addons"]
wordpress = "evander_wordpress_addon:register_addon"

[tool.setuptools.packages.find]
where = ["."]
include = ["evander_wordpress_addon*"]
namespaces = false

[tool.setuptools.package-data]
evander_wordpress_addon = ["addon.json", "checks.mjs", "companion/*.php", "ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
