[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evander-wordpress-addon"
version = "0.1.0"
description = "Recoverable WordPress content and source publication for Evander."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "evander>=0.73.0",
  "httpx>=0.28.1",
  "pydantic>=2.8.0",
  "starlette>=0.52.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2"]

[project.entry-points."evander.addons"]
wordpress = "evander_wordpress_addon:register_addon"

[tool.setuptools.packages.find]
where = ["."]
include = ["evander_wordpress_addon*"]
namespaces = false

[tool.setuptools.package-data]
evander_wordpress_addon = ["addon.json", "checks.mjs", "companion/*.php", "ui_static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
