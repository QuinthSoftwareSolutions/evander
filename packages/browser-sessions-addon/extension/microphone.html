<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enable Truman microphone</title><link rel="stylesheet" href="styles.css"></head>
<body><main><h1>Enable microphone</h1>
<p>Allow this extension to use your microphone. Voice recording stays in the Truman sidebar.</p>
<p>Recording starts only while you hold Talk. This window closes after permission is granted.</p>
<button id="allow" type="button">Allow microphone</button><button id="cancel" type="button">Cancel</button>
<p id="status" role="status"></p></main><script type="module" src="microphone.js"></script></body></html>
