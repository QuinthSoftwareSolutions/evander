[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
license = "AGPL-3.0-only AND Bitstream-Vera"
license-files = ["LICENSE", "evander_teams_graph_addon/assets/fonts/LICENSE.txt"]
name = "evander-teams-graph-addon"
version = "0.2.0"
description = "Optional Microsoft Teams, Graph mail, and meeting integration for Evander."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "evander>=0.123.0",
  "cryptography>=50.0.0",
  "httpx>=0.28.1",
  "pydantic>=2.8.0",
  "Pillow>=13.0.0",
  "starlette>=1.3.1",
  "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3"]

[project.entry-points."evander.addons"]
teams_graph = "evander_teams_graph_addon:register_addon"

[project.scripts]
evander-teams-ingest = "evander_teams_graph_addon.messaging.ingest:main"
evander-teams-notifications = "evander_teams_graph_addon.messaging.notifications:main"
evander-teams-meeting-ingest = "evander_teams_graph_addon.messaging.meeting_ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evander_teams_graph_addon*"]
namespaces = false

[tool.setuptools.package-data]
evander_teams_graph_addon = ["addon.json", "assets/systemd/*", "assets/config/*/*.example", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
