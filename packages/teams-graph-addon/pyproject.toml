[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evander-teams-graph-addon"
version = "0.2.0"
description = "Optional Microsoft Teams, Graph mail, and meeting integration for Evander."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "evander>=0.89.0",
  "cryptography>=43.0.0",
  "httpx>=0.28.1",
  "pydantic>=2.8.0",
  "starlette>=0.52.0",
  "uvicorn>=0.42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.2"]

[project.entry-points."evander.addons"]
teams_graph = "evander_teams_graph_addon:register_addon"

[project.scripts]
evander-teams-ingest = "evander_teams_graph_addon.messaging.ingest:main"
evander-teams-notifications = "evander_teams_graph_addon.messaging.notifications:main"
evander-teams-meeting-ingest = "evander_teams_graph_addon.messaging.meeting_ingest:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["evander_teams_graph_addon*"]
namespaces = false

[tool.setuptools.package-data]
evander_teams_graph_addon = ["addon.json", "assets/systemd/*", "assets/config/*/*.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
