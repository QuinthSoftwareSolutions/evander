[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evander-codex-security-addon"
version = "0.3.0"
description = "Codex Security provider for Evander repository security scans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["evander>=0.125.0"]

[project.entry-points."evander.addons"]
codex_security = "evander_codex_security_addon:register_addon"

[tool.setuptools.packages.find]
where = ["."]
include = ["evander_codex_security_addon*"]

[tool.setuptools.package-data]
evander_codex_security_addon = ["addon.json", "runner.py", "codex_bridge.py", "configure.mjs", "coverage_runner.py", "coverage_sdk.mjs", "coverage_projection.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
