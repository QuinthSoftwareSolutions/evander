[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "evander-rabbitmq-addon"
version = "0.1.0"
description = "Registered RabbitMQ services and disposable resources for Evander."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["evander>=0.98.0", "pydantic>=2.8.2", "httpx>=0.27.2"]
[project.optional-dependencies]
dev = ["pytest>=8.3.2", "pika>=1.3.2"]
[project.entry-points."evander.addons"]
rabbitmq = "evander_rabbitmq_addon:register_addon"
[project.scripts]
evander-rabbitmq-worker = "evander_rabbitmq_addon.worker:main"
[tool.setuptools]
include-package-data = false
[tool.setuptools.packages.find]
where = ["."]
include = ["evander_rabbitmq_addon*"]
namespaces = false
[tool.setuptools.package-data]
evander_rabbitmq_addon = ["addon.json", "ui_static/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
